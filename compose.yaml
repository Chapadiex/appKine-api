# Infraestructura local de AKINE.
#
# Levanta la base de datos y el servidor SMTP de prueba: el backend y el frontend corren
# fuera del contenedor, desde el IDE o desde la linea de comandos.
#
#   docker compose up -d
#   docker compose ps
#   docker compose down          # conserva los datos
#   docker compose down -v       # borra el volumen: base vacia otra vez
#
# Consultas de validacion durante el QA, sin instalar cliente PostgreSQL en la maquina:
#   docker compose exec postgres psql -U akine -d akine_local -c "SELECT 1;"
#
# Las credenciales de abajo son de una base LOCAL y efimera, con datos exclusivamente
# sinteticos. No son secretos y no existen fuera de tu maquina. Los entornos reales
# reciben sus credenciales por variable de entorno, nunca por archivo versionado.

services:
  postgres:
    # PostgreSQL 18 con pgvector 0.8.1. Version fijada, no "latest": el build tiene que ser
    # reproducible (plan, AKINE-00.01). La misma imagen usan los tests de integracion.
    # PostgreSQL 18 y no 17: LIKE sobre la collation no determinista akine_ci (sin mayusculas ni
    # tildes, la semantica de utf8mb4_0900_ai_ci que tenia MySQL) recien existe desde 18.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: akine-postgres
    restart: unless-stopped
    environment:
      # Superusuario del contenedor: solo crea el rol y la base de la aplicacion (ops/postgres/init).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Rol y base de la aplicacion, que crea el script de inicializacion.
      AKINE_DB_NAME: akine_local
      AKINE_DB_USER: akine
      AKINE_DB_PASSWORD: akine
      TZ: UTC
      PGTZ: UTC
    command:
      # La base guarda instantes UTC. La zona local se aplica en el dominio.
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
    ports:
      # Puerto del host parametrizable: si otro proyecto ya ocupa 5432, se levanta con
      #   AKINE_DB_PORT=5433 docker compose up -d
      # y se ajusta AKINE_DB_URL en consecuencia. Dentro del contenedor sigue siendo 5432.
      - "${AKINE_DB_PORT:-5432}:5432"
    volumes:
      - akine-postgres-data:/var/lib/postgresql
      # Corre una sola vez, con el volumen vacio: crea el rol akine, la base y las extensiones.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # El backend no debe arrancar contra una base que todavia no acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -U postgres -d akine_local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Servidor SMTP de desarrollo (AKINE-01.02b).
  #
  # Acepta todo lo que se le mande y NO lo reenvia a ningun lado: los correos quedan en el
  # contenedor y se miran por su interfaz web. Es exactamente lo que hace falta para trabajar
  # sobre activaciones e invitaciones sin riesgo de escribirle de verdad al buzon de alguien.
  #
  #   SMTP:            localhost:1025   (sin autenticacion, sin TLS)
  #   Bandeja de entrada: http://localhost:8025
  #
  # Se elige Mailpit sobre MailHog porque MailHog esta sin mantenimiento desde 2020; Mailpit es
  # su sucesor de facto, tiene la misma forma de uso y sigue recibiendo arreglos.
  #
  # SIN CREDENCIALES: el servidor arranca abierto porque solo escucha en esta maquina y solo
  # recibe datos sinteticos. No hay nada que versionar. Los entornos reales usan un relay de
  # verdad y reciben host, usuario y contrasena por variable de entorno.
  mailpit:
    # Version fijada, no "latest": misma regla que PostgreSQL.
    image: axllent/mailpit:v1.32.0
    container_name: akine-mailpit
    restart: unless-stopped
    environment:
      TZ: UTC
      # Los mensajes viven en memoria y se pierden al bajar el contenedor. Es lo correcto: un
      # correo de activacion lleva un enlace de un solo uso, y no hay razon para que sobreviva
      # a la sesion de trabajo que lo genero.
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Bandeja web. Parametrizable por si el 8025 esta ocupado.
      - "${AKINE_MAILPIT_UI_PORT:-8025}:8025"
      # SMTP. Es el que apunta application-local.yml.
      - "${AKINE_MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Modelo de lenguaje local de la consulta a la biblioteca (qwen3:4b-instruct). Opcional: sin el, solo
  # la consulta responde 503. Bajar el modelo: docker compose exec ollama ollama pull qwen3:4b-instruct
  ollama:
    # Fijada por digest (Ollama 0.40.16), no por tag.
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    container_name: akine-ollama
    restart: unless-stopped
    ports:
      # Solo en la maquina local: Ollama no tiene autenticacion.
      - "127.0.0.1:11434:11434"
    volumes:
      - akine-ollama-data:/root/.ollama

volumes:
  akine-postgres-data:
    name: akine-postgres-data
  akine-ollama-data:
    name: akine-ollama-data
