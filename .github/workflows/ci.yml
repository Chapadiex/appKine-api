name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela corridas viejas de la misma rama: solo interesa el ultimo commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  SONAR_MAVEN_VERSION: '5.8.0.7211'

jobs:
  build:
    name: Build, test y contrato
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Corre unit + arquitectura (ArchUnit) e integracion (Testcontainers sobre MySQL 8.4).
      # El runner de GitHub ya trae Docker, que Testcontainers necesita.
      #
      # OpenApiContractIT falla si openapi/akine-api.yaml quedo desactualizado respecto de
      # la implementacion: ese es el gate de drift del contrato.
      - name: Build y tests
        run: ./mvnw -B --no-transfer-progress verify

      # Doble red: si el contrato quedo desalineado y de algun modo el gate no lo detecto,
      # el diff lo delata igual.
      - name: Verificar que el contrato OpenAPI no tiene cambios sin commitear
        run: |
          if [ -n "$(git status --porcelain openapi/)" ]; then
            echo "::error::El contrato OpenAPI quedo desactualizado."
            echo "Regeneralo con: ./mvnw verify -Dakine.contract.update=true"
            git --no-pager diff -- openapi/
            exit 1
          fi
          echo "Contrato alineado con la implementacion."

      # El frontend consume este artefacto para generar su cliente TypeScript.
      # Se publica siempre, no solo en main: un PR que cambia la API debe poder probarse
      # contra el contrato resultante antes de mergear.
      - name: Publicar contrato OpenAPI versionado
        uses: actions/upload-artifact@v4
        with:
          name: akine-api-contract
          path: openapi/akine-api.yaml
          if-no-files-found: error
          retention-days: 90

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # Imagen Docker del backend con su SBOM (G-3).
  #
  # Construye la imagen con el Dockerfile de la raiz y NO la publica en ningun registry: el job
  # prueba que la receta compila y deja el SBOM como evidencia. Corre en paralelo con `build`:
  # la imagen no ejecuta tests (-DskipTests), los tests son responsabilidad del otro job.
  #
  # El SBOM se extrae DE LA IMAGEN y no de target/: asi el artifact es exactamente el inventario
  # de dependencias que viaja dentro del jar construido, no uno de un build paralelo.
  imagen:
    name: Imagen Docker y SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build --tag akine-api:${{ github.sha }} .

      - name: Extraer el SBOM embebido en la imagen
        run: |
          id=$(docker create akine-api:${{ github.sha }})
          mkdir -p sbom
          docker cp "$id:/app/META-INF/sbom/application.cdx.json" sbom/akine-api.cdx.json
          docker rm "$id"
          test -s sbom/akine-api.cdx.json
          echo "Imagen: $(docker image inspect akine-api:${{ github.sha }} --format '{{.Size}}') bytes"

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: akine-api-sbom
          path: sbom/akine-api.cdx.json
          if-no-files-found: error
          retention-days: 90

  # Vulnerabilidades conocidas de las dependencias Maven (AKINE G-6), con OWASP dependency-check.
  #
  # Falla SOLO con CVSS >= 7 (`failBuildOnCVSS` en el pom.xml): lo de severidad media o baja queda
  # en el reporte, que se publica siempre, y no frena el merge. Un falso positivo se silencia en
  # `dependency-check-suppressions.xml` con su motivo; nunca bajando el umbral.
  #
  # OWASP necesita el secreto `NVD_API_KEY` (gratuito: https://nvd.nist.gov/developers/request-an-api-key);
  # sin el, el job analiza contra OSV.dev. Detalle en docs/calidad.md §2.
  vulnerabilidades:
    name: Vulnerabilidades de dependencias (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Con NVD_API_KEY corre OWASP dependency-check. SIN clave, el NVD responde 429 a los runners
      # compartidos de GitHub antes de terminar la primera descarga (11/10/2026: corto al 15 %), asi
      # que el job cae a OSV.dev (ops/vulnerabilidades-osv.mjs): sin clave, en segundos, con el
      # mismo umbral (alta o critica) y las mismas excepciones de dependency-check-suppressions.xml.
      - name: Elegir analizador
        id: analizador
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "owasp=true" >> "$GITHUB_OUTPUT"
          else
            echo "owasp=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin NVD_API_KEY: se analiza contra OSV.dev en lugar de OWASP dependency-check."
          fi

      - name: Vulnerabilidades contra OSV.dev
        if: steps.analizador.outputs.owasp != 'true'
        run: |
          mkdir -p target/dependency-check
          ./mvnw -B --no-transfer-progress -q dependency:list -DincludeScope=runtime \
            -DoutputFile=target/dependency-check/dependencias.txt
          node ops/vulnerabilidades-osv.mjs target/dependency-check/dependencias.txt \
            | tee target/dependency-check/osv.txt

      # La base del NVD vive en ~/.cache/dependency-check (ver pom.xml) y NO en ~/.m2: asi no la
      # arrastra la cache de Maven de setup-java. La clave cambia cada dia; restore-keys arranca de
      # la mas reciente y el plugin baja solo lo modificado desde entonces.
      #
      # Restaurar, actualizar y guardar van separados del analisis a proposito: si el analisis
      # falla por un CVE, la base actualizada se guarda igual y la proxima corrida no vuelve a
      # bajar 400.000 registros.
      - name: Fecha para la cache del NVD
        if: steps.analizador.outputs.owasp == 'true'
        id: fecha
        run: echo "hoy=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar la base del NVD
        if: steps.analizador.outputs.owasp == 'true'
        id: nvd
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ steps.fecha.outputs.hoy }}
          restore-keys: nvd-

      - name: Actualizar la base del NVD
        if: steps.analizador.outputs.owasp == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B --no-transfer-progress "-DnvdApiKey=$NVD_API_KEY" dependency-check:update-only

      - name: Guardar la base del NVD
        if: steps.analizador.outputs.owasp == 'true' && steps.nvd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ steps.fecha.outputs.hoy }}

      - name: OWASP dependency-check
        if: steps.analizador.outputs.owasp == 'true'
        run: ./mvnw -B --no-transfer-progress -DautoUpdate=false dependency-check:check

      - name: Publicar reporte de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check/
          if-no-files-found: ignore
          retention-days: 30

  # Análisis de SonarQube (AKINE G-6). Listo y apagado hasta que existan la instancia y el token.
  #
  # Para activarlo alcanza con cargar dos secretos en Settings > Secrets and variables > Actions:
  #   SONAR_TOKEN     token de análisis del proyecto (SonarQube: My Account > Security)
  #   SONAR_HOST_URL  URL de la instancia, p. ej. https://sonarcloud.io o https://sonar.ejemplo.test
  # Sin los dos, el job termina en verde con un aviso y no corre el análisis. Detalle en
  # docs/calidad.md.
  #
  # No vuelve a correr los tests: reusa el jacoco.xml que publica `build` y sólo compila, para
  # que Sonar tenga los .class. Los PR desde forks no reciben secretos y también se saltean.
  sonar:
    name: Analisis SonarQube
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Verificar si SonarQube esta configurado
        id: config
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube sin configurar (faltan SONAR_TOKEN o SONAR_HOST_URL): se saltea el analisis."
          fi

      - name: Checkout
        if: steps.config.outputs.activo == 'true'
        uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para atribuir blame y detectar codigo nuevo.
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        if: steps.config.outputs.activo == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Bajar el reporte de cobertura del job build
        if: steps.config.outputs.activo == 'true'
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Analisis SonarQube
        if: steps.config.outputs.activo == 'true'
        run: >-
          ./mvnw -B --no-transfer-progress -DskipTests test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:${{ env.SONAR_MAVEN_VERSION }}:sonar
          -Dsonar.projectKey=akine-api
          -Dsonar.projectName=akine-api
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
