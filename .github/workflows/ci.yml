name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela corridas viejas de la misma rama: solo interesa el ultimo commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build, test y contrato
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para atribuir blame.
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Corre unit + arquitectura (ArchUnit) e integracion (Testcontainers sobre MySQL 8.4).
      # El runner de GitHub ya trae Docker, que Testcontainers necesita.
      #
      # OpenApiContractIT falla si openapi/akine-api.yaml quedo desactualizado respecto de
      # la implementacion: ese es el gate de drift del contrato.
      - name: Build y tests
        run: ./mvnw -B --no-transfer-progress verify

      # Doble red: si el contrato quedo desalineado y de algun modo el gate no lo detecto,
      # el diff lo delata igual.
      - name: Verificar que el contrato OpenAPI no tiene cambios sin commitear
        run: |
          if [ -n "$(git status --porcelain openapi/)" ]; then
            echo "::error::El contrato OpenAPI quedo desactualizado."
            echo "Regeneralo con: ./mvnw verify -Dakine.contract.update=true"
            git --no-pager diff -- openapi/
            exit 1
          fi
          echo "Contrato alineado con la implementacion."

      # El frontend consume este artefacto para generar su cliente TypeScript.
      # Se publica siempre, no solo en main: un PR que cambia la API debe poder probarse
      # contra el contrato resultante antes de mergear.
      - name: Publicar contrato OpenAPI versionado
        uses: actions/upload-artifact@v4
        with:
          name: akine-api-contract
          path: openapi/akine-api.yaml
          if-no-files-found: error
          retention-days: 90

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # Imagen Docker del backend con su SBOM (G-3).
  #
  # Construye la imagen con el Dockerfile de la raiz y NO la publica en ningun registry: el job
  # prueba que la receta compila y deja el SBOM como evidencia. Corre en paralelo con `build`:
  # la imagen no ejecuta tests (-DskipTests), los tests son responsabilidad del otro job.
  #
  # El SBOM se extrae DE LA IMAGEN y no de target/: asi el artifact es exactamente el inventario
  # de dependencias que viaja dentro del jar construido, no uno de un build paralelo.
  imagen:
    name: Imagen Docker y SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build --tag akine-api:${{ github.sha }} .

      - name: Extraer el SBOM embebido en la imagen
        run: |
          id=$(docker create akine-api:${{ github.sha }})
          mkdir -p sbom
          docker cp "$id:/app/META-INF/sbom/application.cdx.json" sbom/akine-api.cdx.json
          docker rm "$id"
          test -s sbom/akine-api.cdx.json
          echo "Imagen: $(docker image inspect akine-api:${{ github.sha }} --format '{{.Size}}') bytes"

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: akine-api-sbom
          path: sbom/akine-api.cdx.json
          if-no-files-found: error
          retention-days: 90

  # PENDIENTE(AKINE-00.02): activar cuando exista la instancia de SonarQube y su token.
