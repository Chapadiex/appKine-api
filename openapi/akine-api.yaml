          type: integer
          format: int64
          description: Identificador del vinculo creado
          example: 42
    DeactivateConsultorioRequest:
      type: object
      description: Motivo declarado de la baja de una sede
      properties:
        reason:
          type: string
          description: Por que se da de baja la sede. Queda en la auditoria y en la
            propia fila
          example: Cierre definitivo de la sucursal
          maxLength: 280
          minLength: 0
      required:
      - reason
    EffectivePermissionsResponse:
      type: object
