        active:
          type: boolean
          description: "Baja logica: false cuando el rol ya fue revocado"
          example: true
        grantedByAccountId:
          type: integer
          format: int64
          description: "Cuenta que lo otorgo, o null si vino del seed de migracion"
          example: 1
        id:
          type: integer
          format: int64
          description: Identificador del otorgamiento
          example: 2
        reason:
          type: string
          description: Motivo declarado del otorgamiento
        roleCode:
          type: string
          description: Codigo del rol
          example: PLATFORM_ADMIN
        validFrom:
          type: string
          format: date-time
          description: Momento desde el que rige
        validUntil:
          type: string
          format: date-time
          description: "Vencimiento, o null si no vence"
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    ProblemType:
      type: string
      description: |-
        Catalogo cerrado de los valores que puede tomar el campo type de un Problem Detail (RFC 7807). Es el unico campo del error pensado para que lo lea una maquina: el status agrupa demasiado y el detail es texto para personas. Ramificar por este valor y nunca por el detail.

        Agregar un valor es un cambio aditivo; quitarlo o resignificarlo es incompatible y exige version mayor del contrato.
      enum:
      - https://akine.app/problems/validation-error
      - https://akine.app/problems/unauthorized
      - https://akine.app/problems/forbidden
      - https://akine.app/problems/not-found
      - https://akine.app/problems/conflict
      - https://akine.app/problems/rate-limited
      - https://akine.app/problems/internal-error
      - https://akine.app/problems/invalid-credentials
      - https://akine.app/problems/invalid-refresh
      - https://akine.app/problems/invalid-token
      - https://akine.app/problems/missing-tenant-context
      - https://akine.app/problems/csrf-rejected
      - https://akine.app/problems/organization-slug-taken
      - https://akine.app/problems/invalid-subscription-transition
      - https://akine.app/problems/plan-limit-exceeded
      - https://akine.app/problems/feature-not-available
      - https://akine.app/problems/subscription-suspended
      - https://akine.app/problems/idempotency-key-conflict
      - https://akine.app/problems/concurrent-modification
      - https://akine.app/problems/membership-already-exists
      - https://akine.app/problems/membership-not-active
      - https://akine.app/problems/last-admin-required
      - https://akine.app/problems/self-revoke-not-allowed
      - https://akine.app/problems/grant-already-active
      - https://akine.app/problems/consultorio-name-taken
      - https://akine.app/problems/consultorio-inactive
      - https://akine.app/problems/consultorio-already-inactive
      - https://akine.app/problems/last-consultorio-required
      - https://akine.app/problems/consultorio-has-active-references
    RegisterAccountRequest:
      type: object
      description: "Alta self-service de cuenta, organizacion y primer consultorio"
