openapi: 3.1.0
info:
  contact:
    name: AKINE
    url: https://github.com/Chapadiex/appKine-api
  description: |-
    Contrato REST canonico de AKINE: SaaS multi-tenant para centros de kinesiologia, fisioterapia, rehabilitacion y actividades de salud.

    Este artefacto es propiedad del repositorio backend. El frontend genera su cliente TypeScript desde una version fijada de este contrato y no define DTO manuales.
  title: AKINE API
  version: 0.39.0
servers:
- description: Servidor que sirve este contrato
  url: /
tags:
- description: "Plan contratado, estado de la suscripcion e historico"
  name: Suscripciones
- description: Restablecimiento de contrasena por enlace de un solo uso
  name: Recuperacion
- description: Autorizaciones de financiador para un paciente (M17). Registran y habilitan;
    el consumo clinico es una integracion posterior
  name: Autorizaciones
- description: "Login, renovacion, seleccion de contexto y cierre de sesion"
  name: Sesion
- description: "Consulta, aceptacion y rechazo de una invitacion, con el token como\
    \ unica autoridad (M05)"
  name: Invitaciones recibidas
- description: "Convenios de la sede con planes de financiadores, y sus aranceles\
    \ (M16)"
  name: Convenios y aranceles
- description: Politica de feriados de una sede y feriados del periodo consultado
  name: Calendario de sede
- description: Reserva de slots con revalidacion atomica e idempotencia (M12)
  name: Turnos
- description: "Ordenes medicas presentadas por un paciente (M17). Documentacion ADMINISTRATIVA:\
    \ no reemplaza el registro clinico (RN-M17-004)"
  name: Ordenes medicas
- description: Contextos de trabajo habilitados para la cuenta autenticada
  name: Mi cuenta
- description: "Emision, listado, reenvio y cancelacion de invitaciones a colaborar\
    \ (M05)"
  name: Invitaciones
- description: "Administracion de la plataforma: acceso de soporte y roles globales"
  name: Plataforma
- description: Padron de personas y activacion del perfil clinico (M07)
  name: Personas
- description: "Contrato tecnico: salud y versionado"
  name: Platform
- description: Deuda derivada de prestaciones. No es el cobro ni la caja (M18)
  name: Obligaciones
- description: "Bloqueo, desbloqueo y baja logica de cuentas de la propia organizacion"
  name: Administracion de cuentas
- description: Cierres y aperturas puntuales de una sede o de un profesional
  name: Excepciones de disponibilidad
- description: "Vinculos de las cuentas con la organizacion, sus roles y sus permisos"
  name: Colaboradores
- description: Alta self-service y habilitacion de la cuenta
  name: Registro y activacion
- description: Horario semanal de un profesional en una sede y su disponibilidad efectiva
  name: Disponibilidad profesional
- description: "Especialidades, practicas, nomencladores y sus vigencias (M06)"
  name: Catalogo clinico
- description: Documentos administrativos de una persona (M07/M25)
  name: Adjuntos
- description: Catalogo global de servicios y como cada sede los presta (M27)
  name: Servicios y ofertas
- description: "Alta, edicion y baja de las sedes de una organizacion"
  name: Consultorios
- description: "Turnos disponibles calculados a partir de disponibilidad, oferta y\
    \ habilitaciones (M12)"
  name: Agenda
- description: "Dinero recibido, sus medios y sus imputaciones (M19)"
  name: Cobros
- description: Coberturas particulares y financiadas de un paciente (M08)
  name: Coberturas del paciente
- description: "Que documentacion exige el convenio y si el paciente la tiene (M17).\
    \ Consulta preliminar: no persiste ni consume nada"
  name: Elegibilidad administrativa
- description: Consulta del registro de hechos de la organizacion
  name: Auditoria
- description: Alta y administracion de tenants y sus sedes
  name: Organizaciones
- description: Catalogo de financiadores y planes de cobertura de la organizacion
    (M15)
  name: Financiadores y planes
- description: "Atencion real: inicio idempotente y guardado de borrador (M14)"
  name: Sesiones
- description: "Catalogo comercial: que incluye cada plan"
  name: Planes
- description: "Alta, edicion, baja y disponibilidad de los espacios fisicos de una\
    \ sede"
  name: Espacios
paths:
  /api/v1/accounts/{accountId}/block:
    post:
      description: |-
        Suspende el acceso y revoca todas las sesiones vivas de la cuenta en la misma transaccion. Es reversible con /unblock.

        El access token ya emitido sigue siendo valido hasta diez minutos: la revocacion es real sobre el refresh, no sobre el access en vuelo (ADR-0017). No es un bug.

        La persona bloqueada NO se entera por la aplicacion: su login sigue respondiendo el mismo 401 que una contrasena incorrecta (ADR-0018). Se entera por el canal administrativo.

        El motivo es obligatorio y queda en la auditoria. Bloquear una cuenta ya bloqueada responde 409, no un 200 silencioso: dos administradores operando a la vez tienen que enterarse de que el otro llego primero.
      operationId: blockAccount
      parameters:
      - description: Identificador de la cuenta
        example: 42
        in: path
        name: accountId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStateChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Cuenta bloqueada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o el actor no administra su organizacion"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no existe o no tiene membership en la organizacion
            del actor. Los dos casos responden igual
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no admite bloquearse desde su estado actual
      summary: Bloquear una cuenta
      tags:
      - Administracion de cuentas
  /api/v1/accounts/{accountId}/deactivate:
    post:
      description: |-
        Estado TERMINAL: desde la aplicacion no hay vuelta. Revoca todas las sesiones vivas en la misma transaccion.

        Es baja LOGICA: la fila no se borra. Los turnos, sesiones y movimientos que referencian a esta cuenta tienen que seguir siendo legibles (RN-M02-004, regla maestra 10). Lo que queda es active = 0 con deleted_at.

        Como es irreversible, el motivo es lo unico que va a quedar para explicarla: escribirlo con precision no es formalidad.
      operationId: deactivateAccount
      parameters:
      - description: Identificador de la cuenta
        example: 42
        in: path
        name: accountId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStateChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Cuenta desactivada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o el actor no administra su organizacion"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no existe o no es de la organizacion del actor
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta ya estaba desactivada
      summary: Baja logica de la cuenta
      tags:
      - Administracion de cuentas
  /api/v1/accounts/{accountId}/unblock:
    post:
      description: |-
        Vuelve la cuenta a ACTIVA. No revoca nada: llego aca sin sesiones vivas, porque el bloqueo ya las corto. La persona tiene que volver a loguearse.

        El motivo se exige igual, aunque la maquina de estados no lo pida para este destino: devolverle el acceso a alguien es tan auditable como quitarselo, y "por que lo desbloquearon" aparece en las mismas revisiones que la otra pregunta.
      operationId: unblockAccount
      parameters:
      - description: Identificador de la cuenta
        example: 42
        in: path
        name: accountId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStateChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Cuenta desbloqueada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o el actor no administra su organizacion"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no existe o no es de la organizacion del actor
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no estaba bloqueada
      summary: Devolver el acceso a una cuenta bloqueada
      tags:
      - Administracion de cuentas
  /api/v1/auth/activate:
    post:
      description: |-
        Consume el token del correo, deja la cuenta ACTIVA e invalida los demas enlaces de activacion que hubiera vivos. Si se pidio el reenvio tres veces, el que se use mata a los otros dos: un enlace no usado sigue siendo una llave.

        La contrasena solo hace falta si la cuenta todavia no tiene credencial —invitacion, 01.03—. En el alta self-service ya la tiene y enviarla NO la cambia: cambiarla por este camino seria una toma de cuenta que esquiva el reset, que si revoca todas las sesiones.

        Token inexistente, ya usado, invalidado por uno mas nuevo, vencido o del tipo equivocado responden los cinco el mismo 400 invalid-token. Decir "expirado" le confirmaria a quien prueba valores que acerto uno real.

        Activar NO abre sesion: despues de esto el frontend manda al login.
      operationId: activateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccountRequest"
        required: true
      responses:
        "204":
          description: Cuenta activada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Token invalido, usado o vencido; o contrasena que no cumple\
            \ la politica cuando la cuenta no tenia credencial"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no admite activarse desde su estado actual
      summary: Confirmar el enlace y habilitar la cuenta
      tags:
      - Registro y activacion
  /api/v1/auth/activation/resend:
    post:
      description: |-
        Emite un enlace nuevo e invalida los anteriores. Es el camino para "el correo no me llego" o "el enlace vencio".

        RESPUESTA UNIFORME (ADR-0018): 202 con el mismo cuerpo en los cuatro casos —cuenta pendiente, cuenta ya activa, cuenta bloqueada o desactivada, y email sin cuenta—. Solo el primero emite algo. La diferencia no se publica ni por el estado, ni por el cuerpo, ni por un header.

        Emitir invalida los enlaces anteriores: pedir el reenvio tres veces deja UNA llave viva, no tres.
      operationId: resendActivation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendActivationRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
          description: Solicitud aceptada. Mismo cuerpo exista o no la cuenta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el email
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Reenviar el enlace de activacion
      tags:
      - Registro y activacion
  /api/v1/auth/context:
    post:
      description: |-
        Emite un access token acotado a una Organizacion y un Consultorio. Es el paso que convierte un token pre_context en uno operativo (DP-02).

        NO renueva el refresh ni entrega una cookie nueva: la sesion es la misma, lo que cambia es el alcance del access. Lo que si hace es dejar el contexto recordado en la familia viva, para que la proxima renovacion vuelva sobre el mismo lugar en vez de devolver a la pantalla de seleccion cada diez minutos.

        Sirve tambien para CAMBIAR de contexto sin volver a loguearse, y cada cambio queda auditado.

        Un par no accesible —consultorio inexistente, de otra organizacion, membership vencida o suscripcion cancelada— responde 404, nunca 403: un 403 confirmaria que ese consultorio existe y bastaria recorrer ids para mapear los centros de la competencia.
      operationId: selectContext
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectContextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: Access token acotado al contexto elegido
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Identificadores ausentes o no positivos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El contexto no existe o no esta disponible para esta cuenta
      summary: Elegir el contexto de trabajo y renovar el access token
      tags:
      - Sesion
  /api/v1/auth/invitations/accept:
    post:
      description: |-
        Publico: la autoridad es el token.

        Si el invitado no tiene cuenta, la crea EN ESTE MISMO ACTO y ya ACTIVA, sin un segundo correo de activacion: el token que acaba de presentar ya probo que llega a esa direccion, y verificarlo dos veces solo agrega el paso donde la mitad de la gente abandona. Para eso hacen falta nombre y contrasena, que pasa por la misma politica que el registro self-service.

        Si ya tiene cuenta, nombre y contrasena se IGNORAN. Reescribirlos seria una via para tomarle la cuenta a otro con solo invitarlo.

        NO DEVUELVE SESION. Quien acepta con una cuenta que ya tenia probo que llega al buzon, no que la cuenta sea suya: una casilla abierta en una maquina compartida alcanza para lo primero y no para lo segundo. La pantalla siguiente es el login.

        Aceptar consume cupo del plan. Si el tenant llego al tope, la respuesta es 409 y la invitacion queda pendiente.
      operationId: acceptInvitacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitacionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitacionResponse"
          description: Vinculo creado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el token, o faltan nombre y contrasena cuando hay que\
            \ crear la cuenta, o la contrasena no cumple la politica"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El token no resuelve o la invitacion ya fue resuelta
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El enlace vencio (invitacion-vencida), la persona ya fue vinculada\
            \ por otro camino (colaborador-ya-vinculado), o el tenant llego al tope\
            \ de miembros de su plan"
      summary: Aceptar una invitacion y quedar vinculado
      tags:
      - Invitaciones recibidas
  /api/v1/auth/invitations/decline:
    post:
      description: |-
        Publico: la autoridad es el token.

        Consume la invitacion —queda RECHAZADA y el enlace deja de servir— y NO CREA NINGUNA CUENTA: quien no quiere entrar no tiene por que quedar registrado en AKINE.

        El motivo es opcional. Rechazar una oferta de trabajo no exige explicarse. La cancelacion del administrador, en cambio, si exige motivo.

        El rechazo no bloquea nada: se puede volver a invitar a esa persona mas adelante.
      operationId: declineInvitacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineInvitacionRequest"
        required: true
      responses:
        "204":
          description: Invitacion rechazada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el token
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El token no resuelve o la invitacion ya fue resuelta
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El enlace vencio (invitacion-vencida)
      summary: Rechazar una invitacion recibida
      tags:
      - Invitaciones recibidas
  /api/v1/auth/invitations/preview:
    post:
      description: |-
        Publico: la autoridad es el token, no una sesion.

        NO CONSUME LA INVITACION. Un enlace que se gasta al mirarlo deja al invitado sin poder aceptar apenas recargue la pantalla, o apenas su cliente de correo lo pre-visite para armar una vista previa.

        requiereRegistro le dice a la pantalla si pedir nombre y contrasena. Es lo unico que este endpoint revela sobre la existencia de una cuenta, y solo se lo revela a quien ya probo que llega a ese buzon.

        La respuesta no trae ningun id: quien presenta el token no pertenece a la organizacion, y cada id que se le entregue es una pieza mas para adivinar el resto.
      operationId: previewInvitacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitacionTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitacionPreviewResponse"
          description: Datos de la invitacion
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el token
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El token no resuelve, o la invitacion ya fue resuelta. Los\
            \ casos responden igual"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El enlace vencio (invitacion-vencida). Se distingue del 404\
            \ a proposito: la salida es pedir un reenvio"
      summary: "Ver que dice una invitacion, sin consumirla"
      tags:
      - Invitaciones recibidas
  /api/v1/auth/login:
    post:
      description: |-
        Verifica las credenciales y emite el par de tokens de una sesion nueva.

        El access token sale en el cuerpo y dura diez minutos. El refresh token NO sale en el cuerpo: viaja en la cookie akine_rt, que es httpOnly, Secure, SameSite=Strict y esta acotada a Path=/api/v1/auth. El cliente no puede leerla ni necesita hacerlo; para renovar solo llama a POST /auth/refresh con credentials incluidas.

        El token sale con alcance pre_context: autentica la identidad y no habilita ninguna operacion de negocio. El paso siguiente es GET /api/v1/me/contexts y despues POST /api/v1/auth/context.

        RECHAZO UNIFORME (ADR-0018): email inexistente, contrasena incorrecta y contrasena correcta sobre una cuenta bloqueada, desactivada o pendiente de activacion devuelven las tres el MISMO 401 con el MISMO cuerpo, y con un tiempo de respuesta equivalente. No hay forma de distinguir los tres casos desde el cliente, y es deliberado: la diferencia convertiria este endpoint en un verificador de direcciones y de credenciales filtradas de otros sitios. Quien tenga la cuenta bloqueada se entera por el canal administrativo.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: Sesion abierta. El refresh viaja en la cabecera Set-Cookie
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el email o la contrasena
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Credenciales invalidas. Mismo cuerpo para las tres causas
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Autenticar y abrir una sesion
      tags:
      - Sesion
  /api/v1/auth/logout:
    post:
      description: |-
        Revoca la familia de refresh a la que pertenece la cookie presentada y borra la cookie del navegador.

        SIEMPRE responde 204, incluso sin cookie o con una que no corresponde a ninguna sesion. Es idempotente por construccion y no es una comodidad: un logout que fallara ante un token desconocido seria un oraculo de tokens validos, y ademas dejaria al frontend sin poder limpiar su estado justo cuando la cookie ya no sirve.

        Cierra SOLO esta sesion. Los otros dispositivos siguen abiertos; para echarlos a todos esta DELETE /api/v1/auth/sessions.
      operationId: logout
      responses:
        "204":
          description: "Sesion cerrada, o no habia ninguna. Siempre este codigo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El Origin del request no es uno de los permitidos: se rechaza\
            \ como CSRF"
      summary: Cerrar la sesion en curso
      tags:
      - Sesion
  /api/v1/auth/password-reset:
    post:
      description: |-
        Emite un token de un solo uso, valido treinta minutos, y encola el correo con el enlace. Emitir uno nuevo invalida los anteriores: pedirlo tres veces deja UN enlace vivo, no tres.

        RESPUESTA UNIFORME (ADR-0018): 202 con el mismo cuerpo y el mismo tiempo de respuesta exista o no la cuenta, y este o no habilitada. Solo el caso "existe y puede autenticarse" emite algo.

        Consecuencia incomoda y deliberada: quien tenga la cuenta bloqueada va a recibir este 202, no va a recibir ningun correo, y no hay forma de que la aplicacion se lo diga. Se entera por el canal administrativo. Si se "arreglara" respondiendo distinto, el endpoint pasaria a confirmar que direcciones tienen cuenta.

        El enlace apunta a una pantalla del frontend que lee el token de la query y lo reenvia por POST a /auth/password-reset/confirm.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
          description: Solicitud aceptada. Mismo cuerpo exista o no la cuenta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el email
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Pedir un enlace para restablecer la contrasena
      tags:
      - Recuperacion
  /api/v1/auth/password-reset/confirm:
    post:
      description: |-
        Consume el token, fija la contrasena nueva y REVOCA TODAS las sesiones vivas de la cuenta en la misma transaccion. La respuesta borra ademas la cookie de refresh de este navegador, que quedo apuntando a una familia revocada.

        Confirmar NO abre sesion: despues de esto el frontend manda al login. Es deliberado —la persona acaba de demostrar que controla el correo, no que recuerda la contrasena que acaba de elegir— y hace que el flujo termine siempre en el mismo lugar.

        Token inexistente, usado, invalidado, vencido o de una cuenta que se bloqueo entre el pedido y la confirmacion: los cinco casos responden el mismo 400 invalid-token.
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
        required: true
      responses:
        "204":
          description: Contrasena actualizada y sesiones revocadas
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Token invalido, usado o vencido; o contrasena que no cumple\
            \ la politica"
      summary: Fijar la contrasena nueva con el token del correo
      tags:
      - Recuperacion
  /api/v1/auth/refresh:
    post:
      description: |-
        Canjea el refresh de la cookie akine_rt por un par nuevo. No lleva cuerpo: la credencial es la cookie, y ponerla ademas en el body la expondria al JavaScript de la pagina.

        ROTACION ESTRICTA: cada canje invalida el refresh presentado y entrega uno nuevo en la misma familia, heredando el vencimiento ABSOLUTO de la sesion. Renovar no extiende la sesion: a las doce horas del login cae aunque se haya refrescado sin parar.

        DETECCION DE REUSO: presentar un refresh ya canjeado revoca la familia completa —victima y atacante quedan afuera— y responde 401. Ese 401 es IDENTICO al de un token inexistente o vencido: el cliente no puede distinguir "te detectamos" de "no servia", y es a proposito.

        Si el contexto que la sesion recordaba dejo de ser accesible —membership revocada, suscripcion cancelada— el par nuevo sale degradado a pre_context en vez de fallar: la persona sigue autenticada y el frontend la manda a elegir contexto otra vez.

        El frontend debe serializar las renovaciones concurrentes con una cola single-flight: dos pestanas refrescando a la vez producen un reuso legitimo y se quedan las dos afuera.
      operationId: refreshSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: "Sesion renovada, con un refresh nuevo en Set-Cookie"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Refresh ausente, invalido, vencido, revocado o reusado. Los\
            \ cinco casos responden igual y la respuesta borra la cookie"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El Origin del request no es uno de los permitidos por configuracion:\
            \ se rechaza como CSRF"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Renovar la sesion presentando la cookie de refresh
      tags:
      - Sesion
  /api/v1/auth/register:
    post:
      description: |-
        Crea en una sola transaccion la cuenta del fundador, la organizacion, su primer consultorio, la suscripcion y la membership de administrador, y encola el correo con el enlace de activacion.

        RESPUESTA UNIFORME (ADR-0018): 202 Accepted con el mismo cuerpo tanto si el email estaba libre como si ya tenia cuenta. En el segundo caso no se crea ni se modifica nada y se encola un correo de "ya tenes cuenta". No hay 409 email-already-registered y no va a haberlo: seria el oraculo de existencia que el 401 uniforme del login existe para cerrar.

        La cuenta nace PENDIENTE_ACTIVACION. Hasta confirmar el enlace, el login responde 401 igual que con una contrasena incorrecta.

        El header Idempotency-Key es obligatorio. Reintentar el alta con la misma clave devuelve el mismo desenlace sin crear una segunda cuenta ni mandar un segundo correo; el cliente debe generarlo una vez al abrir el formulario y reusarlo en cada reintento.

        Los rechazos posibles no dicen nada sobre el email: 400 por contrasena que no cumple la politica o por campos ausentes, 404 por un planCode que no existe o ya no se contrata, y 409 por un organizationSlug ya tomado. Los tres se evaluan ANTES de mirar si el email tiene cuenta, justamente para que la respuesta sea la misma en los dos casos: validarlos despues convertiria el endpoint en un verificador de direcciones de correo.
      operationId: registerAccount
      parameters:
      - description: "Identificador unico del intento, generado por el cliente. Reintentar\
          \ la misma alta debe reusar el mismo valor."
        example: 0f9d5f6e-1c2b-4a3d-9e8f-7a6b5c4d3e2f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
          description: Solicitud aceptada. Mismo cuerpo exista o no la cuenta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, contrasena que no cumple la politica, o\
            \ falta el header Idempotency-Key"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El planCode pedido no existe o ya no se contrata. Misma respuesta
            exista o no la cuenta
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El organizationSlug pedido ya lo usa otro tenant. Misma respuesta
            exista o no la cuenta
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: "Alta self-service de cuenta, organizacion y primer consultorio"
      tags:
      - Registro y activacion
  /api/v1/auth/sessions:
    delete:
      description: |-
        Revoca todos los refresh vivos de la cuenta autenticada, en todos sus dispositivos, y borra la cookie de este navegador.

        Es la accion de "cerrar sesion en todos lados" que corresponde despues de perder un telefono o de sospechar un acceso ajeno. Opera SOLO sobre la propia cuenta: el identificador sale del principal y no hay parametro que lo cambie.

        Los access token ya emitidos siguen siendo criptograficamente validos hasta diez minutos (ADR-0017): la revocacion es real sobre el refresh, no sobre el access en vuelo.
      operationId: closeAllSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosedSessionsResponse"
          description: Sesiones revocadas. Cero es un resultado valido
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
      summary: Cerrar todas las sesiones de la propia cuenta
      tags:
      - Sesion
  /api/v1/catalogo-solicitudes:
    get:
      description: |-
        Un administrador de tenant ve LAS SUYAS; un administrador de plataforma ve la bandeja completa de todos los tenants. Es la unica consulta cross-tenant del modulo, y por eso el rol se verifica antes de elegir la consulta y no filtrando el resultado despues.

        El filtro estado es opcional: sin el, todas. Ordenadas de la mas reciente a la mas vieja.

        No hay paginado, y es una decision consciente: la cantidad de conceptos que un centro pide agregar al catalogo comun se cuenta con los dedos. Si algun dia no fuera asi, eso seria el problema.
      operationId: listCatalogoSolicitudes
      parameters:
      - description: Solo las solicitudes en ese estado
        example: PENDIENTE
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - PENDIENTE
          - APROBADA
          - RECHAZADA
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogoSolicitudResponse"
          description: Solicitudes visibles. Lista vacia si no hay ninguna
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El valor de estado no pertenece al catalogo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada o no hay contexto de trabajo
      summary: Solicitudes de alta de catalogo
      tags:
      - Catalogo clinico
    post:
      description: |-
        Registra el pedido de un centro para que la plataforma incorpore una especialidad, una practica o un nomenclador al catalogo comun (RF-M06-005).

        La justificacion es obligatoria: sin ella la plataforma no puede decidir y la solicitud es ruido.

        Un segundo pedido identico —mismo tenant, mismo tipo, mismo nombre— mientras el primero sigue PENDIENTE responde 409 catalogo-solicitud-duplicada. Es la idempotencia frente a un reintento por timeout de red, y la sostiene un unique de la base, no una comprobacion previa: entre un SELECT y un INSERT caben dos requests. Volver a pedir algo ya RECHAZADO si esta permitido, con argumentos nuevos.

        La administracion de plataforma no puede usar este endpoint: no se pide conceptos a si misma, los crea.

        Exige consultorio:manage sobre la sede del contexto.
      operationId: createCatalogoSolicitud
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogoSolicitudRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoSolicitudResponse"
          description: Solicitud registrada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el tipo, el nombre propuesto o la justificacion"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, sin consultorio:manage, o es un administrador\
            \ de plataforma"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya hay una solicitud PENDIENTE por ese mismo concepto (catalogo-solicitud-duplicada)
      summary: Pedir el alta de un concepto global
      tags:
      - Catalogo clinico
  /api/v1/catalogo-solicitudes/{solicitudId}/resolve:
    post:
      description: |-
        Reservado a la administracion de plataforma. La resolucion es TERMINAL: una solicitud aprobada o rechazada no se reabre. Si la plataforma se equivoco, el centro vuelve a pedir, y esa segunda solicitud es una fila nueva con su propia justificacion y su propia fecha.

        APROBAR NO CREA EL CONCEPTO GLOBAL, y es deliberado: el concepto que la plataforma termina publicando casi nunca es el que el centro propuso —el codigo se normaliza, el nombre se unifica con los que ya existen— y crearlo automaticamente desde el texto de un pedido llenaria el catalogo comun de duplicados con nombres parecidos, que es exactamente lo que este circuito existe para evitar. La plataforma aprueba y despues publica el concepto por el alta normal.

        La nota es obligatoria en los dos desenlaces. version se compara antes de mutar: dos administradores de plataforma sobre la misma bandeja tienen que enterarse de que el otro llego primero.
      operationId: resolveCatalogoSolicitud
      parameters:
      - description: Identificador de la solicitud
        example: 1
        in: path
        name: solicitudId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCatalogoSolicitudRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoSolicitudResponse"
          description: Solicitud resuelta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta la nota, falta la version, o el desenlace es PENDIENTE"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no administra la plataforma. Nunca 401
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La solicitud no existe
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ya estaba resuelta (catalogo-solicitud-ya-resuelta), o version\
            \ desactualizada (concurrent-modification)"
      summary: Aprobar o rechazar una solicitud
      tags:
      - Catalogo clinico
  /api/v1/catalogos/nomencladores/{nomencladorId}/items:
    get:
      description: |-
        Devuelve las vigencias de los codigos del nomenclador, ordenadas por codigo y, dentro de cada codigo, de la mas nueva a la mas vieja: es el orden en el que la pantalla las necesita, porque lo primero que se consulta es que rige hoy y despues que regia antes.

        estado vale ACTIVO por defecto. practicaId y codigo son filtros opcionales: codigo es exacto —no una busqueda— porque un codigo de nomenclador se conoce entero o no se conoce.

        Esta consulta es el historial completo. La resolucion puntual —que decia este codigo el dia D— la usan los modulos de convenios y sesiones por el puerto interno del modulo, no por HTTP.
      operationId: listNomencladorVigencias
      parameters:
      - description: Identificador del nomenclador
        example: 1
        in: path
        name: nomencladorId
        required: true
        schema:
          type: integer
          format: int64
      - description: Que vigencias devolver segun su ciclo de vida
        example: ACTIVO
        in: query
        name: estado
        required: false
        schema:
          type: string
          default: ACTIVO
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: Solo las vigencias que codifican esa practica
        example: 1
        in: query
        name: practicaId
        required: false
        schema:
          type: integer
          format: int64
      - description: Solo las vigencias de ese codigo exacto
        example: 27.01.01
        in: query
        name: codigo
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: Vigencias del nomenclador. Lista vacia si no hay ninguna
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada o no hay contexto de trabajo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El nomenclador no existe o es de otro tenant
      summary: Vigencias de un nomenclador
      tags:
      - Catalogo clinico
    post:
      description: |-
        Define que dice un codigo del nomenclador durante una ventana de tiempo, y con que valor de referencia (RF-M06-003, RN-M06-003).

        LEER ESTO ANTES DE ESCRIBIR LA PANTALLA. Actualizar un codigo NO es editar su vigencia anterior: es cerrar la vieja —PATCH con validUntil— y crear una nueva desde ese mismo instante. Editar la vieja borraria lo que ese codigo decia cuando se uso, y un convenio de 2024 dejaria de poder explicarse. Como el fin de vigencia es EXCLUSIVO, cerrar en T y abrir en T no se solapa.

        Dos vigencias del mismo codigo que se pisan responden 409 nomenclador-vigencia-overlap, con la ventana en conflicto en el cuerpo para que la pantalla pueda decir contra que choco.

        La vigencia HEREDA el duenio del nomenclador y no lo puede elegir: por eso no hay campo alcance. Un nomenclador GLOBAL solo puede codificar practicas GLOBALES (409 catalogo-scope-mismatch).

        Exige poder mutar el nomenclador: consultorio:manage si es del tenant, rol de plataforma si es global.
      operationId: createNomencladorVigencia
      parameters:
      - description: Identificador del nomenclador
        example: 1
        in: path
        name: nomencladorId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVigenciaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: Vigencia creada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, valor negativo o ventana incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto, o sin permiso para mutar ese nomenclador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El nomenclador o la practica no existen, o son de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Vigencias solapadas (nomenclador-vigencia-overlap), nomenclador\
            \ o practica dados de baja (catalogo-reference-inactive), o alcance incompatible\
            \ (catalogo-scope-mismatch)"
      summary: Nueva vigencia de un codigo del nomenclador
      tags:
      - Catalogo clinico
  /api/v1/catalogos/nomencladores/{nomencladorId}/items/{itemId}/deactivate:
    post:
      description: |-
        Da de baja una vigencia cargada por error, con motivo obligatorio.

        NO es el camino para cerrar una vigencia que termino: eso se hace poniendole validUntil con PATCH. Dar de baja la saca de las selecciones nuevas pero deja intacto lo que ya resolvio, porque la resolucion historica de un codigo no filtra por estado —justamente para que un convenio viejo siga diciendo lo que decia—.

        Exige poder mutar el nomenclador al que pertenece.
      operationId: deactivateNomencladorVigencia
      parameters:
      - description: Identificador del nomenclador
        example: 1
        in: path
        name: nomencladorId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la vigencia
        example: 1
        in: path
        name: itemId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateCatalogoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: Vigencia dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto, o sin permiso para mutar ese nomenclador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El nomenclador o la vigencia no existen, son de otro tenant,\
            \ o la vigencia pertenece a otro nomenclador"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya estaba dada de baja (catalogo-already-inactive)
      summary: Baja logica de una vigencia
      tags:
      - Catalogo clinico
  /api/v1/catalogos/{tipo}:
    get:
      description: |-
        Devuelve los conceptos que el tenant del contexto puede ver: los del catalogo de PLATAFORMA mas los PROPIOS, en la misma lista (RF-M06-004). Es la consulta de todo selector clinico y economico.

        El texto q se compara contra el nombre Y el codigo, sin distinguir mayusculas ni acentos —lo resuelve la collation de la base, no una columna normalizada—. Los comodines del cliente se escapan, asi que tipear un % no devuelve el catalogo entero.

        estado vale ACTIVO por defecto, y eso es lo que hace que un selector NUNCA ofrezca un concepto dado de baja. Los inactivos hay que pedirlos explicitamente, y la pantalla de administracion los necesita para explicar por que un codigo esta tomado o libre.

        alcance vale TODOS por defecto, que es lo que un formulario necesita: al elegir una practica no importa si es de plataforma o del centro. GLOBAL y ORGANIZACION existen para la pantalla de administracion, que si tiene que separarlas porque lo global no lo puede editar el tenant.

        especialidadId solo aplica a practicas y se ignora en los otros tipos.

        El tamano de pagina se acota a 100: pedir mas devuelve ese maximo, no un error.
      operationId: searchCatalogo
      parameters:
      - description: Coleccion del catalogo
        example: practicas
        in: path
        name: tipo
        required: true
        schema:
          type: string
          enum:
          - especialidades
          - practicas
          - nomencladores
      - description: Texto a buscar en el nombre o en el codigo
        example: kinesio
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Que conceptos devolver segun su ciclo de vida
        example: ACTIVO
        in: query
        name: estado
        required: false
        schema:
          type: string
          default: ACTIVO
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: Que conceptos devolver segun su duenio
        example: TODOS
        in: query
        name: alcance
        required: false
        schema:
          type: string
          default: TODOS
          enum:
          - GLOBAL
          - ORGANIZACION
          - TODOS
      - description: Solo practicas de esa especialidad. Ignorado en los otros tipos
        example: 1
        in: query
        name: especialidadId
        required: false
        schema:
          type: integer
          format: int64
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Elementos por pagina, acotado a 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoPageResponse"
          description: Pagina de conceptos. Contenido vacio si la pagina quedo fuera
            de rango
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Tipo de ruta desconocido, o valor de estado o alcance fuera\
            \ del catalogo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada o no hay contexto de trabajo
      summary: Busqueda incremental en el catalogo
      tags:
      - Catalogo clinico
    post:
      description: |-
        Crea una especialidad, una practica o un nomenclador (RF-M06-001..003).

        El campo alcance del cuerpo decide el duenio y quien puede crearlo: ORGANIZACION exige consultorio:manage sobre la sede del contexto —pasan ORG_ADMIN y CONSULTORIO_ADMIN—; GLOBAL exige rol de plataforma. Si se omite, ORGANIZACION.

        especialidadId es obligatorio al crear una practica. Una practica GLOBAL solo puede colgar de una especialidad GLOBAL: al reves seria dejar que un centro decida el destino de un concepto que ven todos los demas, y responde 409 catalogo-scope-mismatch.

        El codigo es unico entre los conceptos VIGENTES del mismo duenio, y el nombre tambien —comparado sin distinguir mayusculas ni acentos—. El codigo de uno dado de baja SI se puede reusar.

        No lleva Idempotency-Key y es deliberado: un concepto no consume cupo de ningun plan, asi que lo unico que un reintento podria producir es una fila duplicada, y contra eso el unique de codigo es una garantia mas fuerte que una clave que depende de que el cliente la mande bien. El reintento responde 409 y no crea nada; despues de un timeout de red hay que releer el listado.
      operationId: createCatalogoConcepto
      parameters:
      - description: Coleccion del catalogo
        example: practicas
        in: path
        name: tipo
        required: true
        schema:
          type: string
          enum:
          - especialidades
          - practicas
          - nomencladores
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogoConceptoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: Concepto creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Tipo de ruta desconocido, campos invalidos, falta especialidadId\
            \ en una practica, o ventana de vigencia incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, sin consultorio:manage para un concepto\
            \ contextual, o sin rol de plataforma para uno global"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La especialidad referenciada no existe o es de otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Codigo repetido (catalogo-code-taken), nombre repetido (catalogo-name-taken),\
            \ especialidad dada de baja (catalogo-reference-inactive), o alcance incompatible\
            \ (catalogo-scope-mismatch)"
      summary: Alta de un concepto del catalogo
      tags:
      - Catalogo clinico
  /api/v1/catalogos/{tipo}/{conceptoId}:
    get:
      description: |-
        Devuelve el concepto con su alcance, su vigencia y la version que hay que reenviar para editarlo.

        Devuelve tambien los conceptos INACTIVOS, con 200 y no con 404: RN-M06-001 y RN-M06-002 exigen que los catalogos usados historicamente sigan resolviendo con su nombre y su estado. Lo que un concepto inactivo rechaza son las operaciones nuevas, y eso se responde con 409.

        estado y vigente son dos cosas distintas: el primero es el ciclo de vida administrativo y el segundo dice si el concepto se puede ELEGIR ahora, lo que ademas exige estar dentro de la ventana de vigencia. Una practica ACTIVA que entra en vigor el mes que viene tiene estado=ACTIVO y vigente=false.
      operationId: getCatalogoConcepto
      parameters:
      - description: Coleccion del catalogo
        example: practicas
        in: path
        name: tipo
        required: true
        schema:
          type: string
          enum:
          - especialidades
          - practicas
          - nomencladores
      - description: Identificador del concepto
        example: 1
        in: path
        name: conceptoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: "El concepto, activo o dado de baja"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada o no hay contexto de trabajo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es un concepto contextual de otro tenant"
      summary: Datos de un concepto del catalogo
      tags:
      - Catalogo clinico
    patch:
      description: |-
        Cambia nombre, descripcion y ventana de vigencia. Los campos omitidos no se tocan; para borrar la descripcion se manda cadena vacia, y para dejar el concepto sin fin de vigencia se manda clearValidUntil=true.

        El CODIGO no se puede cambiar: es la clave estable con la que los convenios y las sesiones referencian el concepto, y mutarlo haria que un historico de 2024 apunte a algo que hoy significa otra cosa. Renombrar es cambiar name.

        El ALCANCE tampoco: promover un concepto propio a global lo haria visible para todos los tenants sin que ninguno lo haya pedido. El camino es POST /api/v1/catalogo-solicitudes.

        version es obligatoria y se compara antes de mutar: si quedo vieja, 409 concurrent-modification y el cliente recarga. Sin eso, dos ediciones simultaneas se pisan y el segundo en guardar borra el cambio del primero.

        Un concepto INACTIVO no se puede editar: 409 catalogo-inactive.
      operationId: updateCatalogoConcepto
      parameters:
      - description: Coleccion del catalogo
        example: practicas
        in: path
        name: tipo
        required: true
        schema:
          type: string
          enum:
          - especialidades
          - practicas
          - nomencladores
      - description: Identificador del concepto
        example: 1
        in: path
        name: conceptoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogoConceptoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: Concepto actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos o ventana de vigencia incoherente
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto, sin consultorio:manage sobre un concepto propio,\
            \ o sin rol de plataforma sobre uno global"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es un concepto contextual de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Concepto dado de baja (catalogo-inactive), nombre repetido\
            \ (catalogo-name-taken), o version desactualizada (concurrent-modification)"
      summary: Edicion de un concepto del catalogo
      tags:
      - Catalogo clinico
  /api/v1/catalogos/{tipo}/{conceptoId}/deactivate:
    post:
      description: |-
        Da de baja el concepto con motivo obligatorio (RN-M06-001). NO borra nada: queda INACTIVO, sigue siendo legible por id y conserva su codigo y su nombre, asi que toda sesion, convenio o presentacion que lo referencie sigue resolviendo (RN-M06-002). Deja de ofrecerse para selecciones nuevas y libera su codigo y su nombre para un concepto nuevo del mismo duenio.

        No hay reactivacion: ningun RF de M06 la pide, y un concepto que vuelve es una vigencia nueva, no una baja deshecha. Si lo que se quiere es sacarlo de circulacion temporalmente, el camino es editar validUntil.

        Una ESPECIALIDAD con practicas vigentes colgando NO se puede dar de baja: 409 catalogo-has-active-references, con el conteo en el cuerpo. Un NOMENCLADOR con vigencias abiertas, tampoco. Ojo con la distincion: estar usado HISTORICAMENTE no bloquea la baja —eso es justamente lo que RN-M06-001 pide que sobreviva—; lo que bloquea es dejar colgando algo que todavia se ofrece.
      operationId: deactivateCatalogoConcepto
      parameters:
      - description: Coleccion del catalogo
        example: practicas
        in: path
        name: tipo
        required: true
        schema:
          type: string
          enum:
          - especialidades
          - practicas
          - nomencladores
      - description: Identificador del concepto
        example: 1
        in: path
        name: conceptoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateCatalogoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoConceptoResponse"
          description: Concepto dado de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto, sin consultorio:manage sobre un concepto propio,\
            \ o sin rol de plataforma sobre uno global"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es un concepto contextual de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ya estaba dado de baja (catalogo-already-inactive), o tiene\
            \ conceptos vigentes colgando (catalogo-has-active-references)"
      summary: Baja logica de un concepto del catalogo
      tags:
      - Catalogo clinico
  /api/v1/consultorios/{consultorioId}/aranceles/efectivo:
    get:
      description: |-
        RF-M16-006 y RF-M16-010. Devuelve UN resultado, explicable y estable en el tiempo.

        RESPONDE 200 AUNQUE NO HAYA ARANCEL, con resuelto = false y el motivo. No encontrar convenio es el desenlace mas frecuente —la mayoria de los pacientes se atienden como particulares— y un 404 obligaria a la pantalla a tratar el caso normal como una excepcion. Los dos motivos son distintos y hacen falta los dos: SIN_CONVENIO_VIGENTE manda a cobrar como particular (RN-M16-005), SIN_ARANCEL_VIGENTE manda a cargar el precio de esa practica.

        El resultado es unico porque no puede haber dos candidatas, no porque haya una regla de prioridad que las desempate: dos convenios del mismo alcance no se pueden solapar, y dos aranceles de la misma practica en el mismo convenio tampoco.

        Cuando se resuelve, viaja tambien la DERIVACION: el convenio, su codigo y las dos vigencias que intervinieron. Sin eso, un numero inesperado no se puede explicar.

        fecha es el dia de la PRESTACION, no el de hoy. Consultar una fecha pasada devuelve el arancel que regia entonces, que es lo que hace que una atencion retroactiva se cobre bien.
      operationId: resolveArancelEfectivo
      parameters:
      - description: Identificador de la sede
        example: 20
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Financiador de la cobertura del paciente
        example: 31
        in: query
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      - description: Plan de cobertura del paciente
        example: 88
        in: query
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      - description: Practica que se va a prestar
        example: 412
        in: query
        name: practicaId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Dia de la PRESTACION. Si se omite, hoy"
        example: 2026-03-15
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArancelEfectivoResponse"
          description: "El arancel efectivo, o el motivo por el que no hay"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otra organizacion
      summary: Resolver el arancel efectivo de una practica para una fecha
      tags:
      - Convenios y aranceles
  /api/v1/consultorios/{consultorioId}/calendario:
    get:
      description: |-
        Devuelve juntas las dos cosas que la pantalla de calendario necesita a la vez: si esta sede cierra los feriados de su pais, y cuales son los feriados que caen en la ventana que se esta mirando.

        existePersistida = false significa que la sede todavia no tiene fila propia y lo que se devuelve son los valores por defecto. Es informacion util: dice que nadie edito nunca la politica de esa sede, no que no tenga una. LA LECTURA NO CREA LA FILA: un GET que escribe convierte una consulta en una mutacion que nadie pidio.

        La ventana es semiabierta: hasta es EXCLUSIVO, y un feriado que cae exactamente en hasta NO viaja. hasta == desde es 400, no "un dia". El maximo es de 366 dias; el error trae maximoDias para que la pantalla recorte sola.

        Exige colaborador:read sobre esa sede.
      operationId: getCalendarioSede
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Primer dia de la ventana, fecha local ISO-8601"
        example: 2026-01-01
        in: query
        name: desde
        required: true
        schema:
          type: string
          format: date
      - description: "Fin de la ventana, EXCLUSIVO, fecha local ISO-8601"
        example: 2027-01-01
        in: query
        name: hasta
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarioSedeResponse"
          description: Politica de la sede y feriados de la ventana
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ventana ausente, invertida o vacia (validation-error), o de\
            \ mas de 366 dias (ventana-demasiado-amplia, con maximoDias)"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ colaborador:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o pertenece a otro tenant
      summary: Politica de calendario de la sede y feriados de la ventana
      tags:
      - Calendario de sede
    put:
      description: |-
        Cambia el pais del calendario y si la sede cierra sus feriados. Crea la fila a demanda si es la primera vez. Exige consultorio:manage sobre ESA sede.

        Semantica de PATCH aunque el verbo sea PUT: cada campo omitido queda como estaba. cierraPorFeriado OMITIDO no es false — ese es el error que convierte "no toques la politica" en "abri todos los feriados" para todos los profesionales de la sede, hacia adelante y hacia atras. Por el alcance de ese cambio, la edicion se audita aunque sea un solo flag.

        NO LLEVA version Y NO PUEDE DAR 409 POR CONCURRENCIA. La fila se crea a demanda: un cliente que nunca la vio no tiene version que mandar, y exigirsela le impediria su primera edicion. Consecuencia declarada: dos administradores que editan a la vez no producen conflicto, gana el segundo, y la auditoria conserva los dos cambios con su autor. La version viaja igual en la respuesta, para que la pantalla pueda detectar que alguien mas la cambio.

        feriados viene VACIA en esta respuesta: un PUT no tiene ventana. Vacia significa "no se pregunto", nunca "no hay feriados"; quien quiera la lista vuelve a leer con su ventana.
      operationId: updateCalendarioSede
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarioSedeResponse"
          description: "Politica actualizada. feriados viene vacia: el PUT no tiene\
            \ ventana"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El pais viene vacio o no es un codigo de dos letras
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o pertenece a otro tenant
      summary: Edicion de la politica de calendario de la sede
      tags:
      - Calendario de sede
  /api/v1/consultorios/{consultorioId}/cobros:
    get:
      description: "Los cobros de un paciente en toda la organizacion, del mas reciente\
        \ al mas viejo. Junto con las obligaciones forma su cuenta corriente."
      operationId: cobrosDeLaPersona
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cobro"
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cobro"
          description: Cobros del paciente
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otro tenant
      summary: Cobros de un paciente
      tags:
      - Cobros
    post:
      description: |-
        Recibe dinero por uno o varios medios y lo imputa a las deudas indicadas, emitiendo un **comprobante correlativo por sede**.

        **Las dos sumas tienen que dar el total**: la de los medios y la de las imputaciones. Son invariantes de RN-M19 que ninguna constraint de base puede expresar, asi que las verifica el servidor y un cuerpo que no las cumple es 400. Sin la primera, un cobro de 8500 con un medio de 850 —un cero de menos— entraria igual, la deuda quedaria saldada y en la caja faltaria plata que nadie podria explicar.

        **El descuento del saldo es atomico.** Si entre que la pantalla mostro la cuenta corriente y el operador confirmo otro cobro se llevo la plata, la respuesta es 409 `saldo-insuficiente` y no un saldo negativo.

        **Manda `idempotencyKey`.** Un reintento devuelve el mismo cobro con el mismo comprobante; sin ella, un doble click cobra dos veces. La idempotencia se evalua antes de tocar el numerador, para que un reintento no consuma un numero de comprobante que despues nadie usa: la numeracion fiscal con huecos es peor que un cobro repetido.

        **No hay anticipos ni anulacion todavia.** Los dos exigen la Caja (AKINE-07.03): un anticipo sin caja es plata que entro y que ningun arqueo puede encontrar, y un reintegro saca dinero de una caja que no existe.
      operationId: registrar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarCobro"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Cobro"
          description: Cobro registrado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Los medios o las imputaciones no suman el total
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin `cobro:register` en esa sede, o sin contexto de trabajo\
            \ activo"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otro tenant
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Deuda anulada, pagada o de otra persona; saldo insuficiente;\
            \ o clave de idempotencia reusada con otro pedido"
      summary: Registrar un cobro
      tags:
      - Cobros
  /api/v1/consultorios/{consultorioId}/cobros/{cobroId}:
    get:
      description: "Devuelve el cobro con su comprobante, sus medios y sus imputaciones.\
        \ **Es la reimpresion**: sin esta lectura, un operador que necesita el comprobante\
        \ de nuevo tendria como unica salida volver a registrar el cobro."
      operationId: verCobro
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: cobroId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Cobro"
          description: Cobro
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El cobro o la sede no existen, o son de otro tenant"
      summary: Recuperar un comprobante
      tags:
      - Cobros
  /api/v1/consultorios/{consultorioId}/convenios:
    get:
      description: |-
        Devuelve los convenios de la sede, ordenados por nombre.

        estado filtra el CICLO DE VIDA y por defecto trae solo los ACTIVOS. NO filtra por vigencia: un convenio activo con la vigencia vencida sigue siendo ACTIVO y se devuelve, con vigente = false. Son dos cosas distintas y la grilla necesita las dos para explicar por que un convenio no resuelve.

        fecha es el dia contra el que se calcula vigente. Si se omite, hoy.
      operationId: listConvenios
      parameters:
      - description: Identificador de la sede
        example: 20
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por ciclo de vida. Si se omite, ACTIVO"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Dia contra el que se calcula vigente. Si se omite, hoy"
        example: 2026-09-02
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConvenioResponse"
          description: Convenios de la sede
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otra organizacion
      summary: Listar los convenios de una sede
      tags:
      - Convenios y aranceles
    post:
      description: |-
        Exige convenio:manage sobre LA SEDE DE LA RUTA.

        DOS CONVENIOS DE LA MISMA SEDE CON EL MISMO FINANCIADOR Y EL MISMO PLAN NO PUEDEN SOLAPARSE EN EL TIEMPO (RN-M16-002): 409 convenio-solapado, con el id y el periodo del que choca en el cuerpo del problema. Si lo que se quiere es renovar, primero se cierra la vigencia del que esta.

        El plan es obligatorio y tiene que ser del financiador declarado. Es lo que hace que la resolucion del arancel tenga como mucho una candidata para una fecha, sin necesidad de ninguna regla de prioridad.

        Un financiador o un plan dados de baja no admiten convenios nuevos: 409.

        vigenciaHasta es el ULTIMO dia INCLUSIVE y puede coincidir con vigenciaDesde. Null significa sin fin previsto.

        El codigo es unico entre los convenios VIGENTES de esa sede y no se puede cambiar despues.
      operationId: createConvenio
      parameters:
      - description: Identificador de la sede
        example: 20
