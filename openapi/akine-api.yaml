        \ hay que mostrarlos. PHI minima: ningun dato clinico."
      properties:
        fecha:
          type: string
          format: date
          description: "El dia pedido, interpretado en la zona de la sede"
          example: 2026-09-15
        timezone:
          type: string
          description: "Zona horaria de la sede. Viaja para que la pantalla pueda\
            \ convertir los instantes y rotularla, en vez de usar la del navegador\
            \ de quien mira."
