        Exige convenio:manage sobre la sede de la ruta.

        LA FORMA CORRECTA DE SUBIR UN PRECIO NO ES ESTA OPERACION: es cerrar la vigencia del arancel actual y crear otro. Editar el importe de una ventana ya transcurrida se admite —a veces hay que corregir una carga— y NO reescribe nada de lo ya liquidado, porque eso guardo su propio snapshot congelado (RN-M16-003).

        Los importes se validan como TERNA aunque llegue uno solo: subir el total sin tocar las partes rompe la invariante de que sumen, y se rechaza con 400.

        Mover la vigencia puede producir 409 arancel-solapado.

        Ni la practica ni el convenio se pueden cambiar: no seria editar este arancel, seria inventar otro.
