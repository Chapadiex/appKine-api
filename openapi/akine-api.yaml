      - description: Identificador de la sede
        example: 20
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del convenio
        example: 140
        in: path
        name: convenioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateContractingRequest"
        required: true
      responses:
