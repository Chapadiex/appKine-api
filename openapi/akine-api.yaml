      properties:
        email:
          type: string
          description: Direccion de correo de la cuenta a activar
          example: ana.perez@ejemplo.test
          maxLength: 254
          minLength: 0
      required:
      - email
    SelectContextRequest:
      type: object
      description: Par Organizacion + Consultorio sobre el que se quiere trabajar
      properties:
        consultorioId:
          type: integer
          format: int64
          description: Identificador del consultorio
          example: 1
          minimum: 0
        organizationId:
          type: integer
          format: int64
          description: Identificador de la organizacion
          example: 1
          minimum: 0
      required:
      - consultorioId
      - organizationId
    SubscriptionResponse:
      type: object
      description: "Suscripcion del tenant con su plan, estado y consumo de limites"
      properties:
        allowedTargets:
          type: array
          description: Estados a los que se puede transicionar desde el actual. Vacio
            cuando el estado es terminal
          example:
          - SUSPENDIDA
          - CANCELADA
          items:
            type: string
            enum:
            - ACTIVA
            - SUSPENDIDA
            - CANCELADA
          uniqueItems: true
        id:
          type: integer
          format: int64
          description: Identificador de la suscripcion
          example: 1
        limits:
          type: array
          description: Limites del plan con el consumo actual de cada uno
          items:
            $ref: "#/components/schemas/LimitUsageResponse"
        organizationId:
          type: integer
          format: int64
          description: Organizacion titular de la suscripcion
          example: 1
        planCode:
          type: string
          description: Codigo del plan contratado
          example: BASICO
        planName:
          type: string
          description: Nombre comercial del plan contratado
          example: Basico
        startedAt:
          type: string
          format: date-time
          description: Instante de alta de la suscripcion
          example: 2026-01-15T13:45:00Z
        status:
          type: string
          description: "Estado de la suscripcion. SUSPENDIDA permite lecturas y administracion,\
            \ y rechaza mutaciones de negocio con 409. CANCELADA es terminal"
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: ACTIVA
        version:
          type: integer
          format: int64
          description: Version para bloqueo optimista. Devolverla tal cual al cambiar
            de plan
          example: 0
    SubscriptionTransitionPageResponse:
      type: object
      description: "Pagina del historico de la suscripcion, del hecho mas reciente\
        \ al mas viejo"
      properties:
        content:
          type: array
          description: Hechos de esta pagina
          items:
            $ref: "#/components/schemas/SubscriptionTransitionResponse"
        page:
          type: integer
          format: int32
          description: "Numero de pagina devuelta, base cero"
          example: 0
        size:
          type: integer
          format: int32
          description: Cantidad de elementos por pagina
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Cantidad total de hechos en el historico
          example: 37
        totalPages:
          type: integer
          format: int32
          description: Cantidad total de paginas disponibles
          example: 2
    SubscriptionTransitionRequest:
      type: object
      description: Transicion de estado a aplicar sobre la suscripcion
      properties:
        expectedStatus:
          type: string
          description: "Estado que el actor cree vigente. Si no coincide con el real,\
            \ la operacion se rechaza con 409 en vez de aplicarse sobre una premisa\
            \ falsa"
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: ACTIVA
        reason:
          type: string
          description: Motivo declarado del cambio. Obligatorio al suspender y al
            cancelar
          example: Falta de pago de tres periodos consecutivos
          maxLength: 500
          minLength: 0
        toStatus:
          type: string
          description: "Estado destino. Debe estar entre los allowedTargets que publica\
            \ GET /api/v1/organizations/{orgId}/subscription"
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: SUSPENDIDA
      required:
      - toStatus
    SubscriptionTransitionResponse:
      type: object
      description: Hecho registrado en el historico de la suscripcion
      properties:
        actorAccountId:
          type: integer
          format: int64
          description: Cuenta que ejecuto el cambio. Ausente cuando lo origino un
            proceso automatico
          example: 42
        fromPlanCode:
          type: string
          description: Codigo del plan previo. Ausente en la fila de alta
          example: BASICO
        fromStatus:
          type: string
          description: Estado previo. Ausente en la fila de alta de la suscripcion
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: ACTIVA
        id:
          type: integer
          format: int64
          description: Identificador del hecho
          example: 1
        occurredAt:
          type: string
          format: date-time
          description: Instante en que ocurrio el hecho
          example: 2026-03-01T10:00:00Z
        reason:
          type: string
          description: "Motivo declarado, cuando la transicion lo exige"
          example: Falta de pago de tres periodos consecutivos
        toPlanCode:
          type: string
          description: Codigo del plan resultante
          example: PROFESIONAL
        toStatus:
          type: string
          description: Estado resultante
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: SUSPENDIDA
    SupportAccessResponse:
      type: object
      description: Acceso de soporte concedido sobre una organizacion
      properties:
        accountId:
          type: integer
          format: int64
          description: Cuenta de plataforma que entra al tenant
          example: 1
        active:
          type: boolean
          description: "Baja logica: false cuando el acceso ya fue cerrado"
          example: true
        grantedByAccountId:
          type: integer
          format: int64
          description: Cuenta que lo concedio
          example: 1
        id:
          type: integer
          format: int64
          description: Identificador del acceso
          example: 5
        organizationId:
          type: integer
          format: int64
          description: Organizacion sobre la que rige
          example: 7
        reason:
          type: string
          description: Motivo declarado. Sin motivo no hay soporte
        revokedAt:
          type: string
          format: date-time
          description: "Momento en que se cerro antes de vencer, si se cerro"
        validFrom:
          type: string
          format: date-time
          description: Momento desde el que rige
        validUntil:
          type: string
          format: date-time
          description: Vencimiento. Como maximo cuatro horas despues del otorgamiento
    UpdateConsultorioRequest:
      type: object
      description: Cambios a aplicar sobre una sede. Los campos omitidos no se tocan
      properties:
        addressLine:
          type: string
          description: Direccion. Cadena vacia la borra
          maxLength: 240
          minLength: 0
        contactEmail:
          type: string
          format: email
          description: Email de contacto. Cadena vacia lo borra
          maxLength: 160
          minLength: 0
        legalName:
          type: string
          description: Razon social. Cadena vacia la borra
          maxLength: 200
          minLength: 0
        name:
          type: string
          description: Nuevo nombre. Unico entre las sedes vigentes del tenant
          maxLength: 160
          minLength: 0
        phone:
          type: string
          description: Telefono. Cadena vacia lo borra
          maxLength: 40
          minLength: 0
        slotMinutes:
          type: integer
          format: int32
          description: "Nuevo intervalo por defecto de la agenda, en minutos"
          maximum: 480
          minimum: 5
        taxId:
          type: string
          description: Identificacion fiscal. Cadena vacia la borra
          maxLength: 32
          minLength: 0
        timezone:
          type: string
          description: Nueva zona horaria IANA de la sede
          example: America/Argentina/Cordoba
          maxLength: 64
          minLength: 0
        version:
          type: integer
          format: int64
          description: "Version leida del recurso. Si quedo vieja, la edicion se rechaza\
            \ con 409 en vez de pisar el cambio de otro"
          example: 0
          minimum: 0
      required:
      - version
    UpdateOrganizationRequest:
      type: object
      description: "Campos editables de la organizacion, con la version para bloqueo\
        \ optimista"
      properties:
        name:
          type: string
          description: Nuevo nombre del centro. Omitirlo o enviarlo vacio lo deja
            como esta
          example: Centro Kinesico Belgrano Norte
          maxLength: 160
          minLength: 0
        timezone:
          type: string
          description: Nueva zona horaria IANA. Omitirla o enviarla vacia la deja
            como esta
          example: America/Argentina/Cordoba
          maxLength: 64
          minLength: 0
        version:
          type: integer
          format: int64
          description: "Version que el cliente cree vigente, tal como la devolvio\
            \ el GET"
          example: 0
          minimum: 0
      required:
      - version
    VersionResponse:
      type: object
      description: Identidad tecnica del backend y version del contrato OpenAPI publicado
      properties:
        application:
          type: string
          description: Nombre de la aplicacion
          example: akine-api
        contract:
          type: string
          description: Version SemVer del contrato OpenAPI publicado
          example: 0.1.0
        version:
          type: string
          description: Version de la aplicacion
          example: 0.0.1-SNAPSHOT
