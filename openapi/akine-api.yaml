  /api/v1/personas/{personaId}/autorizaciones/{autorizacionId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige paciente:manage sobre la sede del contexto.

        DAR DE BAJA NO ES RECHAZAR, Y NO ES VENCER. Rechazar es la respuesta del financiador y se hace con POST /{id}/estado: la autorizacion queda viva y explica por que no se pudo atender. Vencer es que paso la fecha, y se calcula al leer. Dar de baja significa "esta autorizacion nunca debio cargarse".

        No borra nada (regla maestra 10). La autorizacion sigue siendo legible con estado INACTIVA, y su numero se puede volver a usar.

        La baja NO toma el lock de solapamiento: quitar una fila del conjunto activo nunca puede crear un solapamiento.

        No hay reactivacion. Una autorizacion que vuelve es un alta nueva.
      operationId: deactivateAutorizacion
