    GuardarBorrador:
      type: object
      description: "Guardado parcial de la atencion. La version es obligatoria: sin\
        \ ella dos pestanas del mismo profesional se pisan en silencio."
      properties:
        contenido:
          type: string
          description: "Contenido parcial de la atencion, como JSON. Opaco para el\
