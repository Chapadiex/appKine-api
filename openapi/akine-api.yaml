          example: 1
        deactivationReason:
          type: string
          description: Motivo declarado en la baja. null si la excepcion esta vigente
        deletedAt:
          type: string
          format: date-time
          description: Instante de la baja logica. null si la excepcion esta vigente
        estado:
          type: string
          description: "ACTIVO o INACTIVO. DERIVADO, no una columna"
          example: ACTIVO
        fechaDesde:
          type: string
          format: date
          description: Primer dia cubierto
          example: 2026-09-07
        fechaHasta:
          type: string
          format: date
          description: "Primer dia YA NO cubierto, EXCLUSIVO"
          example: 2026-09-08
        feriadoId:
          type: integer
          format: int64
          description: "Feriado que motivo la excepcion, si la carga nacio del calendario\
            \ nacional"
          example: 5
        horaDesde:
          type: string
          description: Hora local de inicio. null junto con horaHasta = DIA COMPLETO
          example: 14:00
        horaHasta:
          type: string
          description: "Hora local de fin, EXCLUSIVA. La medianoche viaja como 24:00"
          example: 18:00
        id:
          type: integer
          format: int64
          description: Identificador de la excepcion
          example: 1
        membershipId:
          type: integer
          format: int64
          description: "Vinculo del profesional afectado. null = alcance SEDE ENTERA.\
            \ La pantalla TIENE que mostrarlo distinto: una excepcion de sede afecta\
            \ a todos los profesionales, y en un feriado una APERTURA de sede reemplaza\
            \ el horario base de todos ellos"
          example: 1
        motivo:
          type: string
          description: "Motivo declarado, de lista cerrada"
          enum:
          - AUSENCIA
          - LICENCIA
          - FERIADO
          - BLOQUEO
          - AMPLIACION
          - OTRO
          example: LICENCIA
        notes:
          type: string
          description: Texto libre operativo. Nunca informacion clinica
        organizationId:
          type: integer
          format: int64
          description: Organizacion propietaria
          example: 1
        tipo:
          type: string
          description: CIERRE recorta disponibilidad; APERTURA la habilita
          enum:
          - CIERRE
          - APERTURA
          example: CIERRE
        version:
          type: integer
          format: int64
          description: Version de la fila
          example: 0
    FeriadoResponse:
