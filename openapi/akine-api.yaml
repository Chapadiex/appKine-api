      description: |-
        Resuelve la seleccion de RF-M08-004 y RF-M08-005: la cobertura principal vigente ese dia, todas las vigentes, y PARTICULAR, que siempre esta disponible.

        particularSiempreDisponible es SIEMPRE true, y no es un campo inutil: es RN-M08-001 dicho en el contrato. Un paciente con obra social puede pagar particular, que es exactamente RF-M08-005, y si Particular no viajara aca cada pantalla tendria que acordarse de agregarlo.

        La principal es determinista: no puede haber dos, y eso lo hace cumplir un lock y no un desempate arbitrario.

        ESTO NO PERSISTE NADA y no afirma que la prestacion sea facturable a esa cobertura. RN-M08-004: la cobertura del paciente no implica que el consultorio tenga convenio con ese financiador. Resolver la elegibilidad por oferta y convenio es RF-M08-006 y necesita M16 y M17, que no existen.
      operationId: resolverCoberturaParaAtencion
