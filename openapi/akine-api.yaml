          maxLength: 254
          minLength: 0
        firstName:
          type: string
          description: Nombre de la persona
          example: Ana
          maxLength: 80
          minLength: 0
        lastName:
          type: string
          description: Apellido de la persona
          example: Perez
          maxLength: 80
          minLength: 0
        organizationName:
          type: string
          description: Nombre del centro que se da de alta
          example: Centro Kinesico Belgrano
          maxLength: 160
          minLength: 0
        organizationSlug:
          type: string
          description: Identificador legible del tenant. Si se omite se deriva del
            nombre y se resuelve cualquier colision
          example: centro-kinesico-belgrano
          maxLength: 64
          minLength: 0
        password:
          type: string
          description: Contrasena en claro. La politica minima la valida el backend
          example: una-contrasena-larga-y-unica
          maxLength: 256
          minLength: 0
        planCode:
          type: string
          description: "Plan a contratar, del catalogo de GET /api/v1/plans. Si se\
            \ omite se usa el plan por defecto"
          example: BASICO
          maxLength: 32
          minLength: 0
      required:
      - email
