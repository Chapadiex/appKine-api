    FranjaResueltaResponse:
      type: object
      description: "Una franja de atencion resuelta, con la regla que la produjo"
      properties:
        desde:
          type: string
          format: date-time
          description: Instante UTC de inicio
          example: 2026-09-07T12:00:00Z
        hasta:
          type: string
          format: date-time
          description: "Instante UTC de fin, EXCLUSIVO. Una franja que llega al fin\
            \ del dia trae aca el INICIO DEL DIA SIGUIENTE, no las 23:59:59.999999999"
          example: 2026-09-07T16:00:00Z
        origen:
          type: string
          description: Que regla produjo la franja. BLOQUE = el horario base; APERTURA
            = una excepcion que habilito atencion donde no la habia
          enum:
          - BLOQUE
          - APERTURA
          example: BLOQUE
        recortadoPor:
          type:
          - string
          - "null"
          description: |-
            Por que la franja quedo mas corta que la regla que la produjo. DOS estados, y el segundo es el normal:

            CIERRE — una excepcion de tipo CIERRE le recorto un pedazo. Es lo que explica por que la franja termina a las 11 y no a las 13.

            null — nada la recorto: la franja es la regla entera.

            NO se declara como enum en el contrato aunque la lista sea cerrada. Ver la nota de razonVacio: un campo nullable con enum se publica en OpenAPI 3.1 con un tipo que admite el nulo y un enum que no lo contiene, y un cliente generado con validacion estricta rechazaria nuestra propia respuesta.
          example: CIERRE
        reglaId:
          type: integer
          format: int64
          description: Id de la fila que produjo la franja —el bloque o la excepcion
            de apertura— para que la pantalla pueda linkearla
          example: 501
    GrantPlatformRoleRequest:
