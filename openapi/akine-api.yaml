    put:
      description: |-
        Exige paciente:manage sobre la sede del contexto. Edicion parcial: lo que no viaja no se toca.

        LA COBERTURA, LA PRACTICA Y EL ESTADO NO ESTAN EN EL CUERPO, y ninguno es un olvido. Las dos primeras son inmutables: cambiarlas es OTRA autorizacion, porque reescribirian contra que se autorizo. El estado se mueve con POST /{id}/estado, que recibe una ACCION.

        Tampoco esta el snapshot del convenio: es una copia congelada, y una copia que se puede editar no es una copia.

        Si la autorizacion ya esta APROBADA, mover sus fechas revalida el solapamiento bajo el mismo lock que la aprobacion: estirar una vigencia hasta pisar a la siguiente es exactamente el mismo riesgo.

        expectedVersion es obligatorio.
