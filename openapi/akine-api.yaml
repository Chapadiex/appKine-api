  /api/v1/consultorios/{consultorioId}/convenios/{convenioId}/aranceles:
    get:
      description: |-
        La grilla de vigencias. Devuelve los aranceles del convenio del mas nuevo al mas viejo.

        estado filtra el CICLO DE VIDA y por defecto trae solo los ACTIVOS. NO filtra por vigencia: un arancel activo cuya ventana ya paso se devuelve con vigente = false, y es justamente lo que hace falta para explicar por que una prestacion de marzo se cobro distinto que una de octubre.

        fecha es el dia contra el que se calcula vigente. Si se omite, hoy.
      operationId: listAranceles
      parameters:
      - description: Identificador de la sede
        example: 20
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del convenio
        example: 140
        in: path
        name: convenioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por ciclo de vida. Si se omite, ACTIVO"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Dia contra el que se calcula vigente. Si se omite, hoy"
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
