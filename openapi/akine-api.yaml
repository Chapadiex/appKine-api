    ProfesionalHabilitado:
      type: object
      description: Profesional habilitado para prestar la oferta
      properties:
        deactivationReason:
          type: string
          description: Motivo declarado de la baja
        deletedAt:
          type: string
          format: date-time
          description: Instante UTC de la baja. Null mientras este activa
        estado:
          type: string
          description: Ciclo de vida de la habilitacion
          enum:
          - ACTIVO
          - INACTIVO
          example: ACTIVO
        id:
          type: integer
          format: int64
          description: Identificador de la habilitacion
          example: 12
        membershipId:
          type: integer
          format: int64
          description: Vinculo del profesional con la organizacion
          example: 215
        nombre:
          type: string
          description: Nombre de la persona. Null si su cuenta ya no se puede resolver
        roleCode:
          type: string
          description: Rol de ese vinculo
          example: PROFESIONAL
        validFrom:
          type: string
          format: date-time
          description: Instante UTC desde el que la habilitacion rige
        validUntil:
          type: string
          format: date-time
          description: "Instante UTC hasta el que rige, EXCLUSIVO. Null = sin fin"
        version:
          type: integer
          format: int64
          description: Version de la habilitacion
          example: 0
        vigenteHoy:
          type: boolean
          description: "Si la habilitacion rige AHORA. Distinto de estado: una activa\
            \ que arranca el mes que viene tiene estado=ACTIVO y vigenteHoy=false"
        vinculoVigente:
          type: boolean
          description: "Si la membership sigue habilitando a esa persona en la sede.\
            \ Puede ser false con la habilitacion intacta: el colaborador se desvinculo\
            \ y la fila quedo colgando. Se muestra, no se esconde"
    ReemplazarHabilitacionesRequest:
      type: object
      description: "Conjunto completo de recursos habilitados. Reemplaza, no agrega"
      properties:
        expectedVersion:
          type: integer
          format: int64
          description: "Version de la OFERTA que el cliente cree estar configurando.\
            \ Es lo que serializa a dos administradores editando la misma configuracion:\
            \ sin esto, el segundo en guardar borra en silencio lo que agrego el primero"
          example: 0
          minimum: 0
        ids:
          type: array
          description: "Ids de los recursos que quedan habilitados: memberships de\
            \ profesional o espacios, segun el endpoint. Lista vacia = quitar la restriccion"
          items:
            type: integer
            format: int64
      required:
      - expectedVersion
      - ids
    RegisterAccountRequest:
      type: object
      description: "Alta self-service de cuenta, organizacion y primer consultorio"
      properties:
        consultorioName:
          type: string
          description: Nombre de la primera sede. Si se omite se usa el de la organizacion
          example: Sede Central
          maxLength: 160
          minLength: 0
        email:
          type: string
          format: email
          description: Direccion de correo del fundador. Sera su identidad unica
          example: ana.perez@ejemplo.test
          maxLength: 254
          minLength: 0
        firstName:
          type: string
          description: Nombre de la persona
          example: Ana
          maxLength: 80
          minLength: 0
        lastName:
          type: string
          description: Apellido de la persona
          example: Perez
          maxLength: 80
          minLength: 0
        organizationName:
          type: string
          description: Nombre del centro que se da de alta
          example: Centro Kinesico Belgrano
          maxLength: 160
          minLength: 0
        organizationSlug:
          type: string
          description: Identificador legible del tenant. Si se omite se deriva del
            nombre y se resuelve cualquier colision
          example: centro-kinesico-belgrano
          maxLength: 64
          minLength: 0
        password:
          type: string
          description: Contrasena en claro. La politica minima la valida el backend
          example: una-contrasena-larga-y-unica
          maxLength: 256
          minLength: 0
        planCode:
          type: string
          description: "Plan a contratar, del catalogo de GET /api/v1/plans. Si se\
            \ omite se usa el plan por defecto"
          example: BASICO
          maxLength: 32
          minLength: 0
      required:
      - email
      - firstName
      - lastName
      - organizationName
      - password
    RegistrarAusencia:
      type: object
      description: Registro de no asistencia. NO libera el lugar y no altera ningun
        otro turno (DP-04).
      properties:
        expectedVersion:
          type: integer
          format: int64
          description: Version que devolvio la ultima lectura del turno.
          example: 1
          minimum: 0
        motivo:
          type: string
          description: Opcional.
          example: No aviso
          maxLength: 300
          minLength: 0
      required:
      - expectedVersion
    RegistrarCobro:
      type: object
      description: "Dinero recibido, con sus medios y sus imputaciones. La suma de\
        \ los medios y la de las imputaciones tienen que dar el total."
      properties:
        idempotencyKey:
          type: string
          description: "Clave del cliente para que un reintento no cobre dos veces.\
            \ Reusarla con **otro** contenido devuelve 409, no el cobro anterior."
          example: c4e2a1b0-7d3f-4e59-9a12-6b7c8d9e0f1a
          maxLength: 80
          minLength: 0
        imputaciones:
          type: array
          description: "Contra que deudas se aplica. Un cobro puede saldar varias\
            \ sesiones juntas. **Su suma tiene que dar el total**: mientras no existan\
            \ los anticipos —AKINE-07.03, junto con la Caja— todo el dinero recibido\
            \ tiene que aplicarse a alguna deuda."
          items:
            $ref: "#/components/schemas/ImputacionDeCobro"
          minItems: 1
        medios:
          type: array
          description: "Por que via entro. Puede ser mas de uno: mitad efectivo y\
            \ mitad tarjeta es normal. **Su suma tiene que dar el total.**"
          items:
            $ref: "#/components/schemas/MedioDeCobro"
          minItems: 1
        personaId:
          type: integer
          format: int64
          description: Quien paga
          example: 128
          minimum: 0
        total:
          type: number
          description: "Total recibido. Decimal exacto, nunca float."
          example: 8500.0
          minimum: 0.01
      required:
      - imputaciones
      - medios
      - personaId
      - total
    ReprogramarTurno:
      type: object
      description: "Mueve la reserva a otro intervalo. Es el MISMO turno: conserva\
        \ id, paciente e historial. El servidor revalida el destino con los mismos\
        \ controles que una reserva y bajo el mismo lock de sede."
      properties:
        expectedVersion:
          type: integer
          format: int64
          description: Version que devolvio la ultima lectura del turno.
          example: 0
          minimum: 0
        inicio:
          type: string
          format: date-time
          description: "Instante de inicio del slot nuevo, UTC, tal como lo devolvio\
            \ la agenda"
          example: 2026-09-22T12:00:00Z
        motivo:
          type: string
          description: Por que se mueve. **Obligatorio** (DP-04).
          example: El profesional pidio el dia
          maxLength: 300
          minLength: 0
        profesionalId:
          type: integer
          format: int64
          description: "Membership del profesional en el horario nuevo. **Puede ser\
            \ otro**: mover un turno porque el profesional se ausento es el caso mas\
            \ frecuente."
          example: 31
          minimum: 0
      required:
      - expectedVersion
      - inicio
      - motivo
    RequisitoResponse:
      type: object
      description: Un requisito del convenio y su veredicto
      properties:
        cumplido:
          type: boolean
          description: Si hoy esta satisfecho
        detalle:
          type: string
          description: "Por que esta o no cumplido, en lenguaje del mostrador"
        referenciaId:
          type: integer
          format: int64
          description: "Orden o autorizacion que lo satisface, o la cobertura para\
            \ la credencial. Null si falta"
          example: 51
        saldo:
          type: integer
          format: int32
          description: Sesiones restantes cuando el requisito es AUTORIZACION y hay
            tope declarado
          example: 6
        tipo:
          type: string
          description: Que exige el convenio. Son exactamente las tres banderas que
            declara desde M16
          enum:
          - ORDEN
          - AUTORIZACION
          - CREDENCIAL
          example: ORDEN
    ResendActivationRequest:
      type: object
      description: Direccion a la que reenviar el enlace de activacion
      properties:
        email:
          type: string
          description: Direccion de correo de la cuenta a activar
          example: ana.perez@ejemplo.test
          maxLength: 254
          minLength: 0
      required:
      - email
    ReservarTurno:
      type: object
      description: "Reserva de un slot. El servidor revalida que el hueco siga existiendo:\
        \ entre que la pantalla mostro la agenda y el usuario confirmo pudo cambiar\
        \ el horario del profesional, entrar un feriado o vencer la oferta."
      properties:
        idempotencyKey:
          type: string
          description: "Clave del cliente para que un reintento no cree un segundo\
            \ turno. Reusarla con **otro** contenido devuelve 409 `idempotency-key-conflict`,\
            \ no el turno anterior. Omitirla desactiva la proteccion, que es legitimo\
            \ en una carga manual."
          example: b3f1c2a4-5d6e-4f70-8a91-2c3d4e5f6a7b
          maxLength: 80
          minLength: 0
        inicio:
          type: string
          format: date-time
          description: "Instante de inicio del slot elegido, UTC, tal como lo devolvio\
            \ la agenda"
          example: 2026-09-15T12:00:00Z
        personaId:
          type: integer
          format: int64
          description: "Persona del padron, que debe tener perfil de paciente vigente"
          example: 128
          minimum: 0
        profesionalId:
          type: integer
          format: int64
          description: Membership del profesional. Obligatorio si la oferta lo requiere.
          example: 31
          minimum: 0
      required:
      - inicio
      - personaId
    ResolveCatalogoSolicitudRequest:
      type: object
      description: Aprobacion o rechazo de una solicitud de catalogo
      properties:
        estado:
          type: string
          description: Desenlace. PENDIENTE no es una resolucion y se rechaza con
            400
          enum:
          - APROBADA
          - RECHAZADA
          example: APROBADA
        nota:
          type: string
          description: Motivo de la decision
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          description: "Version que el cliente leyo. Si quedo vieja, 409 concurrent-modification"
          example: 0
      required:
      - estado
      - nota
      - version
    ResolverAutorizacionRequest:
      type: object
      description: Respuesta del financiador sobre una autorizacion
      properties:
        accion:
          type: string
          description: Que hizo el financiador. APROBAR habilita; OBSERVAR pide corregir
            y deja la autorizacion viva; RECHAZAR la deniega y es terminal
          enum:
          - APROBAR
          - OBSERVAR
          - RECHAZAR
          example: APROBAR
          pattern: APROBAR|OBSERVAR|RECHAZAR
        cantidadAutorizada:
          type: integer
          format: int32
          description: "Sesiones que el financiador realmente otorgo. Puede ser MENOR\
            \ que la pedida: eso es la autorizacion parcial. Solo se aplica al APROBAR"
          example: 6
          minimum: 0
        expectedVersion:
          type: integer
          format: int64
          description: "Version que el cliente leyo. Es tambien lo que hace segura\
            \ la aprobacion concurrente: el segundo en llegar recibe 409"
          example: 0
        motivo:
          type: string
          description: "Por que se observo o se rechazo. OBLIGATORIO en esas dos acciones:\
            \ sin motivo, el mostrador no sabe que corregir. Ignorado al aprobar"
          example: Falta la orden medica firmada
          maxLength: 280
          minLength: 0
        vigenciaDesde:
          type: string
          format: date
          description: Inicio de vigencia concedido. Solo se aplica al APROBAR
          example: 2026-09-15
        vigenciaHasta:
          type: string
          format: date
          description: "Fin de vigencia concedido, INCLUSIVE. Solo se aplica al APROBAR"
          example: 2026-11-30
      required:
      - accion
      - expectedVersion
    ResumenDePersonaResponse:
      type: object
      description: "Ficha administrativa consolidada de una persona, recortada por\
        \ permisos"
      properties:
        adjuntosPorCategoria:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Adjuntos vigentes por categoria. Las categorias sin adjuntos
            no aparecen
        adjuntosTotal:
          type: integer
          format: int64
          description: Cantidad de adjuntos VIGENTES
          example: 3
        persona:
          $ref: "#/components/schemas/PersonaResponse"
          description: La ficha administrativa completa
        secciones:
          type: array
          description: "Lo que aportaron los demas modulos, segun los permisos del\
            \ actor"
          items:
            $ref: "#/components/schemas/SeccionResponse"
        seccionesOmitidas:
          type: array
          description: Secciones que NO se devolvieron por falta de permiso. Viajan
            explicitas para que la pantalla no las confunda con ausencia de datos
          items:
            $ref: "#/components/schemas/SeccionOmitidaResponse"
    SeccionOmitidaResponse:
      type: object
      description: Seccion no devuelta por falta de permiso
      properties:
        permisoRequerido:
          type: string
          description: Codigo de permiso que falta
          example: cobro:register
        seccion:
          type: string
          description: Nombre de la seccion omitida
          example: economia
    SeccionResponse:
      type: object
      description: Bloque del resumen aportado por un modulo
      properties:
        hitos:
          type: array
          description: "Hechos datados, mas nuevos primero. Es un indice, no un visor:\
            \ el detalle se pide al modulo que lo posee, con su propio permiso"
          items:
            $ref: "#/components/schemas/HitoResponse"
        indicadores:
          type: array
          description: Los numeros de la seccion
          items:
            $ref: "#/components/schemas/IndicadorResponse"
        seccion:
          type: string
          description: Nombre estable de la seccion
          example: turnos
    SeleccionDeCoberturaResponse:
      type: object
      description: "Coberturas elegibles del paciente para una fecha, con Particular\
        \ siempre disponible"
      properties:
        fecha:
          type: string
          format: date
          description: Dia contra el que se resolvio
          example: 2026-09-02
        particularSiempreDisponible:
          type: boolean
          description: Siempre true (RN-M08-001). Atender como particular no depende
            de ningun dato y se puede elegir aunque el paciente tenga cobertura
          example: true
        principal:
          $ref: "#/components/schemas/CoberturaResponse"
          description: "La cobertura marcada principal y vigente ese dia, o null.\
            \ Es la seleccion por defecto y es determinista: no puede haber dos"
        vigentes:
          type: array
          description: "Todas las coberturas que aplican ese dia, incluida la principal.\
            \ Vacia es un estado normal: un paciente sin cobertura se atiende particular"
          items:
            $ref: "#/components/schemas/CoberturaResponse"
    SelectContextRequest:
      type: object
      description: Par Organizacion + Consultorio sobre el que se quiere trabajar
      properties:
        consultorioId:
          type: integer
          format: int64
          description: Identificador del consultorio
          example: 1
          minimum: 0
        organizationId:
          type: integer
          format: int64
          description: Identificador de la organizacion
          example: 1
          minimum: 0
      required:
      - consultorioId
      - organizationId
    ServicioResponse:
      type: object
      description: Servicio del catalogo global de la plataforma
      properties:
        codigo:
          type: string
          description: "Clave estable con la que las ofertas lo referencian. No cambia\
            \ nunca: renombrar es cambiar nombre, no codigo"
          example: KINESIOLOGIA_SESION
        deactivationReason:
          type: string
          description: Motivo declarado de la baja. Null mientras este vigente
        deletedAt:
          type: string
          format: date-time
          description: Instante UTC de la baja logica. Null mientras este vigente
        descripcion:
          type: string
          description: Descripcion libre. Nunca contenido clinico
        estado:
          type: string
          description: "Ciclo de vida. Un servicio INACTIVO se sigue leyendo con 200:\
            \ los historicos que lo referencian tienen que seguir resolviendo"
          enum:
          - ACTIVO
          - INACTIVO
          example: ACTIVO
        generaRegistroClinicoDefault:
          type: boolean
          description: Si por defecto la prestacion genera registro clinico
        id:
          type: integer
          format: int64
          description: Identificador del servicio
          example: 12
        modalidadDefault:
          type: string
          description: Modalidad sugerida al crear una oferta. La oferta puede apartarse
          enum:
          - INDIVIDUAL
          - GRUPAL
          example: INDIVIDUAL
        naturaleza:
          type: string
          description: "Que clase de prestacion es. No condiciona por nombre ninguna\
            \ regla: lo que decide el comportamiento son los tres campos de abajo"
          enum:
          - CLINICO
          - TERAPEUTICO
          - PREVENTIVO
          - BIENESTAR
          example: TERAPEUTICO
        nombre:
          type: string
          description: Nombre visible del servicio
          example: Sesion de kinesiologia
        requiereCasoClinicoDefault:
          type: boolean
          description: Si por defecto la prestacion exige un caso clinico abierto
        version:
          type: integer
          format: int64
          description: Version para el control optimista. Se manda de vuelta en expectedVersion
            al editar o dar de baja
          example: 0
    Sesion:
      type: object
      description: "Atencion real, con su borrador y su version de autosave"
      properties:
        borrador:
          type: string
          description: Contenido opaco tal como se guardo. Ausente si todavia no se
            guardo nada.
        borradorGuardadoEn:
          type: string
          format: date-time
          example: 2026-09-15T12:18:03Z
        cerradaEn:
          type: string
          format: date-time
          example: 2026-09-15T12:48:00Z
        cierre:
          $ref: "#/components/schemas/CierreDeSesion"
          description: Cierre clinico. Ausente si la sesion sigue abierta.
        consultorioId:
          type: integer
          format: int64
          example: 7
        estado:
          type: string
          description: "Estado de la ATENCION, no del turno ni del cobro"
          enum:
          - BORRADOR
          example: BORRADOR
        evaluacion:
          $ref: "#/components/schemas/EvaluacionBase"
          description: Evaluacion base cargada. Todos sus campos pueden estar ausentes.
        evaluadaEn:
          type: string
          format: date-time
          example: 2026-09-15T12:21:00Z
        historiaClinicaId:
          type: integer
          format: int64
          description: "Historia Clinica del paciente, de la ORGANIZACION y no de\
            \ la sede (DP-03). Se crea al iniciar la primera atencion si no existia."
          example: 88
        id:
          type: integer
          format: int64
          example: 501
        iniciadaEn:
          type: string
          format: date-time
          example: 2026-09-15T12:02:44Z
        numeroSesion:
          type: integer
          format: int32
          description: "Correlativo por historia clinica: \"la sesion numero 8 de\
            \ este paciente\". **Ausente mientras la sesion este abierta**, y es lo\
            \ que la marca como cerrada."
          example: 8
        ofertaId:
          type: integer
          format: int64
          example: 42
        previa:
          $ref: "#/components/schemas/EvaluacionPrevia"
          description: "Evaluacion de la sesion ANTERIOR del mismo paciente. Ausente\
            \ si es la primera o si ninguna anterior llego a evaluarse. Viaja con\
            \ la sesion y no en un endpoint aparte porque la pantalla la necesita\
            \ en el mismo momento: mostrar \"la vez pasada tenia 7\" al lado del campo\
            \ de dolor es lo que hace que se cargue una evolucion real y no la que\
            \ se recuerda."
        profesionalId:
          type: integer
          format: int64
          description: Membership del profesional que atiende. Decide quien puede
            guardar.
          example: 31
        turnoId:
          type: integer
          format: int64
          description: Turno que origino la atencion. Ausente en una atencion sin
            turno.
          example: 301
        version:
          type: integer
          format: int64
          description: '**Devolvela al guardar.** Es lo que impide que dos pestanas
            se pisen.'
          example: 3
    SlotDisponible:
      type: object
      description: Un hueco concreto y reservable
      properties:
        cupoLibre:
          type: integer
          format: int32
          description: "Cuantas quedan libres. Un slot completo viaja igual, con cero:\
            \ la pantalla necesita poder mostrar 'completo' en vez de un hueco en\
            \ la grilla, que el usuario leeria como 'no atiende a esa hora'."
          example: 1
        cupoTotal:
          type: integer
          format: int32
          description: "Cuantas reservas admite el turno. 1 individual, mas grupal"
          example: 1
        desde:
          type: string
          format: date-time
          description: "Instante de inicio, UTC"
          example: 2026-09-15T12:00:00Z
        espacioId:
          type: integer
          format: int64
          description: "Espacio asignado. **Siempre ausente por ahora**: el motor\
            \ verifica que exista al menos un espacio habilitado y en servicio, pero\
            \ no elige cual. Elegirlo es parte de la reserva y tiene que ocurrir bajo\
            \ el mismo lock que la crea, o dos busquedas concurrentes prometen el\
            \ mismo box."
        hasta:
          type: string
          format: date-time
          description: "Instante de fin, UTC y EXCLUSIVO"
          example: 2026-09-15T12:45:00Z
        profesionalId:
          type: integer
          format: int64
          description: Membership del profesional que atiende. Ausente si la oferta
            no requiere profesional.
          example: 31
    SubscriptionResponse:
      type: object
      description: "Suscripcion del tenant con su plan, estado y consumo de limites"
      properties:
        allowedTargets:
          type: array
          description: Estados a los que se puede transicionar desde el actual. Vacio
            cuando el estado es terminal
          example:
          - SUSPENDIDA
          - CANCELADA
          items:
            type: string
            enum:
            - ACTIVA
            - SUSPENDIDA
            - CANCELADA
          uniqueItems: true
        id:
          type: integer
          format: int64
          description: Identificador de la suscripcion
          example: 1
        limits:
          type: array
          description: Limites del plan con el consumo actual de cada uno
          items:
            $ref: "#/components/schemas/LimitUsageResponse"
        organizationId:
          type: integer
          format: int64
          description: Organizacion titular de la suscripcion
          example: 1
        planCode:
          type: string
          description: Codigo del plan contratado
          example: BASICO
        planName:
          type: string
          description: Nombre comercial del plan contratado
          example: Basico
        startedAt:
          type: string
          format: date-time
          description: Instante de alta de la suscripcion
          example: 2026-01-15T13:45:00Z
        status:
          type: string
          description: "Estado de la suscripcion. SUSPENDIDA permite lecturas y administracion,\
            \ y rechaza mutaciones de negocio con 409. CANCELADA es terminal"
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: ACTIVA
        version:
          type: integer
          format: int64
          description: Version para bloqueo optimista. Devolverla tal cual al cambiar
            de plan
          example: 0
    SubscriptionTransitionPageResponse:
      type: object
      description: "Pagina del historico de la suscripcion, del hecho mas reciente\
        \ al mas viejo"
      properties:
        content:
          type: array
          description: Hechos de esta pagina
          items:
            $ref: "#/components/schemas/SubscriptionTransitionResponse"
        page:
          type: integer
          format: int32
          description: "Numero de pagina devuelta, base cero"
          example: 0
        size:
          type: integer
          format: int32
          description: Cantidad de elementos por pagina
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Cantidad total de hechos en el historico
          example: 37
        totalPages:
          type: integer
          format: int32
          description: Cantidad total de paginas disponibles
          example: 2
    SubscriptionTransitionRequest:
      type: object
      description: Transicion de estado a aplicar sobre la suscripcion
      properties:
        expectedStatus:
          type: string
          description: "Estado que el actor cree vigente. Si no coincide con el real,\
            \ la operacion se rechaza con 409 en vez de aplicarse sobre una premisa\
            \ falsa"
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: ACTIVA
        reason:
          type: string
          description: Motivo declarado del cambio. Obligatorio al suspender y al
            cancelar
          example: Falta de pago de tres periodos consecutivos
          maxLength: 500
          minLength: 0
        toStatus:
          type: string
          description: "Estado destino. Debe estar entre los allowedTargets que publica\
            \ GET /api/v1/organizations/{orgId}/subscription"
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: SUSPENDIDA
      required:
      - toStatus
    SubscriptionTransitionResponse:
      type: object
      description: Hecho registrado en el historico de la suscripcion
      properties:
        actorAccountId:
          type: integer
          format: int64
          description: Cuenta que ejecuto el cambio. Ausente cuando lo origino un
            proceso automatico
          example: 42
        fromPlanCode:
          type: string
          description: Codigo del plan previo. Ausente en la fila de alta
          example: BASICO
        fromStatus:
          type: string
          description: Estado previo. Ausente en la fila de alta de la suscripcion
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: ACTIVA
        id:
          type: integer
          format: int64
          description: Identificador del hecho
          example: 1
        occurredAt:
          type: string
          format: date-time
          description: Instante en que ocurrio el hecho
          example: 2026-03-01T10:00:00Z
        reason:
          type: string
          description: "Motivo declarado, cuando la transicion lo exige"
          example: Falta de pago de tres periodos consecutivos
        toPlanCode:
          type: string
          description: Codigo del plan resultante
          example: PROFESIONAL
        toStatus:
          type: string
          description: Estado resultante
          enum:
          - ACTIVA
          - SUSPENDIDA
          - CANCELADA
          example: SUSPENDIDA
    SupportAccessResponse:
      type: object
      description: Acceso de soporte concedido sobre una organizacion
      properties:
        accountId:
          type: integer
          format: int64
          description: Cuenta de plataforma que entra al tenant
          example: 1
        active:
          type: boolean
          description: "Baja logica: false cuando el acceso ya fue cerrado"
          example: true
        grantedByAccountId:
          type: integer
          format: int64
          description: Cuenta que lo concedio
          example: 1
        id:
          type: integer
          format: int64
          description: Identificador del acceso
          example: 5
        organizationId:
          type: integer
          format: int64
          description: Organizacion sobre la que rige
          example: 7
        reason:
          type: string
          description: Motivo declarado. Sin motivo no hay soporte
        revokedAt:
          type: string
          format: date-time
          description: "Momento en que se cerro antes de vencer, si se cerro"
        validFrom:
          type: string
          format: date-time
          description: Momento desde el que rige
        validUntil:
          type: string
          format: date-time
          description: Vencimiento. Como maximo cuatro horas despues del otorgamiento
    Turno:
      type: object
      description: "Reserva de un slot. No es la prestacion: DP-05 separa Turno, Recepcion\
        \ y Sesion."
      properties:
        ausenteEn:
          type: string
          format: date-time
          description: Cuando se registro que el paciente no vino
          example: 2026-09-15T12:30:00Z
        canceladoEn:
          type: string
          format: date-time
          example: 2026-09-10T11:20:00Z
        confirmadoEn:
          type: string
          format: date-time
          description: "Ausente mientras el turno no se confirme. Una reprogramacion\
            \ lo vuelve a vaciar: lo confirmado era otro horario."
          example: 2026-09-01T14:05:00Z
        consultorioId:
          type: integer
          format: int64
          example: 7
        espacioId:
          type: integer
          format: int64
          description: "Box asignado. **Lo elige el servidor al reservar**, no la\
            \ busqueda: elegirlo fuera de la transaccion que crea el turno seria una\
            \ promesa que dos busquedas concurrentes rompen. Ausente si la oferta\
            \ no requiere espacio."
          example: 55
        estado:
          type: string
          description: "Estado de la RESERVA. Nunca dice que la atencion ocurrio:\
            \ eso lo dice la Sesion. `CANCELADO` libera el lugar; `AUSENTE` **no**,\
            \ porque la hora se consumio igual."
          enum:
          - RESERVADO
          - CONFIRMADO
          - EN_ESPERA
          - CANCELADO
          - AUSENTE
          example: RESERVADO
        fin:
          type: string
          format: date-time
          description: "Fin, UTC y EXCLUSIVO. Congelado al reservar: si despues se\
            \ edita la duracion de la oferta, este turno no se mueve."
          example: 2026-09-15T12:45:00Z
        id:
          type: integer
          format: int64
          example: 301
        inicio:
          type: string
          format: date-time
          description: "Inicio, UTC"
          example: 2026-09-15T12:00:00Z
        llegadaEn:
          type: string
          format: date-time
          description: "Hora REAL de llegada del paciente al centro, puesta por el\
            \ servidor (M13). Ausente mientras no llego, y se vacia si se deshace\
            \ el check-in: un check-in deshecho no dejo una llegada, dejo un error\
            \ corregido."
          example: 2026-09-15T11:52:00Z
        motivoCancelacion:
          type: string
          description: "Por que se cancelo. Obligatorio al cancelar (DP-04), ausente\
            \ en cualquier otro estado."
          example: El paciente aviso que no puede venir
        ofertaId:
          type: integer
          format: int64
          example: 42
        personaId:
          type: integer
          format: int64
          description: Persona del padron para la que se reservo
          example: 128
        profesionalId:
          type: integer
          format: int64
          description: Membership del profesional. Ausente si la oferta no lo requiere.
          example: 31
        reprogramadoEn:
          type: string
          format: date-time
          description: Ultima vez que el turno se movio de horario. El detalle completo
            esta en el historial.
          example: 2026-09-12T09:00:00Z
        reservadoEn:
          type: string
          format: date-time
          example: 2026-09-01T14:03:11Z
        version:
          type: integer
          format: int64
          description: "Version para el control optimista. Se envia al cancelar, mover\
            \ o marcar ausencia."
          example: 0
    TurnoDelDia:
      type: object
      description: "Turno de la agenda del dia de una sede, con el paciente resuelto.\
        \ PHI minima: no lleva ningun dato clinico."
      properties:
        documento:
          type: string
          description: "Tipo y numero, para desambiguar homonimos. Ausente si la ficha\
            \ no lo tiene."
          example: DNI 30111222
        espacioId:
          type: integer
          format: int64
          description: "Box asignado, si la oferta requiere espacio"
          example: 55
        estado:
          type: string
          description: "`EN_ESPERA` significa que el paciente llego y aguarda. No\
            \ significa que lo esten atendiendo: la prestacion la registra la Sesion."
          enum:
          - RESERVADO
          - CONFIRMADO
          - EN_ESPERA
          - CANCELADO
          - AUSENTE
          example: CONFIRMADO
        fin:
          type: string
          format: date-time
          description: "Fin, UTC y EXCLUSIVO"
          example: 2026-09-15T12:45:00Z
        id:
          type: integer
          format: int64
          example: 301
        inicio:
          type: string
          format: date-time
          description: "Inicio, UTC. La pantalla lo muestra en la zona de la sede."
          example: 2026-09-15T12:00:00Z
        llegadaEn:
          type: string
          format: date-time
          description: "Hora REAL de llegada, puesta por el servidor. Ausente si no\
            \ llego."
          example: 2026-09-15T11:52:00Z
        motivoCancelacion:
          type: string
          description: "Por que se cancelo. **Los cancelados se devuelven igual**:\
            \ alguien puede presentarse al mostrador con un turno que se cancelo,\
            \ y esconderlo deja a la recepcion sin nada que decirle."
          example: El profesional se enfermo
        ofertaId:
          type: integer
          format: int64
          example: 42
        ofertaNombre:
          type: string
          example: Kinesiologia - sesion individual
        personaId:
          type: integer
          format: int64
          example: 128
        personaNombre:
          type: string
          description: "Apellido y nombre, ya compuestos"
          example: "Perez, Ana"
        profesionalId:
          type: integer
          format: int64
          description: Membership del profesional. Ausente si la oferta no lo requiere.
          example: 31
        version:
          type: integer
          format: int64
          description: Version para el control optimista de las transiciones
          example: 0
    UpdateArancelRequest:
      type: object
      description: Cambios a aplicar sobre un arancel. Los campos nulos no se tocan
      properties:
        coseguro:
          type: number
          description: La parte que paga el paciente
          example: 2600.0
          minimum: 0.00
        expectedVersion:
          type: integer
          format: int64
          description: Version leida del arancel
          example: 0
          minimum: 0
        importeFinanciador:
          type: number
          description: La parte que paga el financiador
          example: 10400.0
          minimum: 0.00
        importeTotal:
          type: number
          description: Lo que vale la practica bajo este convenio
          example: 13000.0
          minimum: 0.00
        vigenciaDesde:
          type: string
          format: date
          description: Primer dia en que este importe se aplica
          example: 2026-01-01
        vigenciaHasta:
          type: string
          format: date
          description: "Ultimo dia en que se aplica, INCLUSIVE"
          example: 2026-06-30
      required:
      - expectedVersion
    UpdateAutorizacionRequest:
      type: object
      description: Cambios sobre una autorizacion
      properties:
        cantidadAutorizada:
          type: integer
          format: int32
          description: Sesiones otorgadas. No puede quedar por debajo de lo ya consumido
          example: 10
          minimum: 0
        expectedVersion:
          type: integer
          format: int64
          description: Version que el cliente leyo. Una version vieja responde 409
            en vez de pisar el cambio ajeno en silencio
          example: 0
        numero:
          type: string
          description: Numero que devolvio el financiador
          example: AUT-99120034
          maxLength: 64
          minLength: 0
        observaciones:
          type: string
          description: Notas administrativas. NUNCA contenido clinico
          maxLength: 500
          minLength: 0
        ordenMedicaId:
          type: integer
          format: int64
          description: Orden medica que la respalda. Tiene que ser de esta persona
          example: 51
        vigenciaDesde:
          type: string
          format: date
          description: Primer dia en que habilita
          example: 2026-09-01
        vigenciaHasta:
          type: string
          format: date
          description: "ULTIMO dia, INCLUSIVE"
          example: 2026-12-31
      required:
      - expectedVersion
    UpdateBloqueRequest:
      type: object
      description: Cambios a aplicar sobre un bloque de disponibilidad vigente
      properties:
        diaSemana:
          type: integer
          format: int32
          description: "Nuevo dia de la semana, ISO-8601: lunes = 1 .. domingo = 7.\
            \ Omitirlo lo deja como estaba"
          example: 3
          maximum: 7
          minimum: 1
        horaDesde:
          type: string
          description: Nueva hora local de inicio. Omitirla la deja como estaba
          example: 10:00
        horaHasta:
          type: string
          description: "Nueva hora local de fin, EXCLUSIVA. 24:00 para un bloque que\
            \ llega a la medianoche. Omitirla la deja como estaba"
          example: 24:00
        limpiarVigenciaHasta:
          type: boolean
          description: "Saca el fin de vigencia y deja el bloque sin fin previsto.\
            \ Existe porque un null no puede expresarlo: \"no toques el fin\" y \"\
            saca el fin\" son dos intenciones distintas, y con un solo campo nulable\
            \ la segunda es imposible de pedir"
          example: false
        version:
          type: integer
          format: int64
          description: "Version que el cliente leyo. Se compara ANTES de mutar: si\
            \ quedo vieja la respuesta es 409 con type conflict y hay que recargar.\
            \ Sin esto dos ediciones simultaneas se pisan y el segundo en guardar\
            \ borra el cambio del primero sin que nadie se entere"
          example: 0
          minimum: 0
        vigenciaDesde:
          type: string
          format: date
          description: Nuevo primer dia de vigencia. Omitirlo lo deja como estaba
          example: 2026-09-01
        vigenciaHasta:
          type: string
          format: date
          description: "Nuevo fin de vigencia, EXCLUSIVO. Se IGNORA si limpiarVigenciaHasta\
            \ viene en true"
          example: 2027-01-01
      required:
      - version
    UpdateCalendarioRequest:
      type: object
      description: Cambios a aplicar sobre la politica de calendario de la sede
      properties:
        cierraPorFeriado:
          type: boolean
          description: "Si la sede cierra los feriados de ese pais. OMITIRLO lo deja\
            \ como estaba: null NO es false. Apagarlo abre de golpe todos los feriados\
            \ del calendario para todos los profesionales de la sede, por eso el cambio\
            \ se audita aunque sea un solo flag"
          example: true
        pais:
          type: string
          description: Pais cuyo calendario de feriados usa la sede. Omitirlo lo deja
            como estaba; el valor por defecto de una sede nueva es AR
          example: AR
          pattern: "[A-Za-z]{2}"
    UpdateCatalogoConceptoRequest:
      type: object
      description: Cambios a aplicar sobre un concepto del catalogo
      properties:
        clearValidUntil:
          type: boolean
          description: "Deja el concepto sin fin de vigencia. Hace explicito lo que\
            \ un campo omitido no puede expresar: 'no toques el fin' y 'sacale el\
            \ fin' son dos intenciones distintas"
          example: false
        descripcion:
          type: string
          description: Nueva descripcion. Cadena vacia la borra
          maxLength: 280
          minLength: 0
        name:
          type: string
          description: Nuevo nombre visible
          maxLength: 160
          minLength: 0
        validFrom:
          type: string
          format: date-time
          description: "Nuevo inicio de la vigencia, en UTC"
        validUntil:
          type: string
          format: date-time
          description: "Nuevo fin de la vigencia, EXCLUSIVO. Se ignora si clearValidUntil\
            \ es true"
        valorReferencia:
          type: number
          description: "Solo para una vigencia de nomenclador: corrige el valor publicado.\
            \ Corregir NO es actualizar el nomenclador; actualizarlo es cerrar esta\
            \ vigencia y abrir una nueva"
          minimum: 0
        version:
          type: integer
          format: int64
          description: "Version que el cliente leyo. Si quedo vieja, 409 concurrent-modification\
            \ y hay que recargar"
          example: 0
      required:
      - version
    UpdateCoberturaRequest:
      type: object
      description: Datos editables de una cobertura. Lo copiado del plan no se puede
        cambiar
      properties:
        credencialVigenciaHasta:
          type: string
          format: date
          description: "Nuevo ultimo dia de validez de la credencial, INCLUSIVE"
        expectedVersion:
          type: integer
          format: int64
          description: Version leida por el cliente. Una version vieja responde 409
            en vez de pisar el cambio ajeno en silencio
          example: 0
        numeroAfiliado:
          type: string
          description: Nuevo numero de credencial
          maxLength: 64
          minLength: 0
        observaciones:
          type: string
          description: Notas administrativas. NUNCA contenido clinico
          maxLength: 500
          minLength: 0
        vigenciaDesde:
          type: string
          format: date
          description: Correccion del primer dia de vigencia
        vigenciaHasta:
          type: string
          format: date
