    CerrarSesion:
      type: object
      description: "Cierre clinico de la atencion. Es idempotente: cerrar dos veces\
        \ devuelve el mismo resultado y NO renumera."
      properties:
        asistencia:
          type: string
          description: "**Obligatorio.** Sin esto no se sabe si hubo prestacion. `AUSENTE`\
            \ es un cierre legitimo —la ausencia tambien es un hecho— y evita que\
            \ el turno quede abierto para siempre. Con `AUSENTE` nada mas es obligatorio:\
            \ pedir resultado de una atencion que no ocurrio seria pedir que se invente."
          enum:
          - PRESENTE
          - AUSENTE
          example: PRESENTE
        indicaciones:
          type: string
          description: Lo que el paciente se lleva
          example: Repetir el ejercicio 2 veces por dia
          maxLength: 1000
          minLength: 0
        notaDeCierre:
          type: string
          description: "**Obligatorio si el paciente asistio.** El detalle estructurado\
            \ de tratamientos es AKINE-06.04, fuera de alcance, asi que esta nota\
            \ es lo unico que registra que se hizo."
          example: "Terapia manual lumbar, ejercicios de estabilizacion, 30 minutos"
          maxLength: 2000
          minLength: 0
        proximaConducta:
          type: string
          description: Que sigue. Es lo que convierte una sesion suelta en un tratamiento.
          enum:
          - CONTINUA
          - ALTA
          - DERIVA
          - REEVALUA
          example: CONTINUA
        respuestaTratamiento:
          type: string
          description: Como respondio a lo realizado hoy
          example: Alivio inmediato del dolor
          maxLength: 500
          minLength: 0
        tolerancia:
          type: string
          description: "Como tolero lo que se le hizo. Es distinto del resultado:\
            \ se puede tolerar mal algo que funciona."
          enum:
          - BUENA
          - REGULAR
          - MALA
          example: BUENA
        version:
          type: integer
          format: int64
          description: Version que el cliente leyo
          example: 4
          minimum: 0
      required:
      - asistencia
      - version
