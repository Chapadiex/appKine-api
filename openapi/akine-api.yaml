            \ aca el motivo no se puede omitir: una deuda que se borra sin explicacion\
            \ es exactamente lo que una auditoria busca, porque alguien anulo un cargo\
            \ y no hay forma de saber si fue un error de carga, una cortesia u otra\
            \ cosa."
