        Baja LOGICA con motivo obligatorio. Exige convenio:manage sobre la sede de la ruta.

        LO YA LIQUIDADO BAJO ESTE CONVENIO NO SE TOCA. Sigue explicandose con la copia congelada que guardo al devengar: RN-M16-003 prohibe recalcular historicos.

        NO CASCADEA a los aranceles y no se bloquea por tenerlos: dejan de resolver porque su convenio dejo de resolver. El numero de aranceles activos queda en la auditoria.

        Libera el codigo Y EL PERIODO para un convenio nuevo de la misma sede: el no-solapamiento solo mira los activos.

        Si lo que se quiere es que el convenio deje de aplicarse a partir de una fecha pero siga siendo un convenio vigente hasta entonces, la operacion NO es esta: es cerrar la vigencia con el PUT.

        No hay reactivacion.
      operationId: deactivateConvenio
