          type: number
          description: La parte que paga el paciente
          example: 2400.0
        fecha:
          type: string
          format: date
          description: Dia contra el que se resolvio
          example: 2026-03-15
        importeFinanciador:
          type: number
          description: La parte que paga el financiador
          example: 9600.0
        importeTotal:
          type: number
          description: Lo que vale la practica bajo ese convenio
          example: 12000.0
        limiteSesionesMensual:
          type: integer
          format: int32
