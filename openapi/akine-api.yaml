          type: string
          format: date-time
          example: 2026-09-15T12:48:00Z
        estado:
          type: string
          description: Los tres primeros se derivan del saldo; `ANULADA` es una decision.
          enum:
          - PENDIENTE
          - PARCIAL
          - PAGADA
          - ANULADA
          example: PENDIENTE
        id:
          type: integer
          format: int64
          example: 9001
        importeOriginal:
          type: number
          description: Lo devengado. No cambia nunca.
          example: 8500.0
        moneda:
          type: string
          example: ARS
        motivoAnulacion:
          type: string
          description: "Obligatorio al anular: una deuda que se borra sin explicacion\
            \ es lo que una auditoria busca"
        ofertaId:
          type: integer
          format: int64
          example: 42
        personaId:
          type: integer
          format: int64
          example: 128
        responsable:
          type: string
          description: "Quien debe. Hoy siempre `PACIENTE`: el Paquete B fija cobertura\
            \ particular. `FINANCIADOR` llega con AKINE-03.03 y 03.05."
          enum:
          - PACIENTE
          - FINANCIADOR
          example: PACIENTE
        saldo:
          type: number
          description: Lo que falta pagar
          example: 8500.0
        sesionId:
          type: integer
          format: int64
          description: Atencion que la genero. Es lo que la hace trazable.
          example: 501
        snapshotNombre:
          type: string
          description: "Que se presto, al momento de devengar"
          example: Sesion 8
        snapshotPrecio:
          type: number
          description: "Precio de la oferta **al momento de devengar**. Editar la\
            \ oferta manana no cambia esto: seria reescribir una cuenta corriente."
          example: 8500.0
        version:
          type: integer
          format: int64
          description: Version para el control optimista
          example: 0
    OfertaResponse:
      type: object
