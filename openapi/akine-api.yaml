      required:
      - justificacion
      - nombrePropuesto
      - tipo
    CreateCoberturaRequest:
      type: object
      description: Datos para agregar una cobertura a un paciente
      properties:
        credencialVigenciaHasta:
          type: string
          format: date
          description: "Ultimo dia de validez de la credencial, INCLUSIVE. Es METADATA:\
            \ una credencial vencida NO invalida la cobertura, se informa como alerta"
          example: 2027-12-31
        numeroAfiliado:
          type: string
          description: Numero de credencial del paciente ante el financiador. Obligatorio
            si el plan congelado exigia credencial
          example: "62000123456"
          maxLength: 64
          minLength: 0
        observaciones:
          type: string
          description: Notas administrativas. NUNCA contenido clinico
          maxLength: 500
          minLength: 0
        planId:
          type: integer
          format: int64
          description: "Plan de cobertura a congelar. Obligatorio si tipo es FINANCIADA\
            \ y prohibido si es PARTICULAR. Un plan dado de baja, de un financiador\
            \ dado de baja, ajeno, inexistente, o fuera de vigencia el dia vigenciaDesde\
            \ responde 409 plan-no-seleccionable: los cinco casos igual, para no convertir\
            \ este endpoint en un oraculo del catalogo ajeno"
          example: 88
        principal:
          type: boolean
          description: "Cobertura preferida del paciente. Ausente = false. Como maximo\
            \ una activa con vigencias solapadas: si ya hay otra, 409"
        tipo:
          type: string
          description: "PARTICULAR o FINANCIADA. PARTICULAR es la ausencia de plan\
            \ y no necesita ningun dato de financiador: siempre esta disponible (RN-M08-001)"
          enum:
          - PARTICULAR
          - FINANCIADA
          example: FINANCIADA
          pattern: PARTICULAR|FINANCIADA
        vigenciaDesde:
          type: string
          format: date
          description: Primer dia en que la cobertura aplica. Es tambien el dia contra
            el que se evalua si el plan se puede elegir
          example: 2026-09-01
        vigenciaHasta:
          type: string
          format: date
          description: "ULTIMO dia en que aplica, INCLUSIVE. Null = sin fin previsto.\
            \ Puede coincidir con vigenciaDesde"
          example: 2027-08-31
      required:
      - tipo
      - vigenciaDesde
    CreateConsultorioRequest:
      type: object
      description: Datos para dar de alta una sede adicional
      properties:
        addressLine:
          type: string
          description: Direccion
          maxLength: 240
          minLength: 0
        contactEmail:
          type: string
          format: email
          description: Email de contacto
          maxLength: 160
          minLength: 0
        legalName:
          type: string
          description: Razon social
          maxLength: 200
          minLength: 0
        name:
          type: string
          description: "Nombre de la sede. Unico entre las sedes VIGENTES del tenant:\
            \ el nombre de una sede dada de baja se puede reusar"
          example: Sede Norte
          maxLength: 160
          minLength: 0
        phone:
          type: string
          description: Telefono de contacto
          maxLength: 40
          minLength: 0
        slotMinutes:
          type: integer
          format: int32
          description: "Intervalo por defecto de la agenda, en minutos. Si se omite,\
            \ 30"
          example: 30
          maximum: 480
          minimum: 5
        taxId:
          type: string
          description: Identificacion fiscal
          maxLength: 32
          minLength: 0
        timezone:
          type: string
          description: "Zona horaria IANA de la sede. Si se omite, se hereda la de\
            \ la organizacion. Solo se aceptan identificadores IANA: un offset fijo\
            \ como -03:00 no conoce el horario de verano y correria la agenda"
          example: America/Argentina/Cordoba
          maxLength: 64
          minLength: 0
      required:
      - name
    CreateConvenioRequest:
      type: object
      description: Datos para dar de alta un convenio de la sede con un plan de un
        financiador
      properties:
        codigo:
          type: string
          description: "Clave estable del convenio DENTRO de la sede. NO se puede\
            \ cambiar: es lo que un snapshot economico guarda para explicarse seis\
            \ meses despues. Otra sede si puede usar el mismo codigo"
          example: OSDE-210-2026
          maxLength: 64
          minLength: 0
        documentacionRequerida:
          type: string
          description: Documentacion administrativa que el financiador exige. Nunca
            contenido clinico
          maxLength: 500
          minLength: 0
        financiadorId:
          type: integer
          format: int64
          description: Financiador con el que se negocia
          example: 31
          minimum: 0
        limiteSesionesMensual:
          type: integer
          format: int32
          description: Tope de sesiones por mes pactado. Omitir significa SIN tope;
            cero no es un valor valido
          example: 20
          minimum: 1
        modalidad:
          type: string
          description: "Como se pacto la prestacion. CLASIFICA, no habilita: ninguna\
            \ decision del sistema depende de este valor"
          enum:
          - POR_PRESTACION
          - POR_SESION
          - MODULO
          - CAPITA
          example: POR_PRESTACION
        moneda:
          type: string
          description: "ISO 4217 de los aranceles de este convenio. Obligatoria: todos\
            \ sus aranceles la heredan, y un arancel en otra moneda que su convenio\
            \ seria un dato roto"
          example: ARS
          maxLength: 3
          minLength: 3
        nombre:
          type: string
          description: Nombre visible del convenio
          example: OSDE 210 - 2026
          maxLength: 160
          minLength: 0
        observaciones:
          type: string
          description: Notas administrativas. Nunca contenido clinico
          maxLength: 500
          minLength: 0
        planId:
          type: integer
          format: int64
          description: "Plan de cobertura del financiador. Obligatorio: es lo que\
            \ hace que la resolucion del arancel tenga como mucho una candidata"
          example: 88
          minimum: 0
        requiereAutorizacion:
          type: boolean
          description: Si exige autorizacion previa del financiador. Ausente = false
        requiereCredencial:
          type: boolean
          description: "Si exige numero de credencial del paciente. Ausente = TRUE,\
            \ al reves que los otros dos: pedir la credencial es lo normal en una\
            \ prestacion financiada"
        requiereOrden:
          type: boolean
          description: Si la prestacion exige orden medica. Se declara; lo interpreta
            M17. Ausente = false
        vigenciaDesde:
          type: string
          format: date
          description: Primer dia en que el convenio se aplica
          example: 2026-01-01
        vigenciaHasta:
          type: string
          format: date
          description: "ULTIMO dia en que se aplica, INCLUSIVE. Null significa sin\
            \ fin previsto. Puede coincidir con vigenciaDesde"
          example: 2026-12-31
      required:
      - codigo
      - financiadorId
      - modalidad
      - moneda
      - nombre
      - planId
      - vigenciaDesde
    CreateEspacioRequest:
      type: object
      description: Datos para dar de alta un espacio en la sede
