            \ NO se puede cambiar despues. Unico entre los financiadores VIGENTES\
            \ de la organizacion: el codigo de uno dado de baja si se puede reusar"
          example: OSDE
          maxLength: 64
          minLength: 0
        cuit:
          type: string
          description: "CUIT. Se normaliza a 11 digitos: los guiones y los puntos\
