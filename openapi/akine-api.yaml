          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El convenio no existe, es de otra organizacion, o es de otra\
            \ sede"
      summary: Ver un convenio
      tags:
