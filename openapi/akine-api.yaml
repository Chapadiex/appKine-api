      properties:
        permissions:
          type: array
          description: "Codigos del catalogo que la cuenta tiene vigentes en este\
            \ contexto, en orden alfabetico estable"
          example:
          - auditoria:read
          - colaborador:manage
          - colaborador:read
          items:
            type: string
    GrantPlatformRoleRequest:
      type: object
      description: Rol de plataforma a otorgar
      properties:
        accountId:
          type: integer
          format: int64
          description: Cuenta que recibe el rol
          example: 18
          minimum: 0
        reason:
          type: string
          description: Motivo declarado. Otorgar el permiso mas alto del sistema lo
            exige
          example: "Alta del segundo administrador de plataforma, ticket OPS-118"
          maxLength: 500
          minLength: 0
      required:
      - accountId
      - reason
    GrantSupportAccessRequest:
      type: object
      description: Acceso de soporte a conceder sobre una organizacion
      properties:
        durationMinutes:
          type: integer
          format: int32
          default: 240
          description: Duracion en minutos. Por defecto y como maximo 240 (cuatro
            horas)
          example: 60
          maximum: 240
          minimum: 1
        reason:
          type: string
          description: "Por que se necesita entrar al tenant. Queda en la auditoria\
            \ del cliente, no solo en la de plataforma"
          example: "Incidente 4821: la caja no cierra y el cliente pidio asistencia"
          maxLength: 500
          minLength: 0
      required:
      - reason
    LimitUsageResponse:
      type: object
      description: Consumo actual de un limite del plan contratado
      properties:
        code:
          type: string
          description: Codigo del limite
          enum:
          - MAX_CONSULTORIOS
          - MAX_MIEMBROS_ACTIVOS
          example: MAX_CONSULTORIOS
        currentUsage:
          type: integer
          format: int64
          description: Cantidad de recursos activos que consumen este limite
          example: 2
        exceeded:
          type: boolean
          description: "true cuando el uso actual ya supera el tope del plan. Un downgrade\
            \ puede dejarlo en true sin borrar nada: lo existente sigue operativo\
            \ y solo se rechazan las altas nuevas"
          example: false
        limitValue:
          type: integer
          format: int32
          description: Tope que impone el plan. Ausente cuando el limite es ilimitado
          example: 3
    LoginRequest:
      type: object
