            schema:
              $ref: "#/components/schemas/CreateArancelRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArancelResponse"
          description: Arancel creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Importes que no cuadran, importe negativo, vigencia invertida\
            \ o vigencia fuera de la del convenio"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage en esa
            sede
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede, el convenio o la practica no son accesibles"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Periodo solapado (arancel-solapado) o convenio dado de baja
            (convenio-inactivo)
      summary: Definir el arancel de una practica bajo un convenio
      tags:
      - Convenios y aranceles
