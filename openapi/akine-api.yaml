          example: PROFESIONAL
        validFrom:
          type: string
          format: date-time
          description: Momento desde el que el vinculo es valido
        validUntil:
          type: string
          format: date-time
          description: "Momento hasta el que el vinculo es valido, o null si no vence"
    OrganizationResponse:
      type: object
      description: Organizacion (tenant) con su estado operativo efectivo
      properties:
        active:
          type: boolean
          description: false cuando la organizacion fue dada de baja logica
