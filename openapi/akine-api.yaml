        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede o el convenio no son accesibles
      summary: Listar los aranceles de un convenio
      tags:
      - Convenios y aranceles
    post:
      description: |-
        Exige convenio:manage sobre la sede de la ruta.

        DOS ARANCELES DE LA MISMA PRACTICA EN EL MISMO CONVENIO NO PUEDEN SOLAPARSE: 409 arancel-solapado, con el id y el periodo del que choca en el cuerpo del problema. Dos aranceles de la misma practica SI conviven —el de 2026 y el de 2027— y esa convivencia es el caso normal.

        LOS TRES IMPORTES TIENEN QUE CUADRAR: importeFinanciador + coseguro = importeTotal, exactamente. No hay porcentaje de cobertura a proposito: un porcentaje obliga a redondear, y el redondeo de un arancel es la diferencia de un centavo que aparece seis meses despues en una presentacion rechazada.

        La moneda NO viaja en el cuerpo: la hereda del convenio.

        La vigencia del arancel tiene que estar CONTENIDA en la del convenio. Fuera de ella nunca podria resolver, porque la resolucion exige primero un convenio aplicable.

        La practica puede ser global de plataforma o propia de la organizacion; una de otro tenant responde 404.
