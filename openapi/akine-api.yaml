          - FERIADO
          - BLOQUEO
          - AMPLIACION
          - OTRO
          example: LICENCIA
        notes:
          type: string
          description: Texto libre operativo. NUNCA informacion clinica
          maxLength: 280
          minLength: 0
        tipo:
          type: string
          description: "CIERRE recorta disponibilidad; APERTURA la habilita donde\
            \ no la habia. La apertura NO es el caso raro: es como un centro declara\
            \ que atiende un feriado o que suma una banda un sabado puntual"
          enum:
          - CIERRE
          - APERTURA
          example: CIERRE
      required:
      - fechaDesde
      - fechaHasta
      - motivo
      - tipo
    CreateFinanciadorRequest:
