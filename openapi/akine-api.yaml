  /api/v1/consultorios/{consultorioId}/excepciones:
    get:
      description: |-
        Devuelve las excepciones ACTIVAS cuya ventana de fechas se solapa con [desde, hasta).

        LAS DOS RESPUESTAS SON DISTINTAS, Y NO POR CASUALIDAD:

        CON membershipId devuelve las de ESE profesional MAS las de alcance SEDE ENTERA. Las dos poblaciones son obligatorias: si devolviera solo las suyas, un cierre de sede completo dejaria de aplicarsele sin que nada lo detecte.

        SIN membershipId devuelve SOLO las de alcance SEDE. Es la vista del calendario del centro; devolver ahi las de todos los profesionales convertiria una vista de sede en un listado de ausencias de personas, que es informacion de otra pantalla y de otro permiso.

        La ventana es semiabierta: hasta es EXCLUSIVO, y hasta == desde es 400, no "un dia". El maximo es de 366 dias; el error trae maximoDias para que la pantalla recorte sola.

        Un profesional DESVINCULADO se sigue pudiendo consultar: RN-M05-003, desvincular no borra su historia.

        Exige colaborador:read sobre esa sede.
      operationId: listExcepciones
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Primer dia de la ventana, fecha local ISO-8601"
        example: 2026-09-01
        in: query
        name: desde
        required: true
        schema:
          type: string
          format: date
      - description: "Fin de la ventana, EXCLUSIVO, fecha local ISO-8601"
        example: 2026-10-01
        in: query
        name: hasta
        required: true
        schema:
          type: string
          format: date
      - description: "Vinculo del profesional. OMITIRLO devuelve SOLO las excepciones\
          \ de alcance SEDE, no las de todos los profesionales"
        example: 1
        in: query
        name: membershipId
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExcepcionResponse"
          description: Excepciones activas que cubren parte de la ventana. Lista vacia
            si no hay ninguna
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ventana ausente, invertida o vacia (validation-error), o de\
            \ mas de 366 dias (ventana-demasiado-amplia, con maximoDias)"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ colaborador:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o el profesional no existen, o pertenecen a otro tenant"
      summary: Excepciones vigentes de la sede en una ventana
      tags:
      - Excepciones de disponibilidad
    post:
      description: |-
        Carga una excepcion al horario base: una ausencia, una licencia, un bloqueo o una ampliacion excepcional (RF-M05-004). Exige consultorio:manage sobre ESA sede.

        RESPONDE 201 O 200, Y UN CLIENTE QUE SOLO CONTEMPLE 201 SE ROMPE. El alta es IDEMPOTENTE sin Idempotency-Key (CA-M05-004-05): un pedido que coincide EXACTAMENTE con una excepcion activa que ya existe devuelve 200 con esa fila, no crea nada y no vuelve a auditar. notes y feriadoId quedan FUERA de esa comparacion. Solo el alta que crea la fila responde 201, y solo ella trae Location.

        NO HAY 409 POR SOLAPAMIENTO, Y ES UNA DIFERENCIA DELIBERADA CON LOS BLOQUES. Dos excepciones que se pisan sin ser identicas son las dos legitimas y las dos se guardan: una ausencia de una tarde dentro de una licencia mas larga es un hecho corriente, no un conflicto. No escribir manejo de error de solapamiento para esta operacion: nunca lo va a emitir.

        Los 409 que SI existen aca son otros dos, y ninguno depende de las fechas: la sede dada de baja (consultorio-inactive) y el profesional sin vinculo vigente en esa sede (profesional-no-vinculado), este ultimo solo cuando se manda membershipId.

        OMITIR membershipId significa SEDE ENTERA —afecta a TODOS los profesionales—, no un dato faltante. Y fechaHasta es EXCLUSIVA: un cierre de un solo dia se carga como [D, D+1). Mandar fechaDesde == fechaHasta cierra cero dias.

        APERTURA no es el caso raro: es como un centro declara que atiende un feriado o que suma una banda un sabado puntual.
      operationId: createExcepcion
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExcepcionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcepcionResponse"
          description: "ALTA IDEMPOTENTE: ya existia una excepcion activa identica\
            \ y se devuelve esa. No se creo ninguna fila y no hay Location"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcepcionResponse"
          description: Excepcion creada. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos obligatorios ausentes, rango de fechas incoherente,\
            \ o una sola de las dos horas (vienen las dos o ninguna)"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o el profesional no existen, o pertenecen a otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sede dada de baja (consultorio-inactive), o profesional sin\
            \ vinculo vigente en esa sede (profesional-no-vinculado). NUNCA por solapamiento:\
            \ dos excepciones que se pisan son las dos validas"
      summary: Alta de un cierre o de una apertura puntual
      tags:
      - Excepciones de disponibilidad
  /api/v1/consultorios/{consultorioId}/excepciones/{excepcionId}:
    delete:
      description: |-
        Da de baja la excepcion con MOTIVO OBLIGATORIO en el cuerpo. NO borra nada: la fila queda INACTIVA con su motivo, su autor y su instante, y sus fechas intactas. Cancelar una licencia es un hecho que hay que poder reconstruir.

        El motivo va en el CUERPO y no en la query string: en la URL quedaria en los logs de acceso de cualquier proxy intermedio.

        Se permite aunque la sede este dada de baja y aunque el profesional ya se haya desvinculado: son las operaciones con las que se ordena el calendario de un centro que se esta cerrando.

        Dar de baja dos veces es 409 excepcion-already-inactive: "ya estaba dada de baja" es informacion distinta de "no existe".

        Exige consultorio:manage sobre esa sede.
      operationId: deactivateExcepcion
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la excepcion
        example: 1
        in: path
        name: excepcionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateExcepcionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcepcionResponse"
          description: "Excepcion dada de baja, con sus fechas intactas"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo de la baja, o el cuerpo esta vacio o mal formado"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La excepcion no existe, es de otra sede o de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya estaba dada de baja (excepcion-already-inactive)
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta la cabecera Content-Type: application/json en el cuerpo\
            \ del DELETE. Algunos clientes HTTP generados no la emiten por defecto\
            \ en un DELETE con cuerpo"
      summary: Baja logica de una excepcion de disponibilidad
      tags:
      - Excepciones de disponibilidad
  /api/v1/consultorios/{consultorioId}/obligaciones:
    get:
      description: |-
        La deuda de un paciente en **toda la organizacion**, de la mas reciente a la mas vieja.

        El alcance es la organizacion y no la sede, aunque el permiso se evalue con la sede del contexto: la deuda de un paciente es una sola aunque se haya generado en dos sedes del mismo centro, y mostrarla partida obligaria al administrativo a sumar de memoria.
      operationId: obligacionesDeLaPersona
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Obligacion"
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Obligacion"
          description: Cuenta corriente
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin `cobro:register` en esa sede, o sin contexto de trabajo\
            \ activo"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otro tenant
      summary: Cuenta corriente de un paciente
      tags:
      - Obligaciones
  /api/v1/consultorios/{consultorioId}/obligaciones/{obligacionId}:
    delete:
      description: |-
        Anula la deuda con **motivo obligatorio**. No la borra: una deuda que desaparece de la base es una cuenta corriente que no cuadra y que nadie puede auditar despues.

        **Una obligacion con cobros imputados no se anula.** Anular lo que ya se cobro dejaria plata en la caja sin ninguna deuda que la justifique, y el arqueo del dia no cerraria. Lo que corresponde en ese caso es una devolucion, que es M19 y tiene su propio registro.

        Devuelve la obligacion anulada y no un 204, porque el cuerpo trae el estado y la version nueva que la pantalla necesita para seguir operando.
      operationId: anular
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: obligacionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnularObligacion"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obligacion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Obligacion"
          description: Obligacion anulada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La obligacion o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ya estaba anulada, tiene cobros imputados, o la version quedo\
            \ vieja"
      summary: Anular una obligacion
      tags:
      - Obligaciones
    get:
      operationId: verObligacion
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: obligacionId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obligacion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Obligacion"
          description: Obligacion
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La obligacion o la sede no existen, o son de otro tenant"
      summary: Ver una obligacion
      tags:
      - Obligaciones
  /api/v1/consultorios/{consultorioId}/ofertas:
    get:
      description: |-
        Devuelve las ofertas de esa sede ordenadas por nombre comercial. Exige pertenencia a la sede.

        estado filtra por ciclo de vida y por defecto trae solo las ACTIVAS. servicioId, si viene, acota a las ofertas de ese servicio.

        OJO CON ESTADO Y VIGENTEHOY: son dos cosas distintas. estado dice si la oferta fue dada de baja; vigenteHoy dice si ADEMAS hoy cae dentro de su ventana de vigencia, calculado en la zona horaria DE LA SEDE y no en la del servidor ni en la del navegador. Una oferta ACTIVA que arranca el mes que viene tiene estado=ACTIVO y vigenteHoy=false, y es correcto que no aparezca todavia en un selector de reserva. Es la misma distincion que espacio hace entre activo y en servicio.
      operationId: listOfertas
      parameters:
      - description: Sede cuyas ofertas se listan
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por ciclo de vida. Si se omite, ACTIVO"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Acota a las ofertas de ese servicio global. Si se omite, todas"
        example: 12
        in: query
        name: servicioId
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfertaResponse"
          description: "Ofertas de la sede, ordenadas por nombre comercial"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo elegido, o sin pertenencia a la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otro tenant
      summary: Listar las ofertas de la sede
      tags:
      - Servicios y ofertas
    post:
      description: |-
        Declara que esta sede presta un servicio del catalogo global, y en que condiciones. Exige consultorio:manage sobre esa sede.

        El servicio tiene que estar VIGENTE: sobre uno dado de baja responde 409 servicio-inactivo. Es el unico efecto que la baja de un servicio global tiene sobre los centros; las ofertas que ya existian siguen operando.

        LO QUE SE OMITE, HEREDA. modalidad, requiereCasoClinico y generaRegistroClinico toman el default del servicio si no vienen. Omitirlos NO es apagarlos.

        El nombre comercial es unico entre las ofertas VIGENTES de esa sede, comparado sin distinguir mayusculas ni acentos. El de una oferta dada de baja si se puede reusar.

        El esquema de cobro se guarda como texto declarado y NADIE lo resuelve: los modulos que lo interpretarian no existen todavia (RN-M27-006). Se pide para no perder el dato, no para ramificar por el.
      operationId: createOferta
      parameters:
      - description: Sede donde se da de alta la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfertaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfertaResponse"
          description: Oferta creada. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, o ventana de vigencia incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin consultorio:manage en la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o el servicio no existen, o la sede es de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre comercial repetido (oferta-nombre-comercial-taken),\
            \ servicio dado de baja (servicio-inactivo), o sede no operable (consultorio-no-operable)"
      summary: Dar de alta una oferta en la sede
      tags:
      - Servicios y ofertas
  /api/v1/consultorios/{consultorioId}/ofertas/{ofertaId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige consultorio:manage sobre esa sede.

        RN-M27-007: la oferta deja de admitir reservas nuevas y CONSERVA sus historicos. RF-M27-002 prohibe el borrado fisico cuando hay referencias.

        El motivo es obligatorio: sin el, la auditoria no responde por que seis meses despues.

        No hay reactivacion. Una oferta que vuelve es una ventana de vigencia nueva, no una baja deshecha. Si lo que se quiere es sacarla de circulacion un tiempo, el camino es editar vigenciaHasta, no dar de baja.
      operationId: deactivateOferta
      parameters:
      - description: Sede de la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la oferta
        example: 34
        in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateOfferingRequest"
        required: true
      responses:
        "204":
          description: Oferta dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin consultorio:manage en la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La oferta ya estaba dada de baja (oferta-already-inactive)
      summary: Dar de baja una oferta de la sede
      tags:
      - Servicios y ofertas
    put:
      description: |-
        Exige consultorio:manage sobre esa sede.

        El servicio NO se puede cambiar y por eso no esta en el cuerpo: cambiarlo convertiria esta oferta en otra cosa mientras conserva su id y sus historicos. Lo que corresponde es dar de baja esta y crear la que si presta el otro servicio.

        Los campos en null NO se tocan. Por eso existen limpiarPrecio, limpiarEsquemaCobro y limpiarVigenciaHasta: sin ellos no habria forma de expresar "sacale el precio", porque mandar precioBase: null es indistinguible de no mandarlo. Cuando un limpiar viene en true, el valor correspondiente se ignora.

        Una oferta dada de baja no admite ediciones: 409 oferta-inactiva.
      operationId: updateOferta
      parameters:
      - description: Sede de la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la oferta
        example: 34
        in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfertaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfertaResponse"
          description: Oferta actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos o ventana de vigencia incoherente
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin consultorio:manage en la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre comercial repetido (oferta-nombre-comercial-taken),\
            \ oferta dada de baja (oferta-inactiva), o version desactualizada (conflict)"
      summary: Editar una oferta de la sede
      tags:
      - Servicios y ofertas
  /api/v1/consultorios/{consultorioId}/ofertas/{ofertaId}/agenda:
    get:
      description: |-
        Devuelve los slots libres de una oferta entre dos fechas, dia por dia.

        **Los slots se calculan al leer y no se persisten.** Un slot devuelto no es una reserva ni garantiza que se pueda reservar: entre esta lectura y la escritura puede entrar otro. La exclusion real es de la operacion de reserva.

        **Ningun dia de la ventana se omite.** El dia sin turnos viaja con el motivo que lo explica, porque un dia en blanco sin explicacion es indistinguible de un error.

        El extremo `hasta` es **exclusivo**, y la ventana no puede superar los 62 dias.
      operationId: buscar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Primera fecha incluida, local de la sede"
        example: 2026-09-15
        in: query
        name: desde
        required: true
        schema:
          type: string
          format: date
      - description: "Fin de la ventana, **EXCLUSIVO**, local de la sede"
        example: 2026-09-22
        in: query
        name: hasta
        required: true
        schema:
          type: string
          format: date
      - description: Para acotar a un solo profesional habilitado. Sin este parametro
          se devuelven los slots de todos.
        example: 31
        in: query
        name: profesionalId
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Agenda"
          description: Agenda calculada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ventana invertida, vacia o mas ancha que el maximo"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin `turno:read` en esa sede, o sin contexto de trabajo activo"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o la oferta no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta esta de baja, o su vigencia no toca la ventana pedida"
      summary: Buscar turnos disponibles
      tags:
      - Agenda
  /api/v1/consultorios/{consultorioId}/ofertas/{ofertaId}/habilitaciones:
    get:
      description: |-
        Devuelve las habilitaciones de profesional y de espacio, ACTIVAS E INACTIVAS, mas la capacidad efectiva.

        LEER ESTO ANTES DE ESCRIBIR LA PANTALLA. Una lista vacia significa que la oferta NO esta restringida: cualquier profesional con vinculo vigente puede prestarla y puede prestarse en cualquier espacio de la sede. NO significa que no pueda nadie. Para eso estan restringidaPorProfesional y restringidaPorEspacio, que lo dicen explicito.

        Las habilitaciones dadas de baja vienen igual, con su motivo. No se esconden: esconderlas dejaria al administrador sin entender por que la capacidad efectiva cambio sola.

        Lo mismo con las que apuntan a un recurso que ya no sirve. vinculoVigente en false es un colaborador que se desvinculo; enServicio en false es un espacio que se dio de baja en su propio modulo. La habilitacion sigue existiendo y la fila lo dice.

        capacidadEfectiva es el minimo entre la capacidad de la oferta y la de los espacios habilitados que estan en servicio. Sin espacios habilitados es igual a la comercial: no hay ningun espacio concreto contra el cual acotarla. espacioQueLimita nombra cual la acota, y mostrar un numero mas chico sin ese nombre es un defecto de la pantalla.
      operationId: getHabilitaciones
      parameters:
      - description: Sede de la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Oferta configurada
        example: 34
        in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabilitacionesResponse"
          description: Configuracion de la oferta
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin pertenencia a la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta o la sede no existen, o son de otro tenant"
      summary: Ver quien puede prestar la oferta y donde
      tags:
      - Servicios y ofertas
  /api/v1/consultorios/{consultorioId}/ofertas/{ofertaId}/habilitaciones/espacios:
    put:
      description: |-
        REEMPLAZA EL CONJUNTO COMPLETO, con el mismo criterio que el de profesionales.

        Mandar una lista VACIA quita la restriccion y deja que la oferta pueda prestarse en cualquier espacio de la sede.

        Que un espacio sirva para una oferta NO se infiere de su tipo ni de su nombre (RF-M04-008): elegir "Pileta" al dar de alta un espacio no autoriza hidroterapia ahi, lo autoriza estar en esta lista.

        Solo se aceptan espacios de ESTA sede. Un espacio no se muda entre sedes, asi que habilitar el de otra seria configurar algo que no se puede usar nunca: responde 404.

        OJO CON LA CAPACIDAD: habilitar un espacio mas chico que la capacidad comercial de la oferta BAJA la capacidad efectiva, porque es el minimo entre las dos. No es un error y la respuesta lo explica en espacioQueLimita.
      operationId: reemplazarEspaciosHabilitados
      parameters:
      - description: Sede de la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Oferta configurada
        example: 34
        in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReemplazarHabilitacionesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabilitacionesResponse"
          description: Configuracion resultante
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta la lista o expectedVersion
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin consultorio:manage en la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta, la sede o algun espacio no existen, no son de este\
            \ tenant, o el espacio es de otra sede"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Version desactualizada (conflict), oferta dada de baja (oferta-inactiva),\
            \ o sede no operable (consultorio-no-operable)"
      summary: Fijar en que espacios puede prestarse la oferta
      tags:
      - Servicios y ofertas
  /api/v1/consultorios/{consultorioId}/ofertas/{ofertaId}/habilitaciones/profesionales:
    put:
      description: |-
        REEMPLAZA EL CONJUNTO COMPLETO. Lo que entra y no estaba se crea, lo que estaba y no entra se da de baja con motivo automatico, y lo que sigue no se toca: conserva su id, su vigencia y su version.

        Mandar una lista VACIA es la operacion legitima de quitar la restriccion, y deja la oferta disponible para cualquier profesional con vinculo vigente. No es un error y no se rechaza. La respuesta devuelve restringidaPorProfesional en false para que la pantalla lo pueda decir con palabras: quien borra la ultima habilitacion creyendo que restringe, abre la oferta a todos.

        Cada id es una MEMBERSHIP, no una cuenta: la misma persona puede ser profesional en un centro y administrativa en otro, y habilitar la cuenta habilitaria a alguien que en esta organizacion no atiende. Se aceptan las memberships de toda la organizacion y las acotadas a ESTA sede; una acotada a otra sede responde 404, porque esa persona no atiende aca.

        expectedVersion es la de la OFERTA. Es lo que impide que el segundo administrador en guardar borre en silencio lo que agrego el primero.
      operationId: reemplazarProfesionalesHabilitados
      parameters:
      - description: Sede de la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Oferta configurada
        example: 34
        in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReemplazarHabilitacionesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabilitacionesResponse"
          description: Configuracion resultante
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta la lista o expectedVersion
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin consultorio:manage en la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta, la sede o alguna membership no existen, no son\
            \ de este tenant, o la membership esta acotada a otra sede"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Version desactualizada (conflict), oferta dada de baja (oferta-inactiva),\
            \ o sede no operable (consultorio-no-operable)"
      summary: Fijar que profesionales pueden prestar la oferta
      tags:
      - Servicios y ofertas
  /api/v1/consultorios/{consultorioId}/ofertas/{ofertaId}/validacion:
    get:
      description: |-
        Responde la mitad calculable de RF-M05-008 y RF-M04-009. La otra mitad —reservar de verdad— es de la etapa de agenda, que va a consumir exactamente este endpoint.

        Los dos parametros son opcionales: se puede preguntar solo por el profesional, solo por el espacio, o por los dos. Sin ninguno valida la oferta sola, que sigue siendo una pregunta util: ¿esta oferta se puede usar hoy?

        DEVUELVE TODOS LOS MOTIVOS QUE FALLAN, NO EL PRIMERO. Si al profesional le falta habilitacion y ademas el espacio esta fuera de servicio, arreglar uno solo no alcanza, y decirlo de a uno obliga al usuario a dos vueltas.

        Cada motivo trae un codigo estable para ramificar sin leer prosa. Los ocho posibles son: oferta-inactiva, oferta-fuera-de-vigencia, profesional-no-habilitado, habilitacion-fuera-de-vigencia, vinculo-no-vigente, espacio-no-habilitado, espacio-fuera-de-servicio y capacidad-insuficiente.

        capacidad-insuficiente NO es un rechazo duro: la oferta se puede prestar igual con menos gente. Es informacion para que la agenda decida, y por eso viaja como motivo y no como error.
      operationId: validarOferta
      parameters:
      - description: Sede de la oferta
        example: 3
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Oferta a validar
        example: 34
        in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Membership del profesional que prestaria la oferta
        example: 215
        in: query
        name: membershipId
        required: false
        schema:
          type: integer
          format: int64
      - description: Espacio donde se prestaria
        example: 3
        in: query
        name: espacioId
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidacionDeOfertaResponse"
          description: "Resultado de la validacion, con sus motivos"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo, o sin pertenencia a la sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La oferta o la sede no existen, o son de otro tenant"
      summary: "Saber si esa combinacion puede prestarse, y por que no"
      tags:
      - Servicios y ofertas
  /api/v1/consultorios/{consultorioId}/profesionales/{membershipId}/disponibilidad:
    get:
      description: |-
        Devuelve los bloques ACTIVOS del profesional en esa sede, ordenados por dia y hora (RF-M05-003). Es la lectura de las REGLAS: que horario tiene cargado. La lectura del RESULTADO —que dias y horas concretas atiende— es /disponibilidad/efectiva, y las dos conviven a proposito.

        Exige colaborador:read sobre esa sede, no consultorio:manage: sin eso un profesional no podria ver su propio horario.

        Un profesional DESVINCULADO se sigue pudiendo consultar: RN-M05-003 dice que desvincular no borra bloques ni autoria, y exigir vinculo vigente para leer dejaria al administrador sin poder revisar el horario de quien se fue.

        Los bloques dados de baja NO aparecen. Esta version del contrato no tiene filtro de estado; la fila sobrevive en la base y en la auditoria.
      operationId: listBloquesDisponibilidad
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Vinculo del profesional
        example: 1
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueResponse"
          description: "Bloques activos del profesional, ordenados por dia y hora.\
            \ Lista vacia si no tiene horario cargado"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ colaborador:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o el profesional no existen, o pertenecen a otro tenant"
      summary: Horario semanal cargado de un profesional en la sede
      tags:
      - Disponibilidad profesional
    post:
      description: |-
        Carga un tramo del horario semanal del profesional en esa sede: "los martes de 09 a 13, desde marzo" (RF-M05-003). Exige consultorio:manage sobre ESA sede.

        RESPONDE 201 O 200, Y UN CLIENTE QUE SOLO CONTEMPLE 201 SE ROMPE. El alta es IDEMPOTENTE sin Idempotency-Key: si el pedido reproduce EXACTAMENTE un bloque activo que ya existe —mismo dia, mismas horas, misma vigencia— la respuesta es 200 con ese bloque, no se crea ninguna fila y no se vuelve a auditar. Es el reintento de red, y el historial tiene que quedar como lo dejo el primer intento. Solo el alta que CREA la fila responde 201, y solo ella trae la cabecera Location.

        Un alta sin vigenciaDesde que reproduce un bloque que YA rige tambien entra por ahi: el pedido "que rija desde ahora" esta genuinamente satisfecho.

        Coincidir NO es lo mismo que solapar. Un bloque que se pisa con otro sin reproducirlo exactamente es 409 bloque-solapado. Y solapar no es ser contiguo: la hora de fin es EXCLUSIVA, asi que 09:00-12:00 y 12:00-15:00 conviven —manana y tarde— sin conflicto.

        Dos temporadas del mismo horario tampoco se solapan: el mismo "martes de 09 a 13" cargado para marzo y para septiembre no es un conflicto, es un horario de temporada. Se comparan las tres cosas: dia, horas Y ventana de vigencia.

        La sede tiene que estar ACTIVA: una sede dada de baja no origina hechos nuevos y responde 409 consultorio-inactive. La EDICION y la BAJA si se permiten sobre una sede inactiva, que es con lo que se ordena el horario de un centro que se esta cerrando.

        El profesional tiene que tener un vinculo VIGENTE que lo habilite en esa sede (RN-M05-001), o la respuesta es 409 profesional-no-vinculado.
      operationId: createBloqueDisponibilidad
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Vinculo del profesional
        example: 1
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBloqueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueResponse"
          description: "ALTA IDEMPOTENTE: ya existia un bloque activo identico y se\
            \ devuelve ese. No se creo ninguna fila y no hay Location"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueResponse"
          description: Bloque creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Dia fuera de 1..7, horas ausentes, u horario incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto\
            \ de trabajo seleccionado"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o el profesional no existen, o pertenecen a otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Solapamiento con otro bloque activo (bloque-solapado), sede\
            \ dada de baja (consultorio-inactive), o profesional sin vinculo vigente\
            \ en esa sede (profesional-no-vinculado)"
      summary: Alta de un bloque recurrente de disponibilidad
      tags:
      - Disponibilidad profesional
  /api/v1/consultorios/{consultorioId}/profesionales/{membershipId}/disponibilidad/efectiva:
    get:
      description: |-
        Resuelve que dias y horas CONCRETAS atiende el profesional en esa sede durante la ventana pedida, aplicando todo junto: la vigencia de cada bloque, las excepciones de la sede, las del profesional, la vigencia de su vinculo y la politica de feriados de la sede.

        LEER ESTO ANTES DE ESCRIBIR LA PANTALLA. franja.origen, franja.recortadoPor y dia.razonVacio NO son extras: son el criterio de aceptacion de la etapa —"la disponibilidad efectiva explica que regla la afecta"—. Una pantalla que dibuje las franjas y descarte esos tres campos deja al administrador sin poder saber por que un dia esta en blanco, que es justamente donde no puede adivinarlo.

        razonVacio tiene CUATRO valores y confundir dos de ellos manda a alguien a buscar algo que no existe: FERIADO, CIERRE, VINCULO —el vinculo del profesional no estaba vigente ese dia— y null. "No atiende ese dia" y "ya no trabaja aca" necesitan textos distintos.

        NUNCA se omite un dia de [desde, hasta), ni siquiera si el profesional ya no trabaja en el centro: la pantalla dibuja una grilla de fechas y un dia faltante la correria.

        Las franjas viajan en INSTANTES UTC y no en horas de pared: la hora local ya esta en la lectura de las REGLAS, y lo que consume un resultado de disponibilidad es una agenda, que compara instantes. timezone viaja aparte para poder rotular. Una franja que llega al fin del dia trae el INICIO DEL DIA SIGUIENTE, no las 23:59:59.999999999.

        La ventana es semiabierta: hasta es EXCLUSIVO. hasta == desde es 400, no "un dia". El maximo es de 366 dias —un ano completo, aunque sea bisiesto—: sin tope, una ventana enorme es un scan, porque la disponibilidad efectiva no esta materializada y se resuelve un dia por iteracion. El error de ventana demasiado amplia trae maximoDias en el cuerpo para que la pantalla recorte sola.

        Exige colaborador:read sobre esa sede.
      operationId: getDisponibilidadEfectiva
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Vinculo del profesional
        example: 1
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Primer dia de la ventana, fecha local ISO-8601"
        example: 2026-09-01
        in: query
        name: desde
        required: true
        schema:
          type: string
          format: date
      - description: "Fin de la ventana, EXCLUSIVO, fecha local ISO-8601"
        example: 2026-10-01
        in: query
        name: hasta
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisponibilidadEfectivaResponse"
          description: "Un dia por cada fecha de la ventana, en orden ascendente"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ventana ausente, invertida o vacia (validation-error), o de\
            \ mas de 366 dias (ventana-demasiado-amplia, con maximoDias)"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ colaborador:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede o el profesional no existen, o pertenecen a otro tenant"
      summary: "Disponibilidad efectiva del profesional, dia por dia"
      tags:
      - Disponibilidad profesional
  /api/v1/consultorios/{consultorioId}/profesionales/{membershipId}/disponibilidad/{bloqueId}:
    delete:
      description: |-
        Da de baja el bloque con MOTIVO OBLIGATORIO en el cuerpo. NO borra nada: la fila queda INACTIVA con su motivo, su autor y su instante (RN-M05-003). Una baja sin motivo no se puede revisar seis meses despues, que es exactamente cuando se la revisa.

        El motivo va en el CUERPO y no en la query string a proposito: un motivo en la URL queda en los logs de acceso de cualquier proxy intermedio.

        Devuelve el bloque dado de baja, no un 204 vacio, porque el cuerpo trae turnosAfectados: la baja QUITA disponibilidad y los turnos que caian ahi quedan en conflicto (RN-M05-004). El impacto se INFORMA, no bloquea —ADR-0011 prohibe decidir en cascada por el usuario—, y hoy vale siempre 0 porque el modulo de agenda no existe.

        Se permite aunque la sede este dada de baja y aunque el profesional ya se haya desvinculado: son las operaciones con las que se ordena el horario de un centro que se esta cerrando, y prohibirlas lo dejarian congelado.

        No hay reactivacion. Un bloque que vuelve es una regla nueva.

        Dar de baja dos veces es 409 bloque-already-inactive: "ya estaba dado de baja" es informacion distinta de "no existe", y es la unica que le sirve al administrador que apreto el boton dos veces.

        Exige consultorio:manage sobre esa sede.
      operationId: deactivateBloqueDisponibilidad
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Vinculo del profesional
        example: 1
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del bloque
        example: 1
        in: path
        name: bloqueId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateBloqueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueResponse"
          description: "Bloque dado de baja, con el impacto informado"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo de la baja, o el cuerpo esta vacio o mal formado"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El bloque no existe, es de otra sede, de otro profesional\
            \ o de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya estaba dado de baja (bloque-already-inactive)
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta la cabecera Content-Type: application/json en el cuerpo\
            \ del DELETE. Algunos clientes HTTP generados no la emiten por defecto\
            \ en un DELETE con cuerpo"
      summary: Baja logica de un bloque de disponibilidad
      tags:
      - Disponibilidad profesional
    put:
      description: |-
        Cambia dia, horas o ventana de vigencia de un bloque vigente (RF-M05-005). Los campos omitidos NO se tocan; para dejar el bloque sin fin de vigencia se manda limpiarVigenciaHasta=true, porque un null no puede expresar la diferencia entre "no toques el fin" y "saca el fin".

        El PROFESIONAL no se puede cambiar: reasignar un bloque a otra persona no es una edicion sino un bloque nuevo (RN-M05-001), y permitirlo dejaria la autoria historica apuntando a quien nunca atendio en esa franja.

        version es obligatoria y se compara ANTES de mutar: si quedo vieja, 409 con type conflict —el generico, NO concurrent-modification, que es el que emite organization para el mismo hecho— y el cliente recarga. Sin eso dos ediciones simultaneas se pisan y el segundo en guardar borra el cambio del primero sin que nadie se entere.

        AVISO AL CLIENTE: la respuesta trae turnosAfectados, y una edicion que QUITA disponibilidad deja en conflicto los turnos que caian ahi (RN-M05-004). El impacto se INFORMA, no bloquea: quien decide que hacer con esos turnos es la pantalla. Hoy ese numero es siempre 0 porque el modulo de agenda no existe; va a dejar de serlo sin cambiar este contrato.

        Un bloque dado de baja no se puede editar: 409 bloque-inactivo.
      operationId: updateBloqueDisponibilidad
      parameters:
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Vinculo del profesional
        example: 1
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del bloque
        example: 1
        in: path
        name: bloqueId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBloqueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueResponse"
          description: Bloque actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Dia fuera de 1..7, version ausente, u horario incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El bloque no existe, es de otra sede, de otro profesional\
            \ o de otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Bloque dado de baja (bloque-inactivo), solapamiento con otro\
            \ activo (bloque-solapado), version desactualizada (conflict), o profesional\
            \ sin vinculo vigente en esa sede (profesional-no-vinculado)"
      summary: Edicion de un bloque de disponibilidad
      tags:
      - Disponibilidad profesional
  /api/v1/consultorios/{consultorioId}/sesiones/turnos/{turnoId}:
    post:
      description: |-
        Abre la atencion, o **devuelve la que ya estaba abierta**.

        El doble inicio es idempotente a proposito: un profesional que aprieta dos veces o recarga la pantalla es el caso normal, y un 409 le exigiria a la pantalla distinguir dos situaciones que para el usuario son la misma (RN-M14-001, un turno produce como mucho una sesion).

        La Historia Clinica del paciente **se crea si no existia**. Exige perfil de paciente vigente: una atencion sobre alguien que solo es "persona" falla, y                no se crea historia clinica a nombre de quien no es paciente.

                       Quien atiende es el profesional del turno. Si el turno tiene uno asignado y no es quien inicia, es 409: dejar que otro abra la sesion de un turno ajeno rompe la propiedad antes de que la sesion exista.
      operationId: iniciar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: Atencion iniciada
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin `sesion:register` en esa sede, o sin contexto de trabajo\
            \ activo"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otro tenant
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno no habilita una atencion, o la persona no es paciente"
      summary: Iniciar la atencion de un turno
      tags:
      - Sesiones
  /api/v1/consultorios/{consultorioId}/sesiones/{sesionId}:
    get:
      description: "Devuelve la sesion con su borrador y su **version**, que es la\
        \ que hay que devolver al guardar."
      operationId: verSesion
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: sesionId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: Sesion
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion o la sede no existen, o son de otro tenant"
      summary: Ver una sesion
      tags:
      - Sesiones
  /api/v1/consultorios/{consultorioId}/sesiones/{sesionId}/borrador:
    put:
      description: |-
        Guarda el contenido parcial de la atencion. Pensado para llamarse seguido, desde el autosave de la pantalla.

        **Hay que mandar la `version` que se leyo.** Dos pestanas del mismo profesional sobre la misma sesion son el caso normal; sin la version la segunda pisa a la primera en silencio y el profesional pierde lo que escribio. Un 409 `concurrent-modification` significa recargar.

        **Solo el profesional de la sesion puede guardar.** No es cuestion de permiso —dos profesionales de la misma sede tienen el mismo `sesion:register`— sino de propiedad de esa atencion, y por eso el rechazo es 409 y no 403.

        El contenido es **opaco**: que campos tiene una evaluacion lo define AKINE-06.02. Esta etapa garantiza que se guarda, se versiona y no se pierde.
      operationId: guardarBorrador
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: sesionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardarBorrador"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: Borrador guardado
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion la atiende otro profesional, o la version quedo\
            \ vieja"
      summary: Guardar el borrador de la atencion
      tags:
      - Sesiones
  /api/v1/consultorios/{consultorioId}/sesiones/{sesionId}/cierre:
    post:
      description: |-
        Cierra la sesion y le asigna su **correlativo por historia clinica** — "la sesion numero 8 de este paciente".

        **Es idempotente.** Cerrar dos veces devuelve el mismo resultado con el mismo numero y no renumera: apretar dos veces "cerrar" es el caso normal, y renumerar una sesion cerrada seria reescribir historia clinica. La idempotencia se evalua ANTES de pedir un numero, para que un reintento no consuma un correlativo que despues nadie usa y deje huecos que parecen sesiones borradas.

        **Cerrar no cobra.** DP-06: el cierre clinico no depende del pago y no crea ninguna obligacion economica. La obligacion se deriva despues, en AKINE-07.01, leyendo las sesiones cerradas.

        **Una sesion cerrada no se edita.** Corregirla es una enmienda con su actor y su motivo, y eso es AKINE-06.06, fuera de alcance. Hasta entonces esto es fail-closed: es preferible no poder corregir a corregir sin dejar rastro.
      operationId: cerrar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: sesionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CerrarSesion"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: "Atencion cerrada, o ya lo estaba"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta la asistencia, o la nota de cierre con el paciente presente"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion la atiende otro profesional, o la version quedo\
            \ vieja"
      summary: Cerrar la atencion
      tags:
      - Sesiones
  /api/v1/consultorios/{consultorioId}/sesiones/{sesionId}/evaluacion:
    put:
      description: |-
        Guarda dolor, evolucion, objetivo y limitacion funcional como **datos tipados y consultables** (RF-M14-003). Es lo que distingue esta operacion del borrador de AKINE-06.01, que es JSON opaco: una evolucion clinica que no se puede comparar entre sesiones no sirve para nada.

        **Ningun campo clinico es obligatorio.** "Seguimiento no exige examen completo": una sesion de seguimiento carga dolor y evolucion y nada mas, y esa es la mayoria de las sesiones de un tratamiento. Exigirlos obligaria a inventar datos clinicos para poder guardar.

        Lo unico que se rechaza es lo que seria **falso**: un dolor fuera de la escala 0-10, y una lateralidad sin zona —"derecha" de que—. Los dos son 400: no dependen de nada que pueda cambiar entre dos peticiones, asi que reintentar no los arregla.

        La respuesta incluye `previa`, la evaluacion de la sesion anterior del mismo paciente, para poder mostrar el cambio.
      operationId: evaluar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: sesionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardarEvaluacion"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: Evaluacion guardada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Dolor fuera de la escala, o lateralidad sin zona"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sesion la atiende otro profesional, o la version quedo\
            \ vieja"
      summary: Guardar la evaluacion base
      tags:
      - Sesiones
  /api/v1/consultorios/{consultorioId}/turnos:
    get:
      description: |-
        Los turnos de la sede en un dia, del mas temprano al mas tarde. Es la pantalla de recepcion: quien viene hoy, quien ya llego y quien falta.

        **Incluye los cancelados, con su motivo.** No es un descuido: alguien puede presentarse al mostrador con un turno que se cancelo, y una lista que los esconda deja a la recepcionista sin nada que decirle.

        El dia se interpreta en la zona horaria de la sede. Exige `turno:read`.
      operationId: delDia
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Dia a listar, en la zona de la sede"
        example: 2026-09-15
        in: query
        name: fecha
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaDelDia"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AgendaDelDia"
          description: Turnos del dia
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: '`fecha` ausente o mal formada'
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:read` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o es de otro tenant
      summary: Agenda del dia de la sede
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/ofertas/{ofertaId}:
    post:
      description: |-
        Toma un slot de una oferta. **El servidor revalida todo**: que la oferta siga vigente ese dia, que el profesional siga habilitado y atendiendo en ese horario, que quede cupo y que ni el profesional ni el box tengan otro turno que se cruce.

        **Una sola reserva gana.** Dos peticiones concurrentes por el mismo hueco se serializan; la segunda recibe un 409 con el tipo que corresponde a su caso.

        Los cuatro conflictos son tipos distintos a proposito, porque llevan a la pantalla a acciones distintas: `slot-no-disponible` (recargar la agenda),                `slot-completo` (ofrecer el siguiente), `recurso-ocupado` (elegir otro horario o profesional) y `persona-sin-perfil-paciente` (activar el perfil).

        Deshacer la reserva es otra operacion: `POST /{turnoId}/cancelacion`.
      operationId: reservar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: ofertaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservarTurno"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: "Reintento con la misma clave de idempotencia y el mismo pedido:\
            \ se devuelve el turno ya creado, sin crear otro"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Turno reservado
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin `turno:manage` en esa sede, o sin contexto de trabajo\
            \ activo"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede, la oferta o la persona no existen, o son de otro\
            \ tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El hueco dejo de existir, no queda cupo, el recurso esta ocupado,\
            \ la persona no es paciente, o la clave de idempotencia se reuso con otro\
            \ pedido"
      summary: Reservar un turno
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}:
    get:
      description: |-
        El turno con el paciente y la oferta ya resueltos, que es lo que necesita cualquier pantalla que llegue por un enlace directo.

        Exige `turno:read`. **No lleva ningun dato clinico**: la atencion es otra cosa y otra pantalla (DP-05).
      operationId: verTurno
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnoDelDia"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TurnoDelDia"
          description: El turno
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:read` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
      summary: Ver un turno
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}/ausencia:
    post:
      description: |-
        **No libera el lugar**: la hora se consumio igual, el profesional estuvo ahi. Es la diferencia con cancelar.

        **Nunca elimina nada, ni este turno ni ningun otro** (DP-04). El documento historico de 2019 borraba la serie ante la primera ausencia y esa conducta esta explicitamente derogada.

        Solo se registra **despues** de la hora del turno: una ausencia anticipada no es una ausencia, es una cancelacion.

        No prueba nada clinico. Que el paciente haya sido atendido lo dice la Sesion (DP-05), y por eso un turno con atencion registrada no admite esta marca.
      operationId: registrarAusencia
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarAusencia"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Ausencia registrada
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:manage` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno todavia no empezo, ya cerro su ciclo, tiene una atencion\
            \ registrada, o la version quedo vieja"
      summary: Registrar que el paciente no vino
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}/cancelacion:
    post:
      description: |-
        **Cancelar no borra** (RN-M12-002): la fila queda con su motivo, su actor y su historial. Lo que si hace es **liberar el lugar**, que vuelve a estar disponible en la agenda.

        **El motivo es obligatorio** (DP-04), y la version tambien: si otro operador toco el turno entre medio, la cancelacion se rechaza en vez de pisarlo.

        **Solo turnos futuros.** Un turno que ya empezo es inalterable; lo que se registra sobre el es una ausencia.

        **No es idempotente**, a diferencia de confirmar: entre dos cancelaciones el lugar pudo haber sido tomado por otro paciente, y contestar 200 en silencio le haria creer al operador que su motivo quedo registrado.
      operationId: cancelar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelarTurno"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Turno cancelado
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:manage` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno ya cerro su ciclo, ya empezo, tiene una atencion\
            \ registrada, o la version quedo vieja"
      summary: Cancelar un turno futuro
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}/confirmacion:
    post:
      description: |-
        Marca la reserva como confirmada. **Es idempotente**: confirmar dos veces devuelve 200 sin cambiar nada.

        Confirmar es un estado de la RESERVA y no del cobro ni de la llegada del paciente: DP-06 deja el prepago como politica configurable y nunca como condicion del dominio clinico.
      operationId: confirmar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Turno confirmado
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:manage` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
      summary: Confirmar un turno reservado
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}/historial:
    get:
      description: |-
        Todas las transiciones del turno, de la mas vieja a la mas nueva, con actor, fecha, motivo y —cuando hubo reprogramacion— el horario del que vino (RF-M12-008).

        Exige `turno:read` y no `turno:manage`: leer quien cancelo y por que es parte de mirar la agenda, no de operarla.

        Los turnos anteriores a la migracion `V38` tienen su evento de reserva reconstruido desde la propia fila; en esos, el actor de la confirmacion viaja vacio porque nunca se habia guardado.
      operationId: historial
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoDeTurno"
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoDeTurno"
          description: Historial del turno
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:read` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
      summary: Historial de estados de un turno
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}/llegada:
    delete:
      description: |-
        Revierte una llegada marcada sobre el turno equivocado. El turno vuelve al estado del que vino —RESERVADO o CONFIRMADO— y **se limpia la hora de llegada**: un check-in deshecho no dejo una llegada, dejo un error corregido.

        El rastro de que ocurrio queda en el historial, que es append-only.

                       **No es idempotente**: deshacer lo ya deshecho responde 409. A diferencia del                check-in, aca el segundo click no es un doble click sino una operacion sobre                un turno que entre medio pudo haber cambiado de estado.
      operationId: deshacerLlegada
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Check-in revertido
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:manage` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno no esta en espera. `problemType`: `turno-transicion-no-permitida`"
      summary: Deshacer un check-in
      tags:
      - Turnos
    post:
      description: |-
        Marca que el paciente llego al centro y lo deja **en espera** (RF-M13-002). La hora la pone el servidor: no se envia ningun cuerpo.

        **Es idempotente**: marcar dos veces devuelve 200 sin mover la hora ni registrar un segundo evento. El doble click en el mostrador es el caso normal.

        La llegada es un estado de la RESERVA, no de la atencion (DP-05). Que un turno no pase por aca no impide atenderlo; impide saber a que hora llego el paciente.

        **No valida cobertura ni autorizaciones**: con cobertura PARTICULAR unica no hay condicion administrativa que validar (recableo DP-10).
      operationId: registrarLlegada
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Paciente en espera
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:manage` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno o la sede no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno esta cancelado o ya marcado ausente. `problemType`:\
            \ `turno-transicion-no-permitida`"
      summary: Registrar la llegada del paciente
      tags:
      - Turnos
  /api/v1/consultorios/{consultorioId}/turnos/{turnoId}/reprogramacion:
    post:
      description: |-
        **Es el mismo turno**: conserva id, paciente e historial (DP-04). No se cancela uno y se crea otro, entre otras cosas porque la Sesion de M14 cuelga del `turnoId` y ese vinculo se cortaria.

        El servidor **revalida el destino entero** —vigencia de la oferta, habilitacion y horario del profesional, cupo y solapamiento— bajo el mismo lock de sede que usa una reserva, asi que dos reprogramaciones al mismo hueco no pasan las dos.

        Un turno confirmado **vuelve a `RESERVADO`**: lo que el paciente confirmo era otro horario.
      operationId: reprogramar
      parameters:
      - in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: turnoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprogramarTurno"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Turno"
          description: Turno reprogramado
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin `turno:manage` en esa sede
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El turno, la sede o la oferta no existen, o son de otro tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El horario nuevo ya no existe o no tiene lugar, el turno ya\
            \ empezo o cerro su ciclo, tiene una atencion registrada, o la version\
            \ quedo vieja"
      summary: Mover un turno a otro horario
      tags:
      - Turnos
  /api/v1/financiadores:
    get:
      description: |-
        Devuelve los financiadores de la organizacion del contexto, ordenados por nombre.

        q busca por nombre, por codigo y por CUIT. Los comodines que el usuario escriba se escapan: un % tecleado busca un % literal y no todo el catalogo.

        estado filtra por ciclo de vida y por defecto trae solo los ACTIVOS. Con el default, un selector nunca ofrece un financiador dado de baja.

        tipo acota la clasificacion. Ausente trae todos.

        Exige contexto de organizacion activo: sin el, 403.
      operationId: listFinanciadores
      parameters:
      - description: "Texto a buscar en nombre, codigo y CUIT. Vacio trae todo"
        example: osde
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: "Filtro por ciclo de vida. Si se omite, ACTIVO"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Filtro por clasificacion. Si se omite, todos"
        in: query
        name: tipo
        required: false
        schema:
          type: string
          enum:
          - OBRA_SOCIAL
          - PREPAGA
          - ART
          - MUTUAL
          - ORGANISMO_PUBLICO
          - OTRO
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanciadorResponse"
          description: "Financiadores de la organizacion, ordenados por nombre"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin sesion o sin contexto de trabajo activo
      summary: Buscar financiadores de la organizacion
      tags:
      - Financiadores y planes
    post:
      description: |-
        Exige convenio:manage sobre la sede del contexto. El financiador queda en la organizacion, no en esa sede.

        El codigo es unico entre los financiadores VIGENTES de la organizacion y no se puede cambiar despues: es lo que las coberturas y los convenios guardan. El codigo de uno dado de baja SI se puede reusar. El nombre tambien es unico entre los vigentes.

        El CUIT se normaliza a 11 digitos: los guiones y los puntos se descartan antes de guardar y de comparar. Es unico entre los vigentes cuando esta presente, y varios financiadores SIN CUIT conviven sin chocar.

        No lleva Idempotency-Key y es deliberado: un financiador no consume cupo de ningun plan, asi que lo unico que un reintento podria producir es una fila duplicada, y contra eso el unique de codigo es una garantia mas fuerte que una clave que depende de que el cliente la mande bien.
      operationId: createFinanciador
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanciadorRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanciadorResponse"
          description: Financiador creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos o faltantes, o un CUIT que no queda en 11\
            \ digitos"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Codigo (financiador-codigo-taken), nombre (financiador-nombre-taken)\
            \ o CUIT (financiador-cuit-taken) repetido entre los financiadores vigentes\
            \ de la organizacion"
      summary: Dar de alta un financiador
      tags:
      - Financiadores y planes
  /api/v1/financiadores/{financiadorId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige convenio:manage sobre la sede del contexto.

        LA BAJA NO CASCADEA, y esto es lo mas importante de la operacion. Los planes del financiador conservan sus filas y las coberturas y convenios ya firmados SIGUEN RESOLVIENDO: RN-M15-003 prohibe eliminar historicos. Lo unico que la baja impide es CREAR planes nuevos bajo el —409 financiador-inactivo— y que sus planes se ofrezcan para selecciones nuevas.

        Tener planes activos NO bloquea la baja: obligar a darlos de baja uno por uno para poder dejar de trabajar con una obra social es trabajo burocratico sin ninguna garantia a cambio. Lo que si se hace es contarlos y dejar el numero en la auditoria.

        El motivo es obligatorio: sin el, la auditoria no responde por que seis meses despues.

        No hay reactivacion. Un financiador que vuelve es un alta nueva, no una baja deshecha.
      operationId: deactivateFinanciador
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateContractingRequest"
        required: true
      responses:
        "204":
          description: Financiador dado de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El financiador no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El financiador ya estaba dado de baja (financiador-already-inactive)
      summary: Dar de baja un financiador
      tags:
      - Financiadores y planes
    get:
      description: |-
        Devuelve el financiador con 200 aunque este dado de baja: RN-M15-003 exige que los historicos que lo referencian sigan resolviendo, y responder "no existe" seria borrar historia por la puerta de atras.

        Un id de otra organizacion responde 404 igual que uno inexistente. Los dos casos son indistinguibles a proposito.
      operationId: getFinanciador
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanciadorResponse"
          description: "El financiador, activo o dado de baja"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El financiador no existe o es de otra organizacion
      summary: Ver un financiador
      tags:
      - Financiadores y planes
    put:
      description: |-
        Exige convenio:manage sobre la sede del contexto.

        El codigo NO se puede cambiar y por eso no esta en el cuerpo: es la clave con la que las coberturas y los convenios ya firmados lo referencian, y cambiarlo reescribiria el significado de filas que no participan de esta llamada. Renombrar es cambiar nombre.

        Los campos que llegan en null NO se tocan. Es edicion parcial declarada: obligar a mandar el recurso entero forzaria a la pantalla a releerlo antes de cada guardado para no pisar lo que otro cambio en el medio, y expectedVersion ya resuelve ese problema mejor.

        Un financiador dado de baja no admite ediciones: 409 financiador-inactivo. Sus datos historicos siguen siendo consultables.
      operationId: updateFinanciador
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanciadorRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanciadorResponse"
          description: Financiador actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El financiador no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre o CUIT repetido, financiador dado de baja (financiador-inactivo),\
            \ o version desactualizada (conflict)"
      summary: Editar un financiador
      tags:
      - Financiadores y planes
  /api/v1/financiadores/{financiadorId}/planes:
    get:
      description: |-
        Devuelve los planes del financiador, ordenados por nombre.

        estado filtra el CICLO DE VIDA y por defecto trae solo los ACTIVOS. NO filtra por vigencia: un plan activo con la vigencia vencida sigue siendo ACTIVO y se devuelve, con vigente = false. Son dos cosas distintas y la pantalla necesita las dos para explicar por que un plan no se ofrece.

        fecha es el dia contra el que se calcula vigente. Si se omite, hoy.
      operationId: listPlanesDeCobertura
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por ciclo de vida. Si se omite, ACTIVO"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Dia contra el que se calcula vigente. Si se omite, hoy"
        example: 2026-09-02
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanCoberturaResponse"
          description: "Planes del financiador, ordenados por nombre"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El financiador no existe o es de otra organizacion
      summary: Listar los planes de un financiador
      tags:
      - Financiadores y planes
    post:
      description: |-
        Exige convenio:manage sobre la sede del contexto.

        UN FINANCIADOR DADO DE BAJA NO ADMITE PLANES NUEVOS: 409 financiador-inactivo. Es la contracara de que la baja no cascadee — lo que se impide es lo nuevo, no lo que ya existe.

        El codigo es unico entre los planes VIGENTES de ESE financiador y no se puede cambiar despues. El alcance es el financiador y no la organizacion: dos financiadores distintos pueden tener los dos un plan 210, y obligar a que no se repita entre ellos forzaria a inventar codigos que el financiador real no usa.

        vigenciaHasta es el ULTIMO dia INCLUSIVE y puede coincidir con vigenciaDesde: un plan que vale un solo dia es un estado real. Null significa sin fin previsto.

        copago y moneda viajan juntos o no viajan: un importe sin moneda no es un importe. Copago null significa "sin copago declarado", que NO es lo mismo que cero.

        No lleva Idempotency-Key, con el mismo criterio que el alta de financiador.
      operationId: createPlanDeCobertura
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanCoberturaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCoberturaResponse"
          description: Plan creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, vigencia invertida, o copago sin moneda"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El financiador no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Codigo (plan-cobertura-codigo-taken) o nombre (plan-cobertura-nombre-taken)\
            \ repetido entre los planes vigentes de ese financiador, o financiador\
            \ dado de baja (financiador-inactivo)"
      summary: Dar de alta un plan bajo un financiador
      tags:
      - Financiadores y planes
  /api/v1/financiadores/{financiadorId}/planes/{planId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige convenio:manage sobre la sede del contexto.

        LAS COBERTURAS YA FIRMADAS BAJO ESTE PLAN NO SE TOCAN. Siguen resolviendo con la copia congelada que guardaron al firmarse: RN-M15-003 prohibe eliminar historicos. Lo unico que la baja impide es que el plan se ofrezca para selecciones nuevas (RN-M15-002).

        Libera el codigo y el nombre para un plan nuevo del mismo financiador.

        Si lo que se quiere es que el plan deje de ofrecerse a partir de una fecha pero siga siendo un plan vigente hasta entonces, la operacion NO es esta: es cerrar la vigencia con el PUT.

        No hay reactivacion.
      operationId: deactivatePlanDeCobertura
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del plan
        example: 88
        in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateContractingRequest"
        required: true
      responses:
        "204":
          description: Plan dado de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El plan no existe, es de otra organizacion, o es de otro financiador\
            \ que el de la ruta"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El plan ya estaba dado de baja (plan-cobertura-already-inactive)
      summary: Dar de baja un plan de cobertura
      tags:
      - Financiadores y planes
    put:
      description: |-
        Exige convenio:manage sobre la sede del contexto.

        CERRAR LA VIGENCIA ES ESTA OPERACION, mandando vigenciaHasta. RF-M15-005 dice "actualizar o cerrar vigencia" y son la misma escritura. Cerrar la vigencia NO es dar de baja: el plan queda ACTIVO y consultable, y lo unico que cambia es que deja de ofrecerse para selecciones posteriores a esa fecha.

        Ni el codigo ni el financiador se pueden cambiar y por eso no estan en el cuerpo: son la identidad del plan, y las coberturas ya firmadas la referencian.

        Los campos que llegan en null NO se tocan. La vigencia se valida como par aunque llegue de a una: mandar solo vigenciaHasta se compara contra el vigenciaDesde guardado.

        Un plan dado de baja no admite ediciones: 409 plan-cobertura-inactivo. Un plan de un financiador dado de baja SI se puede editar: dejar de trabajar con una obra social no puede tener como efecto que sus planes queden congelados con un error de tipeo.
      operationId: updatePlanDeCobertura
      parameters:
      - description: Identificador del financiador
        example: 31
        in: path
        name: financiadorId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del plan
        example: 88
        in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanCoberturaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCoberturaResponse"
          description: Plan actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, vigencia invertida, o copago sin moneda"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin convenio:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El plan no existe, es de otra organizacion, o es de otro financiador\
            \ que el de la ruta"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre repetido (plan-cobertura-nombre-taken), plan dado de\
            \ baja (plan-cobertura-inactivo), o version desactualizada (conflict)"
      summary: "Editar un plan, o cerrar su vigencia"
      tags:
      - Financiadores y planes
  /api/v1/me/contexts:
    get:
      description: |-
        Devuelve los pares Organizacion + Consultorio en los que la cuenta tiene una membership vigente y cuya organizacion admite operar. Es lo que alimenta la pantalla de seleccion de contexto.

        Cada elemento trae los nombres junto a los ids porque este listado es exactamente lo que el usuario ve para elegir: resolverlos con llamadas adicionales exigiria pedir datos de organizaciones antes de tener contexto en ninguna.

        No requiere contexto de tenant: es el endpoint con el que se averigua que contextos hay. Devuelve una lista vacia —no un error— cuando la cuenta todavia no tiene ninguno; el frontend distingue 'no elegiste' de 'no tenes donde'.

        Este endpoint no cambia el contexto activo. Seleccionarlo renueva el token, y eso lo publica el modulo de identidad en 01.02 como POST /api/v1/auth/context.
      operationId: listMyContexts
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizedContextResponse"
          description: Contextos habilitados. Lista vacia si la cuenta no tiene ninguno
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada. Nunca 401: un 401 haria que el\
            \ cliente descarte el token y entre en un bucle de login"
      summary: Contextos de trabajo habilitados
      tags:
      - Mi cuenta
  /api/v1/me/permissions:
    get:
      description: |-
        Devuelve los codigos del catalogo que la cuenta tiene vigentes en la organizacion y la sede de su contexto activo, ya resueltos: rol base, permisos adicionales vigentes y acceso de soporte, todo aplanado en un array. El cliente no compone nada.

        Se resuelve CONTRA LA BASE en cada llamada, no contra lo que porta el token. Un permiso revocado hace un minuto ya no aparece aca, aunque el access token siga siendo valido: leer del token daria una respuesta correcta al momento del login y falsa despues.

        Es insumo de UX, no un mecanismo de seguridad. Cada pantalla que el frontend oculte con esto esta igualmente protegida en el backend; si esta lista mintiera, lo unico que pasaria es que se veria un boton que despues responde 403.

        Exige contexto de trabajo. Sin el la respuesta es 403 missing-tenant-context, NUNCA 401: el interceptor del frontend borra el token ante cualquier 401 y arranca un bucle de login.
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectivePermissionsResponse"
          description: Permisos efectivos. Array vacio si la cuenta no tiene ninguno
            en este contexto
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o no hay contexto de trabajo seleccionado\
            \ (missing-tenant-context). Nunca 401"
      summary: Permisos efectivos en el contexto activo
      tags:
      - Mi cuenta
  /api/v1/memberships:
    post:
      description: |-
        Requiere colaborador:manage sobre el alcance pedido. La organizacion sale del contexto de trabajo activo y NO se manda en el cuerpo.

        No crea cuentas y no manda correos: vincula a alguien que ya se registro. Es una desviacion declarada de RF-M05-001/002 —el flujo de invitacion con aceptacion queda para una etapa posterior—, no el flujo definitivo.

        Si el email no tiene cuenta la respuesta es 404. Esa respuesta distingue emails registrados de los que no, asi que la ruta tiene rate limit propio —10 por minuto y por IP— y CADA intento fallido queda auditado en el tenant como MEMBERSHIP_ALTA_RECHAZADA, con el actor y la direccion. Un barrido de la base no pasa desapercibido.

        El motivo es obligatorio: es lo que responde, seis meses despues, por que esa persona tiene acceso a los datos del centro.
      operationId: createDirectMembership
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMembershipResponse"
          description: Vinculo creado. Location apunta al recurso en el modulo de
            organizacion
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el email, el rol o el motivo, o el rol no es un valor\
            \ legal"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo activo\
            \ (missing-tenant-context), o falta colaborador:manage sobre el alcance\
            \ pedido. Nunca 401"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ninguna cuenta tiene ese email, o la sede pedida no es de\
            \ la organizacion del contexto. Los dos casos responden igual"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Esa cuenta ya tiene un vinculo con ese alcance, vigente o\
            \ historico"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Se alcanzo el limite de intentos de la ruta. Retry-After dice
            en cuantos segundos reintentar
      summary: Vincular una cuenta existente con la organizacion
      tags:
      - Colaboradores
  /api/v1/organizations:
    post:
      description: |-
        Crea la organizacion, su primer consultorio y su suscripcion en una sola transaccion. Reservado a la administracion de plataforma.

        El primer consultorio se crea SIEMPRE, incluso por este camino: el contexto de trabajo es Organizacion + Consultorio, asi que un tenant sin ninguna sede no ofreceria ningun contexto seleccionable y quien entrara despues no tendria donde trabajar.

        Este NO es el camino del alta self-service. Esa crea ademas la cuenta y la membership del fundador en la misma transaccion, y la resuelve el modulo de identidad en 01.02.

        El header Idempotency-Key es obligatorio: identifica el intento, de modo que un reintento por timeout de red quede correlacionado en el log y en la auditoria en vez de parecer un alta distinta. En 01.01 el alta duplicada la cierra la unicidad del slug con 409 conflict, no un replay con 200: este camino administrativo no registra idempotencia porque no tiene propietario que registrar, y el registro de onboarding exige uno.
      operationId: createOrganization
      parameters:
      - description: "Identificador unico del intento, generado por el cliente. Reintentar\
          \ la misma alta debe reusar el mismo valor."
        example: 0f9d5f6e-1c2b-4a3d-9e8f-7a6b5c4d3e2f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: Organizacion creada. La cabecera Location apunta al recurso
            nuevo
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, o falta el header Idempotency-Key"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La operacion esta reservada a la administracion de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El plan indicado no existe o ya no es contratable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El slug ya pertenece a otra organizacion, o la clave de idempotencia\
            \ se reuso con otro contenido"
      summary: Alta administrativa de una organizacion
      tags:
      - Organizaciones
  /api/v1/organizations/{orgId}:
    get:
      description: "Devuelve el tenant con su estado operativo efectivo y la version\
        \ que hay que reenviar para editarlo. Requiere ser miembro vigente de esa\
        \ organizacion y que sea la del contexto activo. Una organizacion inexistente,\
        \ dada de baja o de otro tenant se responden las tres igual con 404: distinguirlas\
        \ permitiria enumerar los clientes del SaaS probando ids."
      operationId: getOrganization
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: Organizacion encontrada
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, esta dada de baja, o pertenece a otro tenant. Los\
            \ tres casos se responden igual"
      summary: Datos de una organizacion
      tags:
      - Organizaciones
    patch:
      description: |-
        Actualiza nombre y zona horaria. Requiere administrar esa organizacion.

        El slug no se puede cambiar: se usa en URLs y en soporte, y renombrarlo rompe enlaces. Cambiar de identificador es crear otro tenant, no editar este.

        La version enviada se compara antes de mutar. Si quedo vieja porque alguien mas edito mientras tanto, la respuesta es 409 conflict y hay que releer y reintentar: es preferible a pisar en silencio el cambio de otro.

        Los campos omitidos o vacios se dejan como estan; no los borra.
      operationId: updateOrganization
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: "Organizacion actualizada, con la version nueva"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, o falta la version"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El actor esta en el tenant correcto pero no lo administra
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, esta dada de baja, o pertenece a otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La version enviada quedo vieja: releer y reintentar"
      summary: Editar los datos mutables de la organizacion
      tags:
      - Organizaciones
  /api/v1/organizations/{orgId}/audit-events:
    get:
      description: |-
        Requiere auditoria:read. Hay que elegir EXACTAMENTE UNO de los tres filtros; combinarlos o no mandar ninguno responde 400.

        1. entityType + entityId: historial de una entidad (RF-M24-002).
        2. actorAccountId: actividad de una persona dentro del tenant (RF-M24-003).
        3. from + to: ventana temporal (RF-M24-004). El rango no puede exceder los 90 dias, y to tiene que ser posterior a from.

        size se recorta a 100 por request: un cliente que pide diez mil filas esta mal configurado, no atacando, y devolverle cien le sirve mas que un error.

        Quien tiene el permiso con alcance de sede ve solo su sede. Ese recorte lo decide el evaluador de permisos, no un parametro.
      operationId: listAuditEvents
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Tipo de entidad. Va junto con entityId
        example: MEMBERSHIP
        in: query
        name: entityType
        required: false
        schema:
          type: string
      - description: Identificador de la entidad. Va junto con entityType
        example: 42
        in: query
        name: entityId
        required: false
        schema:
          type: integer
          format: int64
      - description: Cuenta cuya actividad se consulta
        example: 18
        in: query
        name: actorAccountId
        required: false
        schema:
          type: integer
          format: int64
      - description: Inicio de la ventana. Va junto con to
        example: 2026-08-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: Fin de la ventana. Va junto con from. Como maximo 90 dias despues
          de from
        example: 2026-08-23T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Elementos por pagina. Se recorta a 100
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPageResponse"
          description: Pagina de hechos que cumplen el filtro
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No se eligio exactamente un filtro, el rango esta invertido,\
            \ o excede los 90 dias"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto de trabajo activo, o sin auditoria:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La organizacion no existe o no es la del contexto del actor
      summary: Hechos registrados en la auditoria de la organizacion
      tags:
      - Auditoria
  /api/v1/organizations/{orgId}/colaborador-invitaciones:
    get:
      description: |-
        Requiere colaborador:manage, y no colaborador:read: lo que se ve aca son direcciones de correo de personas que todavia no aceptaron nada. No es la lista de colaboradores, es la lista de a quien se le escribio.

        Sin paginar a proposito: una organizacion tiene decenas de invitaciones en toda su vida, no miles, y el filtro por estado es lo que hace util al listado.

        Una invitacion vencida figura PENDIENTE con vencida=true. Expirar no es una decision de nadie y por eso no se materializa como estado: se deriva del reloj en cada lectura.
      operationId: listColaboradorInvitaciones
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Filtra por estado. Ausente devuelve todas
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - PENDIENTE
          - ACEPTADA
          - RECHAZADA
          - CANCELADA
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitacionResponse"
          description: "Invitaciones de la organizacion, de la mas nueva a la mas\
            \ vieja"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo o sin colaborador:manage"
      summary: Listar las invitaciones de la organizacion
      tags:
      - Invitaciones
    post:
      description: |-
        Requiere colaborador:manage sobre el alcance pedido. La organizacion sale del contexto de trabajo activo.

        A diferencia del alta directa, la persona invitada PUEDE NO TENER CUENTA: la crea al aceptar, en el mismo acto, sin un segundo correo de activacion. El vinculo nace cuando acepta, no ahora.

        Emitir no consume cupo del plan; aceptar si. La contracara declarada es que cinco invitaciones pendientes con un solo lugar libre significan que cuatro reciben 409 al aceptar: entra el que llega primero.

        Solo puede haber UNA invitacion pendiente por persona y alcance. Si el enlace vencio o no llego, el camino es reenviar, no emitir otra.
      operationId: createColaboradorInvitacion
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitacionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitacionResponse"
          description: Invitacion emitida y correo encolado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el email o el rol, o el rol no es un valor legal"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto de trabajo activo (missing-tenant-context),\
            \ o sin colaborador:manage sobre el alcance pedido. Nunca 401"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede pedida no es de la organizacion del contexto
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ya hay una invitacion pendiente igual (invitacion-pendiente-duplicada),\
            \ o la persona ya trabaja en la organizacion (colaborador-ya-vinculado)"
      summary: Invitar a alguien a colaborar
      tags:
      - Invitaciones
  /api/v1/organizations/{orgId}/colaborador-invitaciones/{invitacionId}/cancel:
    post:
      description: |-
        El motivo es obligatorio: cancelar es una decision del administrador sobre alguien a quien ya le escribio, y tiene que responder por que seis meses despues. El rechazo del invitado, en cambio, no exige motivo.

        La cancelacion es terminal y libera el email: se puede volver a invitar a esa persona mas adelante.
      operationId: cancelColaboradorInvitacion
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: invitacionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInvitacionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitacionResponse"
          description: Invitacion cancelada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La invitacion no existe o es de otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La invitacion ya fue resuelta (invitacion-ya-resuelta)
      summary: Retirar una invitacion pendiente
      tags:
      - Invitaciones
  /api/v1/organizations/{orgId}/colaborador-invitaciones/{invitacionId}/resend:
    post:
      description: |-
        Emite un token nuevo y vuelve a mandar el correo. EL TOKEN ANTERIOR DEJA DE SERVIR en el mismo acto: dos enlaces validos para la misma invitacion dejan al invitado eligiendo cual usar.

        No crea una invitacion nueva. Conserva el id, la autoria y la fecha original, que es lo que hace que el listado siga diciendo desde cuando se espera respuesta.

        La respuesta NO trae el token: va al correo y a ningun lado mas.
      operationId: resendColaboradorInvitacion
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: invitacionId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitacionResponse"
          description: Token rotado y correo encolado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La invitacion no existe o es de otro tenant. Los dos responden
            igual
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La invitacion ya fue aceptada, rechazada o cancelada (invitacion-ya-resuelta)"
      summary: Reenviar una invitacion pendiente
      tags:
      - Invitaciones
  /api/v1/organizations/{orgId}/consultorios:
    get:
      description: "Listado paginado de las sedes del tenant. Requiere ser miembro\
        \ vigente de esa organizacion, y NO consultorio:manage: es la lectura que\
        \ necesita el selector de contexto de trabajo, asi que restringirla dejaria\
        \ a un profesional sin poder elegir sede. El parametro estado es opcional\
        \ y su valor por defecto, ACTIVO, conserva el comportamiento historico del\
        \ endpoint: un cliente que no lo manda ve exactamente lo mismo que antes.\
        \ El tamano de pagina se acota a 100: pedir mas devuelve ese maximo, no un\
        \ error."
      operationId: listOrganizationConsultorios
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Que sedes devolver. ACTIVO son las vigentes, INACTIVO las dadas\
          \ de baja, TODOS ambas. Una sede dada de baja conserva su historia y sigue\
          \ siendo consultable, pero hay que pedirla explicitamente para que no aparezca\
          \ por descuido en el selector de contexto."
        example: ACTIVO
        in: query
        name: estado
        required: false
        schema:
          type: string
          default: ACTIVO
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Elementos por pagina, acotado a 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioPageResponse"
          description: Pagina de sedes. Contenido vacio si la pagina quedo fuera de
            rango
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El valor de estado no pertenece al catalogo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, esta dada de baja, o pertenece a otro tenant"
      summary: Sedes de la organizacion
      tags:
      - Organizaciones
    post:
      description: |-
        Crea una sede nueva en la organizacion. La PRIMERA sede no se crea por aca: la crea el alta de la organizacion en la misma transaccion, porque el contexto de trabajo es Organizacion + Consultorio y un tenant sin sede no ofreceria ningun contexto seleccionable.

        Exige consultorio:manage con alcance ORGANIZACION. Un CONSULTORIO_ADMIN no puede crear sedes, y no hace falta ninguna regla especial para impedirlo: un alta no tiene sede objetivo —todavia no existe— asi que la interseccion con un alcance de una sola sede es vacia.

        Pasa por el limite MAX_CONSULTORIOS del plan contratado. El header Idempotency-Key es obligatorio: reintentar con la misma clave y el mismo cuerpo devuelve la misma sede en vez de crear una segunda, que es lo que cubre el reintento despues de un timeout de red.

        El primer box y el horario general de la sede NO se crean aca. Box es del modulo de espacios (AKINE-02.02) y el horario general depende de la disponibilidad profesional, que llega despues.
      operationId: createConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Identificador unico del intento, generado por el cliente. Reintentar\
          \ la misma alta debe reusar el mismo valor."
        example: 0f9d5f6e-1c2b-4a3d-9e8f-7a6b5c4d3e2f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultorioRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: "Sede creada, o la misma sede si es un reintento con la misma\
            \ clave de idempotencia. La cabecera Location apunta al recurso"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, zona horaria que no es un identificador\
            \ IANA, o falta el header Idempotency-Key"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage con alcance organizacion, o no hay\
            \ contexto de trabajo seleccionado"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre repetido entre las sedes vigentes (consultorio-name-taken),\
            \ limite del plan alcanzado (plan-limit-exceeded), suscripcion suspendida\
            \ (subscription-suspended), o clave de idempotencia reusada con otro contenido\
            \ (idempotency-key-conflict)"
      summary: Alta de una sede adicional
      tags:
      - Consultorios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}:
    get:
      description: |-
        Devuelve la sede con su configuracion y la version que hay que reenviar para editarla.

        Devuelve tambien las sedes INACTIVAS, con 200 y no con 404: RF-M03-004 exige que los historicos previos permanezcan disponibles. Lo que una sede inactiva rechaza son las operaciones nuevas, y eso se responde con 409.

        Exige consultorio:manage sobre ESA sede, asi que un CONSULTORIO_ADMIN puede leer la suya y no las demas. Una sede de otro tenant responde 404, igual que una inexistente.
      operationId: getConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: "La sede, activa o dada de baja"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No existe o pertenece a otro tenant
      summary: Datos de una sede
      tags:
      - Consultorios
    patch:
      description: |-
        Cambia nombre, zona horaria, intervalo de agenda y datos institucionales (RF-M03-003). Los campos omitidos no se tocan; para borrar un dato institucional se manda cadena vacia.

        version es obligatoria y se compara antes de mutar: si quedo vieja, la respuesta es 409 concurrent-modification y el cliente recarga. Sin eso, dos ediciones simultaneas se pisan y el segundo en guardar borra el cambio del primero sin que nadie se entere.

        Una sede INACTIVA no se puede editar: 409 consultorio-inactive.

        Cambiar la zona horaria NO reinterpreta el pasado. Los instantes ya registrados son UTC y no se mueven; cambia como se proyectan de aca en adelante, y la pantalla tiene que decirlo con esas palabras.
      operationId: updateConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsultorioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: Sede actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos o zona horaria que no es un identificador
            IANA
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No existe o pertenece a otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sede dada de baja (consultorio-inactive), nombre repetido\
            \ (consultorio-name-taken) o version desactualizada (concurrent-modification)"
      summary: Edicion de una sede
      tags:
      - Consultorios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}/deactivate:
    post:
      description: |-
        Da de baja la sede con motivo obligatorio (RF-M03-004). NO borra nada: la sede queda INACTIVA, sigue siendo legible por id y conserva intacta toda su historia. No hay reactivacion: ningun RF de M03 la pide.

        Dos rechazos que hay que mostrar con su mensaje real y no con un generico:

        - last-consultorio-required: es la ultima sede activa del tenant. Sin ninguna sede activa nadie podria canjear contexto y la organizacion quedaria operativamente muerta, recuperable solo con intervencion manual. Es una restriccion agregada al comportamiento del requerimiento, decidida explicitamente.
        - consultorio-has-active-references: reservado. Hoy no lo emite nadie; lo emitira el modulo de agenda cuando existan turnos futuros sobre la sede.

        Exige consultorio:manage con alcance ORGANIZACION, o sea que hoy solo un ORG_ADMIN puede dar de baja una sede. Es mas estricto que la lectura literal de la matriz de permisos, por el mismo criterio que impide que alguien se quite a si mismo su ultimo rol administrativo: nadie destruye el alcance desde el que opera. Queda como enmienda pendiente de confirmacion.
      operationId: deactivateConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateConsultorioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: Sede dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage con alcance organizacion, o no hay\
            \ contexto de trabajo seleccionado"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No existe o pertenece a otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Es la ultima sede activa (last-consultorio-required), ya estaba\
            \ dada de baja (consultorio-already-inactive), o tiene referencias vigentes\
            \ (consultorio-has-active-references)"
      summary: Baja logica de una sede
      tags:
      - Consultorios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}/espacios:
    get:
      description: |-
        Listado paginado de los espacios de la sede. Exige espacio:read sobre esa sede, y NO consultorio:manage: es la lectura que necesita un profesional para saber en que box atiende, asi que restringirla al administrador dejaria a la mitad del equipo sin poder consultarla. Lo tienen todos los roles de la sede salvo PACIENTE, que recibe 403.

        El parametro estado por defecto vale ACTIVO, y eso es lo que hace que un selector de reserva NUNCA ofrezca un espacio dado de baja (RN-M04-002). Los inactivos hay que pedirlos explicitamente, y la pantalla de administracion los necesita para explicar por que un nombre esta tomado o libre.

        El tamano de pagina se acota a 100: pedir mas devuelve ese maximo, no un error.
      operationId: listEspacios
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Que espacios devolver. ACTIVO son los vigentes, INACTIVO los\
          \ dados de baja, TODOS ambos."
        example: ACTIVO
        in: query
        name: estado
        required: false
        schema:
          type: string
          default: ACTIVO
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Elementos por pagina, acotado a 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspacioPageResponse"
          description: Pagina de espacios. Contenido vacio si la pagina quedo fuera
            de rango
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El valor de estado no pertenece al catalogo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ espacio:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede no existe, o no se es miembro de esa organizacion"
      summary: Espacios de la sede
      tags:
      - Espacios
    post:
      description: |-
        Crea un box, gimnasio, gabinete, sala grupal u otro recurso fisico en la sede (RF-M04-001, RF-M04-007).

        Exige consultorio:manage sobre ESA sede, asi que pasan un ORG_ADMIN de la organizacion y el CONSULTORIO_ADMIN de esa sede, y no un PROFESIONAL ni un ADMINISTRATIVO.

        Solo name es obligatorio. Los defaults son tipo=BOX, capacidad=1, validFrom=ahora y sin fin de vigencia, que es el caso mas frecuente.

        No lleva Idempotency-Key, a diferencia del alta de una sede, y es deliberado: un espacio no consume cupo de ningun plan, asi que lo unico que un reintento podria producir es una fila duplicada, y contra eso el unique de nombre entre los espacios vigentes es una garantia mas fuerte que una clave —no depende de que el cliente la mande ni de que la reuse bien—. El reintento responde 409 espacio-name-taken y no crea nada. La contrapartida: despues de un timeout de red hay que releer el listado para saber si el alta original entro.

        La sede tiene que estar ACTIVA: una sede dada de baja no origina hechos nuevos y responde 409 consultorio-inactive.
      operationId: createEspacio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEspacioRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspacioResponse"
          description: Espacio creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, capacidad fuera de rango, tipo que no pertenece\
            \ al catalogo, o ventana de vigencia incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto\
            \ de trabajo seleccionado"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede no existe o pertenece a otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre repetido entre los espacios vigentes de la sede (espacio-name-taken),\
            \ sede dada de baja (consultorio-inactive), o suscripcion suspendida (subscription-suspended)"
      summary: Alta de un espacio
      tags:
      - Espacios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}/espacios/availability:
    get:
      description: |-
        Devuelve los espacios de la sede que estan EN SERVICIO durante toda la ventana pedida (RF-M04-003): activos y con su vigencia cubriendo el intervalo completo. Los dados de baja y los que estan fuera de su ventana operativa NO aparecen, que es el criterio de aceptacion de la etapa. Exige espacio:read sobre esa sede, no consultorio:manage: lo tienen todos los roles de la sede salvo PACIENTE, que recibe 403.

        LEER ESTO ANTES DE ESCRIBIR LA PANTALLA. Esta consulta responde si el recurso esta en servicio, NO si esta libre de reservas. Los turnos y las inscripciones son de modulos que todavia no existen, asi que lugaresComprometidos es SIEMPRE 0 en esta version del contrato y lugaresDisponibles siempre igual a capacidad. Cuando la agenda exista, esos dos numeros van a cambiar solos y este contrato no cambia. Rotular disponible=true como "el box esta libre" va a ser mentira en cuanto exista la agenda.

        La ventana es semiabierta: hasta es exclusivo. Se exige hasta posterior a desde y un maximo de 31 dias, que es la unidad natural de una agenda; sin tope, una ventana de diez años sobre un centro grande es un scan.
      operationId: checkEspaciosAvailability
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Inicio de la ventana, instante UTC en formato ISO-8601"
        example: 2026-09-01T13:00:00Z
        in: query
        name: desde
        required: true
        schema:
          type: string
          format: date-time
      - description: "Fin de la ventana, EXCLUSIVO, instante UTC en formato ISO-8601"
        example: 2026-09-01T14:00:00Z
        in: query
        name: hasta
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EspacioAvailabilityResponse"
          description: "Espacios en servicio para la ventana, ordenados por nombre.\
            \ Lista vacia si ninguno lo esta"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ventana ausente, invertida, o de mas de 31 dias"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ espacio:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La sede no existe, o no se es miembro de esa organizacion"
      summary: Disponibilidad base de los espacios de la sede
      tags:
      - Espacios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}/espacios/{espacioId}:
    get:
      description: |-
        Devuelve el espacio con su configuracion y la version que hay que reenviar para editarlo. Exige espacio:read sobre esa sede, no consultorio:manage: lo tienen todos los roles de la sede salvo PACIENTE, que recibe 403.

        Devuelve tambien los espacios INACTIVOS, con 200 y no con 404: RN-M04-003 exige que los historicos conserven su nombre y su estado. Lo que un espacio inactivo rechaza son las operaciones nuevas, y eso se responde con 409.

        estado y enServicio son dos cosas distintas: el primero es el ciclo de vida administrativo y el segundo dice si el recurso se ofrece AHORA, lo que ademas exige estar dentro de la ventana de vigencia. Un box ACTIVO que entra en servicio el mes que viene tiene estado=ACTIVO y enServicio=false.
      operationId: getEspacio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del espacio
        example: 1
        in: path
        name: espacioId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspacioResponse"
          description: "El espacio, activo o dado de baja"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo, o falta\
            \ espacio:read sobre esa sede"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, es de otra sede, o pertenece a otro tenant"
      summary: Datos de un espacio
      tags:
      - Espacios
    patch:
      description: |-
        Cambia nombre, tipo, capacidad, observacion y ventana de vigencia (RF-M04-002, RF-M04-007). Los campos omitidos no se tocan; para borrar la observacion se manda cadena vacia, y para dejar el espacio sin fin de vigencia se manda clearValidUntil=true.

        version es obligatoria y se compara antes de mutar: si quedo vieja, la respuesta es 409 concurrent-modification y el cliente recarga. Sin eso, dos ediciones simultaneas se pisan y el segundo en guardar borra el cambio del primero sin que nadie se entere.

        REDUCIR la capacidad pasa por una comprobacion adicional contra la ocupacion ya comprometida, dentro de una transaccion que bloquea la fila del espacio. Si no alcanza, 409 espacio-capacity-below-occupancy, con los dos numeros en el cuerpo para que la pantalla pueda decir a cuanto SI se puede bajar. AVISO AL CLIENTE: mientras no exista el modulo de agenda esa ocupacion es siempre cero y toda reduccion procede; el codigo esta publicado desde ya para que su aparicion no sea un cambio de comportamiento sorpresivo.

        La sede del espacio NO se puede cambiar: mover un box de sede cambiaria el significado de todos los hechos historicos que lo referencian. Un espacio que se muda es uno que se da de baja y otro que se crea.

        Un espacio INACTIVO no se puede editar: 409 espacio-inactive.
      operationId: updateEspacio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del espacio
        example: 1
        in: path
        name: espacioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEspacioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspacioResponse"
          description: Espacio actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, capacidad fuera de rango o ventana de vigencia\
            \ incoherente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, es de otra sede, o pertenece a otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Espacio dado de baja (espacio-inactive), nombre repetido (espacio-name-taken),\
            \ version desactualizada (concurrent-modification), o capacidad por debajo\
            \ de la ocupacion comprometida (espacio-capacity-below-occupancy)"
      summary: Edicion de un espacio
      tags:
      - Espacios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}/espacios/{espacioId}/deactivate:
    post:
      description: |-
        Da de baja el espacio con motivo obligatorio (RF-M04-006). NO borra nada: el espacio queda INACTIVO, sigue siendo legible por id y conserva su nombre y su estado (RN-M04-003). Deja de ofrecerse para reservas nuevas (RN-M04-002) y libera su nombre para un espacio nuevo de la misma sede.

        No hay reactivacion: ningun RF de M04 la pide, y un recurso que vuelve de una refaccion es una ventana de vigencia nueva, no una baja deshecha. Si lo que se quiere es sacarlo de servicio temporalmente, el camino es editar validUntil, no dar de baja.

        El codigo espacio-has-active-references esta RESERVADO: hoy no lo emite nadie; lo emitira el modulo de agenda cuando existan turnos futuros sobre el espacio. La pantalla de confirmacion de baja deberia estar preparada para mostrarlo.

        Exige consultorio:manage sobre esa sede.
      operationId: deactivateEspacio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del espacio
        example: 1
        in: path
        name: espacioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateEspacioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspacioResponse"
          description: Espacio dado de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, es de otra sede, o pertenece a otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ya estaba dado de baja (espacio-already-inactive), o tiene\
            \ referencias vigentes (espacio-has-active-references)"
      summary: Baja logica de un espacio
      tags:
      - Espacios
  /api/v1/organizations/{orgId}/memberships:
    get:
      description: |-
        Requiere colaborador:read. Devuelve TAMBIEN los vinculos suspendidos y revocados: quien administra tiene que poder ver quien estuvo, quien lo desvinculo y por que. Para eso existe la baja logica. El cliente distingue por el campo estado, no por ausencia.

        size se acota a 100 por request. Pedir 500 devuelve 100, no un error.
      operationId: listMemberships
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Elementos por pagina. Se acota a 100
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPageResponse"
          description: Pagina de colaboradores
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo activo,\
            \ o falta colaborador:read. Nunca 401"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La organizacion no existe o no es la del contexto del actor
      summary: Colaboradores de la organizacion
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}:
    get:
      description: "Requiere colaborador:read. El vinculo se busca por (id, organizacion)\
        \ y nunca por id pelado: uno de otro tenant responde 404 igual que uno inexistente."
      operationId: getMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: El vinculo pedido
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Un colaborador de la organizacion
      tags:
      - Colaboradores
    patch:
      description: |-
        Requiere colaborador:manage y motivo obligatorio. Los dos cambios se auditan por separado: mover a alguien de sede y cambiar lo que puede hacer son dos decisiones distintas.

        changeScope existe porque null es un valor legitimo de consultorioId (significa alcance de toda la organizacion): sin la bandera, 'no tocar la sede' y 'ampliarla a la organizacion' serian el mismo request.

        Solo opera sobre vinculos ACTIVA. Sobre uno suspendido o revocado responde 409 membership-not-active, no 404: el administrador ve esa fila en su propio listado y decirle 'no existe' no le explicaria nada.

        Bajar de rol al ultimo administrador se rechaza con 409 igual que revocarlo: el tenant quedaria sin nadie que pueda repararlo.
      operationId: changeMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMembershipRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo, o el rol no existe en el catalogo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, sin colaborador:manage, o\
            \ el vinculo es el del fundador y el actor no es el fundador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo o la sede destino no existen, o son de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo no esta ACTIVA (membership-not-active), dejaria\
            \ al tenant sin administradores (last-admin-required), el actor se quitaria\
            \ su ultimo rol administrativo (self-revoke-not-allowed), o otro usuario\
            \ modifico la fila (concurrent-modification)"
      summary: Cambiar el rol y/o el alcance de un colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/desvinculacion-impacto:
    get:
      description: |-
        Requiere colaborador:read, y no colaborador:manage: sirve para DECIDIR, y quien decide suele mirar antes de tener el permiso de ejecutar.

        ESTO NO BLOQUEA NADA. RN-M05-004 pide que los turnos futuros queden visibles para resolucion, no que impidan la desvinculacion: cuando alguien renuncia, renuncio. Es la diferencia con la baja de una sede, donde las operaciones vigentes si la impiden.

        Hoy responde siempre count=0: M12 (agenda) no existe todavia y no hay ninguna sonda enchufada. La operacion se publica igual para que la pantalla de desvinculacion se escriba una sola vez y el numero aparezca el dia que la agenda exista, sin cambiar el contrato.
      operationId: getDesvinculacionImpacto
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesvinculacionImpactoResponse"
          description: Trabajo pendiente. count=0 mientras no exista la agenda
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Que quedaria pendiente si se desvincula a este colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/grants:
    get:
      description: |-
        Requiere colaborador:read. Devuelve solo los vigentes: los dados de baja quedan en la fila para la auditoria, no para esta pantalla.

        Es lo que alimenta la lista desde la que se revoca un permiso adicional. Sin este endpoint el cliente no tendria de donde sacar los codigos a dar de baja.
      operationId: listMembershipGrants
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipGrantResponse"
          description: Permisos adicionales vigentes. Lista vacia si no tiene ninguno
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Permisos adicionales vigentes de un colaborador
      tags:
      - Colaboradores
    post:
      description: |-
        Requiere colaborador:manage y motivo obligatorio. El catalogo de codigos otorgables es cerrado: un permiso que existe pero no es otorgable en esta fase se rechaza con 400, no se escribe.

        Otorgar dos veces el mismo permiso responde 409 grant-already-active, y esa decision la toma la clave unica de la base y no un chequeo previo: dos administradores otorgando a la vez leerian los dos que no existe.
      operationId: assignMembershipGrant
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignGrantRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipGrantResponse"
          description: Permiso adicional otorgado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo, o el codigo no existe o no es otorgable"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ese permiso adicional ya esta vigente sobre el vinculo, o\
            \ el vinculo no esta ACTIVA"
      summary: Otorgar un permiso adicional a un colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/grants/{permissionCode}:
    delete:
      description: |-
        Requiere colaborador:manage. Baja LOGICA: la fila queda con su autor y su motivo.

        Es idempotente hacia el mismo resultado: si el permiso ya no esta vigente responde 204 igual. Un 409 obligaria al cliente a distinguir dos situaciones que para el usuario son la misma: no lo tenia, y se lo acaban de quitar.

        El motivo va como parametro y no en el cuerpo porque un DELETE con cuerpo no esta garantizado de punta a punta por proxies y clientes HTTP.
      operationId: revokeMembershipGrant
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      - description: Codigo del permiso a dar de baja
        example: auditoria:read-clinica
        in: path
        name: permissionCode
        required: true
        schema:
          type: string
      - description: Motivo declarado de la baja. Queda en la auditoria
        in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "204":
          description: "Permiso adicional dado de baja, o ya no estaba vigente"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El codigo de permiso no existe en el catalogo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Dar de baja un permiso adicional
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/reactivate:
    post:
      description: "Requiere colaborador:manage. Solo aplica sobre vinculos SUSPENDIDA:\
        \ uno revocado es terminal y responde 409. Devolverle el acceso a alguien\
        \ es tan auditable como quitarselo, asi que el motivo se exige igual."
      operationId: reactivateMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo reactivado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no estaba SUSPENDIDA
      summary: Devolver a ACTIVA un vinculo suspendido
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/revoke:
    post:
      description: |-
        Requiere colaborador:manage y motivo obligatorio. Estado TERMINAL y sin borrado (RN-M05-003): la fila queda con quien revoco y por que, porque los historicos que la referencian tienen que seguir siendo legibles.

        Es la operacion con los tres invariantes a la vez: ultimo administrador, self-revoke y proteccion del fundador. Los dos primeros responden 409; el tercero 403, porque es una restriccion sobre QUIEN puede hacerlo y no sobre el estado en que quedaria el tenant.

        No es un DELETE porque no borra nada, y exige cuerpo porque el motivo es obligatorio.
      operationId: revokeMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo revocado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, sin colaborador:manage, o\
            \ es el vinculo del fundador y el actor no es el fundador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo ya estaba revocado, dejaria al tenant sin administradores,\
            \ o el actor se quitaria su ultimo rol administrativo"
      summary: Revocar el vinculo de un colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/suspend:
    post:
      description: "Requiere colaborador:manage y motivo obligatorio. Suspender saca\
        \ a la persona igual que revocar mientras dura, asi que pasa por los mismos\
        \ invariantes: no puede dejar al tenant sin administradores ni ser el ultimo\
        \ rol administrativo del propio actor. Tratarlo como mas suave seria dejar\
        \ la misma puerta abierta con otro nombre."
      operationId: suspendMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo suspendido
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, sin colaborador:manage, o\
            \ es el vinculo del fundador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo no esta ACTIVA, o la suspension dejaria al tenant\
            \ sin administradores"
      summary: Suspender temporalmente un vinculo
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/subscription:
    get:
      description: |-
        Devuelve el plan contratado, el estado de la suscripcion, el consumo actual de cada limite y los estados a los que se puede transicionar desde el actual.

        Los allowedTargets existen para que el frontend no replique la maquina de estados: pinta las acciones que el backend dice que existen. Una copia de las reglas en el cliente obligaria a desplegar los dos lados a la vez para no ofrecer botones que fallan.

        Requiere administrar esa organizacion. Una organizacion inexistente o de otro tenant se responden igual con 404.
      operationId: getSubscription
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
          description: Suscripcion vigente con su consumo de limites
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El actor esta en el tenant correcto pero no lo administra
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
      summary: Suscripcion vigente del tenant
      tags:
      - Suscripciones
  /api/v1/organizations/{orgId}/subscription/plan-changes:
    post:
      description: |-
        Contrata otro plan y lo registra en el historico. Reservado a la administracion de plataforma.

        Un downgrade se acepta aunque el uso actual ya supere los limites del plan nuevo, y no toca un solo dato: no borra, no desactiva y no marca nada como invalido. Lo que existe sigue operativo y consultable. Lo unico que cambia es el futuro: la proxima alta que exceda el limite nuevo se rechaza. Los limites ya excedidos vuelven en warnings para que el cliente pueda ordenarse antes de chocarse, no como un rechazo.

        Reintentar un cambio ya aplicado responde applied=false y no genera una segunda fila de historico ni un segundo evento: un reintento no puede producir un segundo efecto.

        Requiere la suscripcion ACTIVA (409 subscription-suspended si no lo esta) y la version vigente (409 conflict si quedo vieja).
      operationId: changeSubscriptionPlan
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeResponse"
          description: "Plan cambiado, o ya vigente (applied=false). warnings trae\
            \ los limites que el uso actual ya excede: son avisos, no rechazos"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el codigo de plan o la version esperada
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La operacion esta reservada a la administracion de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no es accesible, o el plan no es contratable"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: subscription-suspended si la suscripcion no esta ACTIVA; conflict
            si la version enviada quedo vieja
      summary: Cambiar el plan contratado
      tags:
      - Suscripciones
  /api/v1/organizations/{orgId}/subscription/transitions:
    get:
      description: "Listado paginado de los cambios de estado y de plan, del hecho\
        \ mas reciente al mas viejo. Es append-only: responde 'que le paso a este\
        \ centro y cuando' meses despues, y por eso ninguna fila se edita ni se borra.\
        \ La primera fila de toda suscripcion tiene fromStatus ausente y significa\
        \ el alta. Requiere administrar esa organizacion. El tamano de pagina se acota\
        \ a 100: pedir mas devuelve ese maximo, no un error."
      operationId: listSubscriptionTransitions
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Elementos por pagina, acotado a 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionTransitionPageResponse"
          description: "Pagina del historico, del hecho mas reciente al mas viejo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El actor esta en el tenant correcto pero no lo administra
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
      summary: Historico de la suscripcion
      tags:
      - Suscripciones
    post:
      description: |-
        Registra el cambio de estado y lo agrega al historico. Reservado a la administracion de plataforma: suspender o cancelar un centro es una decision comercial, no una operacion que el propio centro se autoaplique.

        Se valida todo antes de escribir nada. Una transicion rechazada no deja la suscripcion movida, ni una fila de historico, ni un evento de auditoria que sugiera que algo paso.

        Enviar expectedStatus hace que la operacion se rechace con 409 si el estado real ya no es el que el actor creia, en vez de aplicarse sobre una premisa falsa. El motivo es obligatorio al suspender y al cancelar; omitirlo ahi es 400.

        Un salto que la maquina de estados no admite —incluido repetir el estado actual— es 409 invalid-subscription-transition.
      operationId: createSubscriptionTransition
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionTransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
          description: Transicion aplicada y registrada en el historico
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el estado destino, o falta el motivo donde es obligatorio"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La operacion esta reservada a la administracion de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: invalid-subscription-transition si la maquina de estados no
            admite el salto; conflict si expectedStatus no coincide con el real
      summary: Aplicar una transicion de estado a la suscripcion
      tags:
      - Suscripciones
  /api/v1/personas:
    get:
      description: |-
        Busca por documento, apellido, nombre o telefono, todo con el mismo parametro q. La comparacion ignora mayusculas y acentos, y los separadores del documento y del telefono: buscar 12345678, 12.345.678 o Perez encuentra a la misma persona.

        Sin q devuelve el padron completo, paginado y ordenado por apellido.

        estado filtra por ciclo de vida y por defecto trae solo las ACTIVAS. perfil filtra por perfil clinico y por defecto no filtra: la busqueda del mostrador no sabe de antemano si quien busca es paciente.

        OJO: esPaciente es DERIVADO y de solo lectura. Una persona sin perfil clinico es una persona valida y completa —RN-M07-006—, no una ficha a medio cargar.
      operationId: buscarPersonas
      parameters:
      - description: "Texto libre: documento, apellido, nombre o telefono"
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Filtro por ciclo de vida. Por defecto solo las ACTIVAS
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: Filtro por perfil clinico. Por defecto indistinto
        in: query
        name: perfil
        required: false
        schema:
          type: string
          enum:
          - CON_PERFIL
          - SIN_PERFIL
          - TODOS
      - description: "Pagina, base cero"
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Tamano de pagina, acotado a 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaPageResponse"
          description: Pagina de personas del padron
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
      summary: Buscar personas en el padron
      tags:
      - Personas
    post:
      description: |-
        Registra una PERSONA. NO crea perfil de paciente, ni historia clinica, ni caso, ni sesion: eso es RF-M07-010 y no hay ningun parametro que lo cambie. Convertirla en paciente es POST /personas/{personaId}/perfil-paciente.

        Solo el apellido y el nombre son obligatorios. El documento es opcional porque una persona sin DNI es un caso real, y exigirlo obligaria al mostrador a inventar uno.

        DOS RECHAZOS DISTINTOS Y NO SE CONFUNDEN:
                       - persona-documento-taken es DURO. Ya hay alguien vigente con ese documento en la organizacion. No se puede confirmar ni saltear.
                       - persona-posible-duplicado es una ADVERTENCIA. Coincide el nombre completo o el telefono con alguien ya registrado. Viene con la lista de candidatos; si el operador confirma que es otra persona, se reenvia con confirmaPosibleDuplicado en true. Es RN-M07-001 —busqueda previa a la creacion— hecho cumplir por el backend y no solo por la pantalla.
      operationId: crearPersona
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaResponse"
          description: Persona creada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Datos invalidos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Documento repetido, o posibles duplicados sin confirmar"
      summary: Dar de alta una persona
      tags:
      - Personas
  /api/v1/personas/{personaId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio (RF-M07-005). NO BORRA NADA: la ficha se sigue leyendo con 200, sus turnos siguen existiendo, sus obligaciones siguen debiendose y sus adjuntos se siguen descargando. Lo que deja de admitir son operaciones nuevas: editarla, activarle un perfil, adjuntarle documentos.

        DA DE BAJA TAMBIEN EL PERFIL DE PACIENTE vigente, en la misma transaccion. Dejarlo vivo produciria una ficha que los modulos clinicos siguen viendo como paciente vigente mientras el padron la considera cerrada.

        LIBERA EL DOCUMENTO: el mismo documento se puede volver a usar en un alta nueva. Es intencional y es lo que permite corregir una ficha creada mal sin borrarla.

        Devuelve la ficha como quedo, con su version nueva, en vez de un 204: la pantalla la necesita para refrescar sin pedir otro GET.

        No valida si la persona tiene turnos futuros o deuda: dar de baja a alguien que se fue debiendo es un caso legitimo, y bloquearlo obligaria a condonar para poder cerrar la ficha.
      operationId: darDeBajaPersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BajaDePersonaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaResponse"
          description: Persona dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ya estaba dada de baja, o la version esta desactualizada"
      summary: Dar de baja logica a una persona del padron
      tags:
      - Personas
    get:
      description: |-
        Devuelve la ficha administrativa. Una persona INACTIVA responde 200: sus historicos tienen que seguir resolviendo (RN-M07-004).

        Una persona de otra organizacion responde 404 y no 403: distinguirlas confirmaria que ese id existe.
      operationId: verPersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaResponse"
          description: La persona
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es de otra organizacion"
      summary: Ver una persona del padron
      tags:
      - Personas
    patch:
      description: |-
        Edicion parcial: lo que no viene, no se toca. Un campo en null NO vacia el valor guardado.

        Una persona INACTIVA responde 409: reabrir una ficha dada de baja para cambiarle el nombre reescribiria el historico que RN-M07-004 protege.

        La deteccion de posibles duplicados NO corre en la edicion —pediria confirmacion cada vez que se corrige un telefono—, pero el documento repetido se sigue rechazando: eso lo verifica el unique, no una rama de codigo.
      operationId: editarPersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaResponse"
          description: Persona actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Datos invalidos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Persona inactiva, documento repetido o version desactualizada"
      summary: Editar los datos administrativos de una persona
      tags:
      - Personas
  /api/v1/personas/{personaId}/adjuntos:
    get:
      description: |-
        RF-M25-005. Devuelve la METADATA, nunca el contenido: para descargar hay un endpoint propio que autoriza cada llamada.

        Por defecto trae solo los VIGENTES. Los dados de baja se piden con incluirDadosDeBaja y siguen resolviendo, que es RN-M07-004 aplicada al documento en vez de a la persona.

        Una persona INACTIVA lista igual: sus documentos siguen siendo consultables.
      operationId: listarAdjuntosDePersona
      parameters:
      - description: Persona duenia de los adjuntos
        example: 42
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por clasificacion. Sin el, todas las categorias"
        in: query
        name: categoria
        required: false
        schema:
          type: string
          enum:
          - DOCUMENTO_IDENTIDAD
          - CREDENCIAL_COBERTURA
          - CONSENTIMIENTO
          - AUTORIZACION
          - COMPROBANTE
          - OTRO
      - description: Incluir tambien los dados de baja
        in: query
        name: incluirDadosDeBaja
        required: false
        schema:
          type: boolean
          default: false
      - description: "Pagina, base cero"
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Tamano de pagina, acotado a 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjuntoPageResponse"
          description: Pagina de adjuntos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona no existe, o es de otra organizacion"
      summary: Listar los adjuntos de una persona
      tags:
      - Adjuntos
    post:
      description: |-
        RF-M25-001. El tipo se decide POR LOS BYTES y el Content-Type declarado se descarta: lo elige quien sube, asi que no valida nada. Se aceptan PDF, PNG y JPEG; todo lo demas es 400 archivo-no-aceptado con motivo TIPO_NO_PERMITIDO. El tope de tamano da el mismo type con motivo DEMASIADO_GRANDE.

        ES IDEMPOTENTE. Subir dos veces el mismo archivo a la misma persona devuelve 200 con el adjunto que ya existe, no 201 y no 409. Una subida es la operacion mas expuesta a reintentos del producto —mostrador, varios MB, timeouts— y un reintento no deberia dejar dos filas que despues alguien desempata a ojo.

        UN ADJUNTO NO REEMPLAZA UN DATO ESTRUCTURADO (RN-M25-004): cargar la foto de una credencial no carga la cobertura, y cargar el DNI escaneado no completa el documento de la ficha.

        NO ES UN CONTENEDOR CLINICO (RN-M25-005). Las categorias son todas administrativas y no hay ninguna clinica, a proposito: un estudio o un informe vive en M09 con sus propios controles.

        Una persona dada de baja no admite documentos nuevos: 409 persona-inactiva. Los que ya tiene se siguen descargando.
      operationId: subirAdjuntoDePersona
      parameters:
      - description: Persona a la que se vincula el documento
        example: 42
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Clasificacion administrativa del documento
        in: query
        name: categoria
        required: true
        schema:
          type: string
          enum:
          - DOCUMENTO_IDENTIDAD
          - CREDENCIAL_COBERTURA
          - CONSENTIMIENTO
          - AUTORIZACION
          - COMPROBANTE
          - OTRO
      - description: Titulo con el que describirlo. Opcional
        in: query
        name: titulo
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
                  description: "El archivo. PDF, PNG o JPEG"
              required:
              - archivo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjuntoResponse"
          description: "El mismo archivo ya estaba cargado: se devuelve el existente"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjuntoResponse"
          description: Adjunto creado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Tipo no permitido o archivo demasiado grande
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona no existe, o es de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La persona esta dada de baja
      summary: Subir un documento administrativo
      tags:
      - Adjuntos
  /api/v1/personas/{personaId}/adjuntos/{adjuntoId}:
    delete:
      description: |-
        RF-M25-004. Baja LOGICA con motivo obligatorio.

        EL BINARIO NO SE BORRA. Es lo que hace que la baja sea reversible en los hechos y lo que permite que el historico siga resolviendo: el contenido se sigue pudiendo descargar. Un job de limpieza sobre contenidos realmente huerfanos es otra cosa y otra etapa.

        Un adjunto ya dado de baja responde 409.
      operationId: darDeBajaAdjuntoDePersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: adjuntoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BajaDeAdjuntoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjuntoResponse"
          description: Adjunto dado de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona o el adjunto no existen, o son de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El adjunto ya estaba dado de baja
      summary: Dar de baja un adjunto
      tags:
      - Adjuntos
    patch:
      description: |-
        RF-M25-003. Edicion parcial: lo que no viene, no se toca.

        LO UNICO EDITABLE ES COMO ESTA DESCRIPTO. El contenido, su nombre y su tipo son inmutables: reemplazar el archivo de una fila reescribiria un hecho. Para reemplazar un documento se da de baja el viejo y se sube el nuevo, que deja las dos versiones consultables.

        Un adjunto dado de baja responde 409: se sigue descargando, no se reclasifica.
      operationId: clasificarAdjuntoDePersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: adjuntoId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClasificarAdjuntoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjuntoResponse"
          description: Adjunto reclasificado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Datos invalidos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona o el adjunto no existen, o son de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El adjunto esta dado de baja
      summary: Reclasificar un adjunto
      tags:
      - Adjuntos
  /api/v1/personas/{personaId}/adjuntos/{adjuntoId}/contenido:
    get:
      description: |-
        RF-M25-002. Entrega los bytes con el tipo DETECTADO al subir y el nombre original en Content-Disposition.

        NO DEVUELVE NINGUNA RUTA INTERNA ni redirige a una URL firmada (RN-M25-002): la autorizacion se evalua en cada llamada. El por que no hay URLs temporales                esta en el javadoc de esta clase.

        SE DESCARGA AUNQUE EL ADJUNTO O LA PERSONA ESTEN DADOS DE BAJA. Es el caso borde "descarga tras baja" y la respuesta correcta es permitirla: una baja logica dice "esto ya no corresponde para operar", no "esto nunca existio".

        Si el almacenamiento perdio el binario, es 409 adjunto-no-disponible y no 404: la metadata existe y quien pregunta la esta viendo en la lista.

        Cada descarga se AUDITA. Es el unico evento de lectura que este modulo registra: un listado no entrega contenido, una descarga si.
      operationId: descargarAdjuntoDePersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: adjuntoId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/octet-stream: {}
          description: El contenido del archivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona o el adjunto no existen, o son de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El almacenamiento no tiene el contenido
      summary: Descargar el contenido de un adjunto
      tags:
      - Adjuntos
  /api/v1/personas/{personaId}/autorizaciones:
    get:
      description: |-
        RF-M17-003 y RF-M17-006. Devuelve TODAS, mas nuevas primero, incluidas las vencidas, las agotadas, las rechazadas y las dadas de baja.

        Cada fila trae saldo, vencida, agotada, habilita y diasParaVencer CALCULADOS contra la fecha que se pregunta. Es lo que le permite al panel administrativo mostrar los vencimientos sin que exista ningun job que mueva estados: materializarlos dejaria autorizaciones vencidas que el sistema cree vigentes el dia que el job no corra.

        estado filtra el CICLO DE VIDA (ACTIVA/INACTIVA), no el estado de la autorizacion ni su vigencia. Por defecto trae todas.

        cantidadConsumida vale SIEMPRE 0 en esta version: el consumo clinico es una integracion posterior (RF-M17-004).
      operationId: listAutorizacionesDePaciente
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por ciclo de vida. Si se omite, TODAS"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
          - TODAS
      - description: "Dia contra el que se calcula todo. Si se omite, hoy"
        example: 2026-09-03
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutorizacionResponse"
          description: "Historial de autorizaciones, mas nuevas primero"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La persona no existe o es de otra organizacion
      summary: Historial de autorizaciones de un paciente
      tags:
      - Autorizaciones
    post:
      description: |-
        RF-M17-001. Exige paciente:manage sobre la sede del contexto.

        EL CONVENIO SE CONGELA, no se referencia. El backend copia a la autorizacion el codigo, el nombre y las TRES exigencias que el convenio tenia el dia vigenciaDesde, y no las vuelve a leer nunca: cambiar el convenio manana no reescribe con que reglas se autorizo al paciente el mes pasado.

        LA COPIA ES OPCIONAL, y esa es la diferencia con la cobertura. Si no hay convenio vigente de esta sede con ese plan, o lo hay pero la practica no tiene arancel cargado, el alta ENTRA IGUAL sin snapshot. El mostrador no se puede quedar sin cargar un numero de autorizacion real porque la grilla de aranceles este incompleta.

        estadoInicial admite PENDIENTE (default) o APROBADA. OBSERVADA y RECHAZADA no: son la respuesta a un pedido y se aplican con POST /{id}/estado.

        SOLO SI NACE APROBADA se valida el solapamiento: dos autorizaciones aprobadas de la misma cobertura y practica con vigencias que se pisan contarian el saldo dos veces (409 autorizacion-superpuesta). Dos CONSECUTIVAS —renovar— si conviven, y dos de practicas distintas tambien.

        cantidadConsumida nace en 0 y esta version no la mueve.
