        revokedReason:
          type: string
          description: "Motivo declarado de la revocacion, si fue revocado"
        roleCode:
          type: string
          description: Rol asignado en la matriz de permisos
          enum:
          - ORG_ADMIN
          - CONSULTORIO_ADMIN
          - PROFESIONAL
