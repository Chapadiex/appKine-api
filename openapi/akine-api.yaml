          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La persona no existe o es de otra organizacion
      summary: Historial de coberturas de un paciente
      tags:
      - Coberturas del paciente
    post:
      description: |-
        Exige paciente:manage sobre la sede del contexto.

        LA PERSONA TIENE QUE SER PACIENTE. Una Persona no es un Paciente (RF-M07-010): si no tiene perfil de paciente vigente responde 409 persona-sin-perfil-paciente. Cargarle la obra social a un contacto administrativo no significa nada.

        EL PLAN SE CONGELA, no se referencia. El backend copia a la cobertura el codigo, el nombre, el copago y las exigencias que el plan tenia el dia vigenciaDesde, y no los vuelve a leer nunca. Renombrar el plan manana no cambia esta cobertura.

        Se congela contra vigenciaDesde y no contra hoy: la pregunta es si ese plan se podia elegir el dia en que la cobertura empieza a valer.

        Un plan que no se puede elegir responde 409 plan-no-seleccionable, y las cinco causas —no existe, es ajeno, esta dado de baja, su financiador esta dado de baja, o la fecha cae fuera de su vigencia— responden IGUAL, para no convertir el endpoint en un oraculo del catalogo de otro centro.

        PARTICULAR no lleva plan ni credencial: es la ausencia de plan financiado y siempre esta disponible (RN-M08-001).

        Dos coberturas activas del MISMO plan con vigencias solapadas son un duplicado: 409 cobertura-superpuesta. Dos de financiadores DISTINTOS solapadas son legitimas y no se rechazan.
      operationId: createCoberturaDePaciente
