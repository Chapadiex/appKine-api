          type: string
          format: date
          description: "Primer dia en que el bloque rige. Omitirlo significa HOY en\
            \ la zona de la sede, que es lo que quiere decir quien carga el horario\
            \ de un profesional que ya esta atendiendo"
          example: 2026-09-01
        vigenciaHasta:
          type: string
          format: date
          description: "Primer dia en que el bloque ya NO rige, EXCLUSIVO. Omitirlo\
            \ significa sin fin previsto, que es el caso normal"
          example: 2027-01-01
      required:
      - diaSemana
      - horaDesde
      - horaHasta
    CreateCatalogoConceptoRequest:
      type: object
      description: Datos para dar de alta un concepto del catalogo clinico
      properties:
        alcance:
          type: string
          description: "Duenio del concepto. GLOBAL lo publica en el catalogo de plataforma\
            \ y exige rol de plataforma; ORGANIZACION lo crea para el tenant del contexto.\
            \ Si se omite, ORGANIZACION"
          enum:
          - GLOBAL
          - ORGANIZACION
          example: ORGANIZACION
        codigo:
          type: string
          description: "Clave estable. Es lo que los convenios y las sesiones guardan,\
            \ y por eso NO se puede cambiar despues. Unico entre los conceptos VIGENTES\
            \ del mismo duenio: el codigo de uno dado de baja se puede reusar"
          example: KIN
          maxLength: 48
          minLength: 0
        descripcion:
          type: string
          description: Descripcion libre. Nunca contenido clinico
          maxLength: 280
          minLength: 0
        especialidadId:
          type: integer
          format: int64
          description: "Especialidad a la que pertenece. OBLIGATORIO al crear una\
            \ practica, ignorado en los otros tipos. Una practica GLOBAL solo puede\
            \ colgar de una especialidad GLOBAL: si no, 409 catalogo-scope-mismatch"
          example: 1
        name:
          type: string
          description: "Nombre visible. Unico entre los conceptos vigentes del mismo\
            \ duenio, comparado sin distinguir mayusculas ni acentos"
          example: Kinesiologia
          maxLength: 160
          minLength: 0
        validFrom:
          type: string
          format: date-time
          description: "Instante UTC desde el que el concepto se puede elegir. Si\
            \ se omite, el momento del alta. Es la VIGENCIA, distinta de la baja logica"
          example: 2026-09-01T00:00:00Z
        validUntil:
          type: string
          format: date-time
          description: "Instante UTC hasta el que se puede elegir, EXCLUSIVO. Omitirlo\
            \ significa sin fin previsto, que es lo normal"
      required:
      - codigo
      - name
    CreateCatalogoSolicitudRequest:
      type: object
      description: Datos del pedido de alta de un concepto global
      properties:
        codigoPropuesto:
          type: string
          description: "Codigo sugerido. Opcional: el centro propone, la plataforma\
            \ dispone"
          maxLength: 48
          minLength: 0
        justificacion:
          type: string
          description: "Por que hace falta. Obligatoria: sin ella la plataforma no\
            \ puede decidir y la solicitud es ruido"
          example: Tres profesionales del centro la ejercen y hoy no hay forma de
            registrarla
          maxLength: 500
          minLength: 0
        nombrePropuesto:
          type: string
          description: Nombre propuesto
          example: Terapia ocupacional
          maxLength: 160
          minLength: 0
        tipo:
          type: string
          description: Que concepto global se pide
          enum:
          - ESPECIALIDAD
          - PRACTICA
          - NOMENCLADOR
