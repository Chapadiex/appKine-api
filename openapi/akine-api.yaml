          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La persona no existe o es de otra organizacion
      summary: Que coberturas se pueden elegir para atender ese dia
      tags:
      - Coberturas del paciente
  /api/v1/personas/{personaId}/coberturas/{coberturaId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige paciente:manage sobre la sede del contexto.

        NO ES LO MISMO QUE FINALIZAR LA VIGENCIA. Finalizar es "el paciente cambio de obra social" y se hace con el PUT: la cobertura queda ACTIVA y sigue explicando el pasado. Dar de baja es "esta cobertura nunca debio cargarse".

        No borra nada y no toca ningun hecho ya registrado: RN-M08-003 y regla maestra 10. La cobertura sigue siendo legible con estado INACTIVA.

        La baja tambien desmarca la principal: dejar como preferida una cobertura dada de baja haria que la seleccion del dia siguiente apunte a algo que ya no existe operativamente.

        No hay reactivacion. Una cobertura que vuelve es un alta nueva.
      operationId: deactivateCoberturaDePaciente
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la cobertura
        example: 412
        in: path
        name: coberturaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateCoberturaRequest"
        required: true
      responses:
        "204":
          description: Cobertura dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La cobertura no existe, es de otra organizacion o de otro\
            \ paciente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cobertura ya estaba dada de baja (cobertura-already-inactive)
      summary: Dar de baja una cobertura
      tags:
      - Coberturas del paciente
    put:
      description: |-
        Exige paciente:manage sobre la sede del contexto. Edicion parcial: lo que no viaja no se toca.

        EL PLAN NO SE PUEDE CAMBIAR, y por eso no esta en el cuerpo. Cambiar de plan es OTRA cobertura: se finaliza la vigente y se agrega la nueva. Editarla en el lugar reescribiria con que cobertura se atendio al paciente el mes pasado (RN-M08-003).

        MANDAR vigenciaHasta ES FINALIZAR LA VIGENCIA (RF-M08-003). La cobertura queda ACTIVA y consultable, y deja de aplicar despues de esa fecha. NO es dar de baja, que es el DELETE y significa otra cosa.

        Una cobertura dada de baja no se edita: 409 cobertura-inactiva. Reabrir la ficha de algo dado de baja reescribiria el historico.

        expectedVersion es obligatorio: una version vieja responde 409 en vez de pisar el cambio ajeno en silencio.
      operationId: updateCoberturaDePaciente
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la cobertura
        example: 412
        in: path
        name: coberturaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoberturaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoberturaResponse"
          description: Cobertura actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos o vigencia invertida
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La cobertura no existe, es de otra organizacion o de otro\
            \ paciente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cobertura dada de baja (cobertura-inactiva), version desactualizada\
            \ (conflict) o la edicion crea un solapamiento (cobertura-superpuesta)"
      summary: "Editar una cobertura, o finalizar su vigencia"
      tags:
      - Coberturas del paciente
  /api/v1/personas/{personaId}/coberturas/{coberturaId}/principal:
    post:
      description: |-
        RF-M08-004. Exige paciente:manage sobre la sede del contexto.

        Operacion propia y no un campo del PUT porque es un invariante ENTRE filas y no un dato de esta. Meterlo en la edicion obligaria a que el cliente mande la version de una fila para modificar el estado de otra.

        NO DESMARCA A LA ANTERIOR EN SILENCIO. Si ya hay una principal activa con la vigencia solapada responde 409 cobertura-principal-superpuesta con su id, para que la pantalla ofrezca finalizarla. Un click que cambia dos coberturas deja una que despues nadie puede explicar.

        principal = false desmarca, y es una operacion legitima: un paciente puede tener coberturas sin ninguna preferida.
      operationId: marcarCoberturaPrincipal
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la cobertura
        example: 412
        in: path
        name: coberturaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarcarCoberturaPrincipalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoberturaResponse"
          description: Cobertura actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta declarar el valor de principal
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La cobertura no existe, es de otra organizacion o de otro\
            \ paciente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya hay otra cobertura principal vigente en ese periodo (cobertura-principal-superpuesta)
            o la cobertura esta dada de baja (cobertura-inactiva)
      summary: Elegir o quitar la cobertura principal del paciente
      tags:
      - Coberturas del paciente
  /api/v1/personas/{personaId}/elegibilidad:
    get:
      description: |-
        RF-M17-007. Confronta lo que el CONVENIO exige con lo que el paciente tiene, para una cobertura, una practica y un dia.

        LEE EL CONVENIO VIVO, no la copia congelada de ninguna autorizacion. Decidir que se puede hacer hoy se hace con la regla de hoy; la copia congelada existe para explicar el pasado, y usarla aca aplicaria reglas derogadas a una atencion actual.

        LA LISTA VACIA CON elegible = true ES EL CASO NORMAL, no un error. Pasa en cuatro situaciones y las cuatro son frecuentes: cobertura PARTICULAR (no hay financiador), sin convenio vigente de esta sede con ese plan (el paciente se atiende como particular), con convenio pero sin arancel para esa practica (hueco de configuracion del centro, no motivo para negar la atencion), y convenio que no exige nada. RN-M17-005 y RN-M17-006: una actividad no cubierta no debe pedir orden ni autorizacion artificialmente.

        UN REQUISITO FALTANTE NO ES UN ERROR: responde 200 con elegible = false y el detalle de que falta. Un 409 obligaria a la pantalla a tratar el caso mas frecuente —al paciente le falta la orden— como una excepcion.

        ESTO NO CONSUME NADA (RN-M17-001) y no persiste nada. Es idempotente.

        NO AFIRMA QUE LA PRESTACION SEA FACTURABLE (RN-M08-004): dice si la documentacion administrativa esta presente, que es otra cosa.

        limiteSesionesMensual viaja INFORMATIVO y sin veredicto: verificarlo exige contar sesiones ya atendidas, o sea el consumo que esta version no cablea.

        Exige consultorio en el contexto: el convenio que fija los requisitos es de la SEDE (RN-M16-001), asi que la misma cobertura del mismo paciente puede exigir cosas distintas en dos sedes de la misma organizacion.
      operationId: consultarElegibilidadAdministrativa
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Cobertura con la que se atenderia
        example: 412
        in: query
        name: coberturaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Practica que se atenderia
        example: 33
        in: query
        name: practicaId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Dia de la atencion. Si se omite, hoy"
        example: 2026-09-03
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElegibilidadResponse"
          description: Requisitos y veredicto. La lista vacia es un estado normal
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin consultorio en el contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona o la cobertura no existen, o son de otra organizacion"
      summary: Que le falta al paciente para que le atiendan esa practica
      tags:
      - Elegibilidad administrativa
  /api/v1/personas/{personaId}/ordenes:
    get:
      description: |-
        Devuelve TODAS las ordenes del paciente, mas nuevas primero, incluidas las vencidas y las dadas de baja. Es deliberado: "un documento vencido no desaparece" es requisito de M17, y sin el historial no se puede explicar con que papel se atendio al paciente el mes pasado.

        estado filtra el CICLO DE VIDA y por defecto trae todas. NO filtra por vigencia: una orden ACTIVA vencida es el caso normal.

        fecha es el dia contra el que se calculan vigente, vencida y diasParaVencer. Si se omite, hoy. diasParaVencer es la alerta de RF-M17-006 y se calcula al leer: no existe ningun job que mueva estados.
      operationId: listOrdenesDePaciente
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Filtro por ciclo de vida. Si se omite, TODAS"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
          - TODAS
      - description: "Dia contra el que se calcula la vigencia. Si se omite, hoy"
        example: 2026-09-03
        in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdenResponse"
          description: "Historial de ordenes, mas nuevas primero"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La persona no existe o es de otra organizacion
      summary: Historial de ordenes medicas de un paciente
      tags:
      - Ordenes medicas
    post:
      description: |-
        RF-M17-001. Exige paciente:manage sobre la sede del contexto.

        LA PERSONA TIENE QUE SER PACIENTE. Una Persona no es un Paciente (RF-M07-010): si no tiene perfil vigente responde 409 persona-sin-perfil-paciente.

        EL EMISOR ES TEXTO LIBRE. El medico que firma es externo al centro y no esta en ningun catalogo del tenant: exigir que exista como fila dejaria al mostrador sin poder cargar la orden que el paciente trajo hoy. La matricula es opcional, y eso resuelve el caso borde del documento ilegible sin rechazar la carga.

        LA COBERTURA ES OPCIONAL. Una prescripcion la firma un medico, no un financiador: sin coberturaId la orden vale para cualquiera, y la elegibilidad la acepta para todas.

        vigenciaDesde omitido = la fecha de emision. Nunca puede ser anterior a ella: una orden no puede valer antes de haberse escrito, y eso lo exige tambien la base.

        indicacion es la TRANSCRIPCION administrativa de lo que dice el papel. NO es registro clinico (RN-M17-004) y no reemplaza nada de la historia clinica.
      operationId: createOrdenMedica
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrdenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenResponse"
          description: Orden registrada. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, vigencia invertida, o vigencia anterior\
            \ a la fecha de emision"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona o la cobertura no existen, o son de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La persona no es paciente (persona-sin-perfil-paciente), esta\
            \ dada de baja (persona-inactiva), o ya hay una orden vigente con ese\
            \ numero (documento-numero-taken)"
      summary: Registrar una orden medica
      tags:
      - Ordenes medicas
  /api/v1/personas/{personaId}/ordenes/{ordenId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige paciente:manage sobre la sede del contexto.

        NO ES LO MISMO QUE VENCER. Una orden vencida sigue activa, se sigue listando y se sigue pudiendo corregir: "un documento vencido no desaparece". Dar de baja significa "esta orden nunca debio cargarse".

        No borra nada y no toca ningun hecho ya registrado (regla maestra 10). La orden sigue siendo legible con estado INACTIVA, y las autorizaciones que la referencian quedan intactas.

        No hay reactivacion. Una orden que vuelve es un alta nueva.
      operationId: deactivateOrdenMedica
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la orden
        example: 51
        in: path
        name: ordenId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateDocumentoRequest"
        required: true
      responses:
        "204":
          description: Orden dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La orden no existe, es de otra organizacion o de otro paciente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La orden ya estaba dada de baja (orden-already-inactive)
      summary: Dar de baja una orden medica
      tags:
      - Ordenes medicas
    put:
      description: |-
        Exige paciente:manage sobre la sede del contexto. Edicion parcial: lo que no viaja no se toca.

        LA PERSONA Y LA COBERTURA NO SE PUEDEN CAMBIAR, y por eso no estan en el cuerpo. Mudar una orden de paciente reescribiria quien presento que papel.

        UNA ORDEN VENCIDA SI SE EDITA. Corregir la fecha de vigencia mal tipeada es el caso normal, y bloquearlo obligaria a dar de baja y recargar. Una orden dada de baja no se edita: 409 orden-inactiva.

        expectedVersion es obligatorio: una version vieja responde 409 en vez de pisar el cambio ajeno en silencio.
      operationId: updateOrdenMedica
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la orden
        example: 51
        in: path
        name: ordenId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrdenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenResponse"
          description: Orden actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, vigencia invertida o anterior a la emision"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La orden no existe, es de otra organizacion o de otro paciente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Orden dada de baja (orden-inactiva), version desactualizada\
            \ (conflict) o numero en uso (documento-numero-taken)"
      summary: Corregir una orden medica
      tags:
      - Ordenes medicas
  /api/v1/personas/{personaId}/ordenes/{ordenId}/documento:
    post:
      description: |-
        RF-M17-002 y RF-M25-006. Exige paciente:manage sobre la sede del contexto.

        ACA NO SE SUBE NADA. El archivo lo sube POST /personas/{personaId}/adjuntos, que ya valida tipo y tamano, genera una clave de almacenamiento opaca que nunca sale del backend (RN-M25-002) y autoriza cada descarga. Este endpoint solo guarda el vinculo: un segundo mecanismo de carga significaria una segunda validacion, una segunda ruta de descarga y una segunda superficie de path traversal.

        EL ADJUNTO TIENE QUE SER DE ESTA PERSONA. Vincular el de otro paciente lo volveria descargable desde esta ruta y evadiria el control de acceso que el adjunto hereda de su persona (RN-M25-003).

        adjuntoId null DESVINCULA, y es legitimo: el operador subio el escaneo equivocado y lo saca sin dar de baja la orden entera.
      operationId: vincularDocumentoDeOrden
      parameters:
      - description: Identificador de la persona
        example: 1204
        in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la orden
        example: 51
        in: path
        name: ordenId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VincularDocumentoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenResponse"
          description: Vinculo actualizado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo o sin paciente:manage
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La orden o el adjunto no existen, o son de otro paciente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La orden o el adjunto estan dados de baja
      summary: Vincular el escaneo de la orden
      tags:
      - Ordenes medicas
  /api/v1/personas/{personaId}/perfil-paciente:
    delete:
      description: |-
        La persona SIGUE VIGENTE en el padron y lo unico que deja de ser es paciente. Es exactamente el estado que RN-M07-006 describe: alguien que consume servicios no clinicos sin perfil clinico.

        ES IDEMPOTENTE Y RESPONDE 200. Dar de baja un perfil que ya no esta vigente no es un error del operador: es el boton tocado dos veces.

        NO BORRA LA HISTORIA CLINICA. Igual que activar no la crea, esto no la borra: la HC es de M09 y su existencia no depende de que el perfil siga vigente. Reactivar el perfil despues vuelve a encontrar la historia que ya habia.

        El motivo es obligatorio, a diferencia de la activacion: la operacion que restringe es la que alguien va a tener que justificar despues.
      operationId: darDeBajaPerfilPaciente
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BajaDePerfilPacienteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaResponse"
          description: "Perfil dado de baja, o ya no vigente"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es de otra organizacion"
      summary: Dar de baja el perfil clinico de una persona
      tags:
      - Personas
    post:
      description: |-
        Convierte funcionalmente a la persona en paciente, reutilizando su identidad (RF-M07-008, RN-M07-007). No recibe ningun dato personal: si lo recibiera, existiria la forma de que la ficha clinica y la administrativa se separaran.

        ES IDEMPOTENTE Y RESPONDE 200, no 201 y no 409. Activar dos veces no es un error del operador: es el boton tocado dos veces o el request reintentado despues de un timeout, y la respuesta correcta es el perfil que ya existe.

        ACTIVAR UN PERFIL NO CREA HISTORIA CLINICA. La HC es M09 y la crea el modulo clinico cuando exista; esto declara que la persona es paciente y nada mas (regla maestra 1).

        Una persona INACTIVA responde 409. Una persona vigente cuyo perfil anterior fue dado de baja SI se puede reactivar: es un alta nueva y el unique lo permite.
      operationId: activarPerfilPaciente
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivarPerfilPacienteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaResponse"
          description: "Perfil activado, o el que ya estaba vigente"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin contexto de trabajo activo, o sin paciente:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La persona esta dada de baja
      summary: Activar el perfil clinico de una persona
      tags:
      - Personas
  /api/v1/personas/{personaId}/resumen:
    get:
      description: |-
        Consolida la identidad, los adjuntos y lo que aporta cada modulo: turnos y situacion economica hoy; coberturas cuando existan (03.03/03.04).

        RECORTA POR PERMISOS Y NO RECHAZA. Una seccion cuyo permiso el actor no tiene no viene, y aparece en seccionesOmitidas con el codigo que falta. Devolver 403 sobre la ficha entera por no poder ver la deuda dejaria al profesional sin poder abrir a ningun paciente; omitir en silencio seria peor, porque la pantalla leeria "sin turnos" donde en realidad dice "no podes ver los turnos".

        NO TRAE NADA CLINICO, y no es que falte: AKINE-04.01 fijo que todo acceso clinico exige justificacion declarada y queda auditado. Una ficha de mostrador que muestre casos al abrirla convertiria ese control en un formalismo. El dato clinico se pide por M09, con permiso y justificacion.

        Una persona INACTIVA responde 200: el 360 de una ficha dada de baja es justamente donde se consulta su historico.
      operationId: verResumenDePersona
      parameters:
      - in: path
        name: personaId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenDePersonaResponse"
          description: La ficha consolidada
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin contexto de trabajo activo
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, o es de otra organizacion"
      summary: Ver la ficha 360 de una persona
      tags:
      - Personas
  /api/v1/plans:
    get:
      description: "Devuelve los planes vigentes con sus limites cuantitativos y las\
        \ funcionalidades que habilitan. Es la fuente de la pantalla de contratacion\
        \ y de upgrade: el frontend no mantiene su propia copia del catalogo, porque\
        \ una copia desactualizada ofreceria planes que el backend ya no acepta. Los\
        \ planes se referencian siempre por su codigo, nunca por id."
      operationId: listPlans
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanResponse"
          description: Catalogo vigente. Lista vacia si no hay planes contratables
      summary: Catalogo de planes contratables
      tags:
      - Planes
  /api/v1/platform/organizations/{orgId}/support-access:
    get:
      description: |-
        Reservado a la administracion de plataforma. Devuelve los accesos vigentes; los cerrados quedan en la fila para la auditoria.

        La misma informacion le llega al tenant por SU propia auditoria, que es donde tiene sentido para el: un cliente tiene derecho a ver quien entro a sus datos y por que, sin pedirselo a nadie.
      operationId: listSupportAccess
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportAccessResponse"
          description: Accesos de soporte vigentes. Lista vacia si no hay ninguno
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o la cuenta no administra la plataforma.\
            \ Nunca 401 desde un endpoint de negocio"
      summary: Accesos de soporte vigentes sobre una organizacion
      tags:
      - Plataforma
    post:
      description: |-
        Reservado a la administracion de plataforma. Motivo obligatorio: sin motivo no hay soporte, hay acceso a datos de salud ajenos.

        La duracion se pide en minutos y no puede exceder los 240 (cuatro horas), que es tambien el default. El tope no es un valor sugerido: dejar que quien pide el acceso elija su propia duracion convertiria 'acotado en tiempo' en 'acotado si el que entra quiere'.

        El otorgamiento queda en la auditoria DEL TENANT, no solo en la de plataforma. Cada operacion que despues se ampare en este acceso se audita por separado como SUPPORT_ACCESS_USED.
      operationId: grantSupportAccess
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantSupportAccessRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessResponse"
          description: Acceso de soporte concedido
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo, o la duracion es invalida o excede el maximo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La organizacion no existe o esta dada de baja
      summary: Conceder acceso de soporte sobre una organizacion
      tags:
      - Plataforma
  /api/v1/platform/roles:
    get:
      description: |-
        Reservado a la administracion de plataforma. Devuelve los vigentes; los revocados quedan en la fila para la auditoria, no en este listado.

        No hay paginado: la cantidad de administradores de plataforma se cuenta con los dedos de una mano, y si algun dia no fuera asi, eso seria el problema.
      operationId: listPlatformRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformRoleResponse"
          description: Roles de plataforma vigentes
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o la cuenta no administra la plataforma.\
            \ Nunca 401"
      summary: Roles de plataforma vigentes
      tags:
      - Plataforma
    post:
      description: |-
        Reservado a la administracion de plataforma. Motivo obligatorio: es el permiso mas alto del sistema.

        La existencia de la cuenta NO se verifica: cuenta es propiedad del modulo de identidad y este modulo no puede consultarla. Un accountId inexistente falla contra la clave foranea y se responde como una solicitud invalida.

        Otorgarlo dos veces responde 409: dos administradores operando a la vez tienen que enterarse de que el otro llego primero.
      operationId: grantPlatformRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPlatformRoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformRoleResponse"
          description: Rol de plataforma otorgado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo o la cuenta destino
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Esa cuenta ya tiene el rol de plataforma vigente
      summary: Otorgar el rol de plataforma a una cuenta
      tags:
      - Plataforma
  /api/v1/platform/roles/{platformRoleId}:
    delete:
      description: |-
        Reservado a la administracion de plataforma. Baja LOGICA: la fila queda con su autor y su motivo.

        No impide quedarse sin ningun administrador de plataforma, y es deliberado: un invariante aca impediria revocar de urgencia una cuenta comprometida, que es el caso en el que revocar mas importa. El rescate es el seed de migracion.

        El motivo va como parametro y no en el cuerpo porque un DELETE con cuerpo no esta garantizado de punta a punta por proxies y clientes HTTP.
      operationId: revokePlatformRole
      parameters:
      - description: Identificador del otorgamiento
        example: 2
        in: path
        name: platformRoleId
        required: true
        schema:
          type: integer
          format: int64
      - description: Motivo declarado de la revocacion. Queda en la auditoria
        in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Rol de plataforma revocado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El rol no existe o ya estaba revocado
      summary: Revocar un rol de plataforma
      tags:
      - Plataforma
  /api/v1/platform/support-access/{supportAccessId}:
    delete:
      description: |-
        Reservado a la administracion de plataforma. No borra: cierra. Que alguien haya entrado a un tenant y por que tiene que seguir siendo legible despues.

        Un acceso inexistente o ya cerrado responde 404: para quien pregunta, los dos casos son el mismo.
      operationId: revokeSupportAccess
      parameters:
      - description: Identificador del acceso de soporte
        example: 5
        in: path
        name: supportAccessId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Acceso de soporte cerrado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El acceso no existe o ya estaba cerrado
      summary: Cerrar un acceso de soporte antes de su vencimiento
      tags:
      - Plataforma
  /api/v1/servicios:
    get:
      description: |-
        Devuelve los servicios de la plataforma ordenados por nombre.

        q busca por nombre y por codigo, sin distinguir mayusculas ni acentos. Los comodines que el usuario escriba se escapan: un % tecleado busca un % literal y no todo el catalogo.

        estado filtra por ciclo de vida y por defecto trae solo los ACTIVOS. Con el default, un selector de alta de oferta nunca ofrece un servicio dado de baja, que es lo que evita que el 409 servicio-inactivo tenga que aparecer en esa pantalla.

        No exige contexto de trabajo elegido: el catalogo global es el mismo para todos los centros y no hay ninguna fila que acotar por tenant.
      operationId: listServicios
      parameters:
      - description: Texto a buscar en el nombre y en el codigo. Vacio trae todo
        example: kinesio
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: "Filtro por ciclo de vida. Si se omite, ACTIVO"
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicioResponse"
          description: "Servicios del catalogo, ordenados por nombre"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin sesion autenticada
      summary: Listar el catalogo global de servicios
      tags:
      - Servicios y ofertas
    post:
      description: |-
        Exige rol de plataforma: lo que se crea aca lo ven todos los centros del SaaS.

        El codigo es unico entre los servicios VIGENTES y no se puede cambiar despues: es lo que las ofertas guardan. El codigo de un servicio dado de baja SI se puede reusar. El nombre tambien es unico entre los vigentes, comparado sin distinguir mayusculas ni acentos.

        modalidadDefault, requiereCasoClinicoDefault y generaRegistroClinicoDefault son DEFAULTS que la oferta hereda si no dice otra cosa. No son restricciones: una sede puede ofrecer en grupal un servicio cuyo default es individual.

        No lleva Idempotency-Key y es deliberado: un servicio no consume cupo de ningun plan, asi que lo unico que un reintento podria producir es una fila duplicada, y contra eso el unique de codigo es una garantia mas fuerte que una clave que depende de que el cliente la mande bien.
      operationId: createServicio
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServicioRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicioResponse"
          description: Servicio creado. La cabecera Location apunta al recurso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos o faltantes
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin rol de plataforma
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Codigo repetido (servicio-codigo-taken) o nombre repetido (servicio-nombre-taken)
            entre los servicios vigentes
      summary: Dar de alta un servicio del catalogo global
      tags:
      - Servicios y ofertas
  /api/v1/servicios/{servicioId}:
    delete:
      description: |-
        Baja LOGICA con motivo obligatorio. Exige rol de plataforma.

        LA BAJA NO CASCADEA, y esto es lo mas importante de la operacion. Las ofertas activas de los centros que ya referencian este servicio SIGUEN OPERANDO: RF-M27-002 prohibe el borrado fisico cuando hay referencias y RN-M03-006 prohibe afectar historicos. Lo unico que la baja impide es CREAR ofertas nuevas sobre el, que responden 409 servicio-inactivo.

        El motivo es obligatorio: sin el, la auditoria no responde por que seis meses despues.

        No hay reactivacion. Un servicio que vuelve es un alta nueva, no una baja deshecha: modelarlo al reves borraria el rastro de que dejo de ofrecerse.
      operationId: deactivateServicio
      parameters:
      - description: Identificador del servicio
        example: 12
        in: path
        name: servicioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateOfferingRequest"
        required: true
      responses:
        "204":
          description: Servicio dado de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin rol de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El servicio no existe
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El servicio ya estaba dado de baja (servicio-already-inactive)
      summary: Dar de baja un servicio del catalogo global
      tags:
      - Servicios y ofertas
    put:
      description: |-
        Exige rol de plataforma.

        El codigo NO se puede cambiar y por eso no esta en el cuerpo: es la clave con la que las ofertas de todos los centros lo referencian, y cambiarlo seria reescribir el significado de filas que ya existen en tenants que no participan de esta llamada. Renombrar es cambiar nombre.

        Los campos que llegan en null NO se tocan. Es edicion parcial declarada: obligar a mandar el recurso entero forzaria a la pantalla a releerlo antes de cada guardado para no pisar lo que otro cambio en el medio, y expectedVersion ya resuelve ese problema mejor.

        Un servicio dado de baja no admite ediciones: 409 servicio-inactivo. Sus datos historicos siguen siendo consultables.
      operationId: updateServicio
      parameters:
      - description: Identificador del servicio
        example: 12
        in: path
        name: servicioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServicioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicioResponse"
          description: Servicio actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin rol de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El servicio no existe
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre repetido (servicio-nombre-taken), servicio dado de\
            \ baja (servicio-inactivo), o version desactualizada (conflict)"
      summary: Editar un servicio del catalogo global
      tags:
      - Servicios y ofertas
  /api/v1/version:
    get:
      description: Devuelve la identidad tecnica del backend en ejecucion y la version
        SemVer del contrato OpenAPI que publica. El frontend la usa para verificar
        que el cliente generado corresponde a la version desplegada.
      operationId: version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
          description: OK
      summary: Version del backend y del contrato
      tags:
      - Platform
components:
  schemas:
    AcceptInvitacionRequest:
      type: object
      description: "Aceptacion de una invitacion, con los datos de alta si hacen falta"
      properties:
        apellido:
          type: string
          description: Apellido. Opcional
          example: Gomez
          maxLength: 120
          minLength: 0
        nombre:
          type: string
          description: Nombre. Obligatorio solo si el invitado no tiene cuenta todavia
          example: Ana
          maxLength: 120
          minLength: 0
        password:
          type: string
          format: password
          description: Contrasena elegida. Obligatoria solo si el invitado no tiene
            cuenta todavia. Misma politica que el registro
          maxLength: 128
          minLength: 0
        token:
          type: string
          description: Token recibido por correo
          maxLength: 512
          minLength: 0
      required:
      - token
    AcceptedInvitacionResponse:
      type: object
      description: Vinculo creado al aceptar la invitacion
      properties:
        consultorioId:
          type: integer
          format: int64
          description: "Sede del vinculo, o null si es de toda la organizacion"
        cuentaCreada:
          type: boolean
          description: Si la cuenta se creo en este mismo acto
        cuentaId:
          type: integer
          format: int64
          description: Cuenta que quedo vinculada
          example: 42
        membershipId:
          type: integer
          format: int64
          description: Vinculo creado
          example: 17
        organizationId:
          type: integer
          format: int64
          example: 1
    AcceptedResponse:
      type: object
      description: "Acuse uniforme: no revela si la cuenta existe"
      properties:
        message:
          type: string
          description: Mensaje uniforme para mostrarle a la persona
          example: "Si el email corresponde a una cuenta, vas a recibir un correo\
            \ con las instrucciones."
    AccessTokenResponse:
      type: object
      description: "Access token de vida corta, para el header Authorization: Bearer"
      properties:
        accessToken:
          type: string
          description: "JWT compacto. Se guarda EN MEMORIA, nunca en localStorage"
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI0MiJ9.firma
        consultorioId:
          type: integer
          format: int64
          description: "Consultorio del contexto, null si el alcance es pre_context"
          example: 1
        expiresIn:
          type: integer
          format: int64
          description: Segundos de vida restantes. El cliente programa el refresh
            con este valor y no leyendo el token
          example: 600
        organizationId:
          type: integer
          format: int64
          description: "Organizacion del contexto, null si el alcance es pre_context"
          example: 1
        roleCode:
          type: string
          description: "Rol de la membership al momento de emitir. Sirve para dibujar\
            \ el menu; NO autoriza nada: el backend revalida en cada request"
          example: ORG_ADMIN
        scope:
          type: string
          description: "Alcance del token: pre_context (recien autenticado, sin contexto\
            \ elegido) o context (acotado a organizacion y consultorio)"
          enum:
          - pre_context
          - context
          example: pre_context
        tokenType:
          type: string
          description: Esquema de autorizacion
          example: Bearer
    AccountResponse:
      type: object
      description: Cuenta despues de la transicion administrativa
      properties:
        blockedAt:
          type: string
          format: date-time
          description: "Momento del bloqueo, null si no esta bloqueada"
          example: 2026-08-23T14:05:00Z
        email:
          type: string
          description: Direccion de correo tal como se registro
          example: ana.perez@ejemplo.test
        firstName:
          type: string
          description: Nombre de la persona
          example: Ana
        id:
          type: integer
          format: int64
          description: Identificador de la cuenta
          example: 42
        lastName:
          type: string
          description: Apellido de la persona
          example: Perez
        status:
          type: string
          description: Estado de la cuenta despues de la transicion
          enum:
          - PENDIENTE_ACTIVACION
          - ACTIVA
          - BLOQUEADA
          - DESACTIVADA
          example: BLOQUEADA
        updatedAt:
          type: string
          format: date-time
          description: Ultima modificacion de la cuenta
          example: 2026-08-23T14:05:00Z
    AccountStateChangeRequest:
      type: object
      description: Motivo auditable de la transicion de estado de la cuenta
      properties:
        reason:
          type: string
          description: Por que se ejecuta la transicion. Queda en la auditoria
          example: Baja del profesional por fin de contrato
          maxLength: 500
          minLength: 0
      required:
      - reason
    ActivarPerfilPacienteRequest:
      type: object
      description: "Activacion del perfil clinico. No recibe datos personales: los\
        \ reutiliza"
      properties:
        motivo:
          type: string
          description: Motivo declarado de la activacion. Opcional
          example: Inicia rehabilitacion post quirurgica
          maxLength: 280
          minLength: 0
    ActivateAccountRequest:
      type: object
      description: "Token del enlace de activacion, con la contrasena si hace falta\
        \ fijarla"
      properties:
        password:
          type: string
          description: Contrasena a fijar. Obligatoria solo si la cuenta todavia no
            tiene credencial (invitacion); se ignora si ya la tiene
          example: una-contrasena-larga-y-unica
          maxLength: 256
          minLength: 0
        token:
          type: string
          description: Valor del enlace recibido por correo
          example: 9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a
          maxLength: 256
          minLength: 0
      required:
      - token
    AdjuntoPageResponse:
      type: object
      description: Pagina de adjuntos administrativos de una persona
      properties:
        content:
          type: array
          description: "Adjuntos de esta pagina, mas nuevos primero"
          items:
            $ref: "#/components/schemas/AdjuntoResponse"
        page:
          type: integer
          format: int32
          description: "Numero de pagina devuelta, base cero"
          example: 0
        size:
          type: integer
          format: int32
          description: Cantidad de elementos por pagina
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Cantidad total de adjuntos que cumplen el filtro
          example: 4
        totalPages:
          type: integer
          format: int32
          description: Cantidad total de paginas disponibles
          example: 1
    AdjuntoResponse:
      type: object
      description: Documento administrativo vinculado a una persona. No es un dato
        clinico
      properties:
        categoria:
          type: string
          description: Clasificacion administrativa
          enum:
          - DOCUMENTO_IDENTIDAD
          - CREDENCIAL_COBERTURA
          - CONSENTIMIENTO
          - AUTORIZACION
          - COMPROBANTE
          - OTRO
          example: CREDENCIAL_COBERTURA
        checksumSha256:
          type: string
          description: "SHA-256 del contenido, en hexadecimal. Subir el mismo archivo\
            \ dos veces devuelve este mismo adjunto con 200"
        consultorioId:
          type: integer
          format: int64
          description: "Sede desde la que se cargo. Dato de auditoria, no de propiedad:\
            \ el adjunto se ve y se descarga desde cualquier sede de la organizacion"
          example: 3
        contentType:
          type: string
          description: "Tipo DETECTADO por los bytes, no el declarado al subir"
          example: application/pdf
        deactivationReason:
          type: string
          description: "Motivo declarado de la baja, o null"
        deletedAt:
          type: string
          format: date-time
          description: "Instante UTC de la baja logica, o null"
        estado:
          type: string
          description: Si el contenido se puede descargar hoy
          enum:
          - DISPONIBLE
          - NO_DISPONIBLE
          example: DISPONIBLE
        estadoCicloDeVida:
          type: string
          description: "Ciclo de vida del adjunto. Un adjunto INACTIVO se sigue descargando:\
            \ la baja es logica"
          enum:
          - ACTIVO
          - INACTIVO
          example: ACTIVO
        id:
          type: integer
          format: int64
          description: Identificador del adjunto
          example: 17
        nombreArchivo:
