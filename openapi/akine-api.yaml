    CreateOfertaRequest:
      type: object
      description: Datos para dar de alta una oferta de servicio en una sede
      properties:
        admiteObraSocial:
          type: boolean
          description: "Si se puede presentar a un financiador. Si se omite, false"
        capacidad:
          type: integer
          format: int32
          description: "Personas que admite a la vez. OBLIGATORIA y sin default: una\
            \ oferta INDIVIDUAL admite 1 y hay que decirlo. RF-M27-003 no la deriva\
            \ de la modalidad, porque un box con dos camillas puede atender de a dos\
            \ en individual"
          example: 1
          minimum: 0
        descripcion:
          type: string
          description: Descripcion libre. Nunca contenido clinico
          maxLength: 280
          minLength: 0
        duracionMinutos:
          type: integer
          format: int32
          description: Duracion de la prestacion en minutos
          example: 45
          minimum: 0
        esquemaCobro:
          type: string
          description: "Esquema de cobro declarado, texto libre acotado. Se guarda\
            \ sin resolverse: los modulos que lo interpretarian no existen todavia"
          example: SESION_SUELTA
          maxLength: 32
          minLength: 0
        generaRegistroClinico:
          type: boolean
          description: "Si genera registro clinico. Si se omite, hereda del servicio"
        modalidad:
          type: string
          description: "Individual o grupal. Si se omite, hereda la del servicio"
          enum:
          - INDIVIDUAL
          - GRUPAL
          example: INDIVIDUAL
        moneda:
          type: string
          description: "Moneda del precio, ISO 4217. NO tiene default y no puede tenerlo:\
            \ un importe sin moneda no significa nada, y asumir ARS convertiria en\
            \ pesos el precio de un centro que cobra en otra cosa. Va junto con precioBase:\
            \ los dos o ninguno, y mandar uno solo responde 400"
          example: ARS
          maxLength: 3
          minLength: 0
        nombreComercial:
          type: string
          description: "Como lo llama el centro. Unico entre las ofertas VIGENTES\
            \ de esa sede, comparado sin distinguir mayusculas ni acentos"
          example: Kinesiologia - sesion de 45 minutos
          maxLength: 160
          minLength: 0
        precioBase:
          type: number
          description: "Precio de lista. Omitirlo NO es cero: es que el centro todavia\
            \ no lo fijo. Va SIEMPRE junto con moneda: los dos o ninguno"
          example: 18000.0
          minimum: 0
        requiereCasoClinico:
          type: boolean
          description: "Si exige caso clinico abierto. Si se omite, hereda del servicio"
        requiereEspacio:
          type: boolean
          description: "Si la reserva exige asignar espacio. Si se omite, false"
        requiereProfesional:
          type: boolean
          description: "Si la reserva exige asignar profesional. Si se omite, false"
        servicioId:
          type: integer
          format: int64
          description: "Servicio del catalogo global que esta oferta presta. Tiene\
            \ que estar VIGENTE: sobre uno dado de baja responde 409 servicio-inactivo"
          example: 12
        vigenciaDesde:
          type: string
          format: date
          description: "Primer dia en que se puede reservar, en la zona de la sede.\
            \ Si se omite, hoy"
        vigenciaHasta:
          type: string
          format: date
          description: "Ultimo dia INCLUSIVE. Omitirlo = sin fin previsto, que es\
            \ un estado real y no un dato faltante"
      required:
      - capacidad
      - duracionMinutos
      - nombreComercial
      - servicioId
    CreateOrdenRequest:
