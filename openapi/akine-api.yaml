    put:
      description: |-
        Exige convenio:manage sobre la sede de la ruta.

        CERRAR LA VIGENCIA ES ESTA OPERACION, mandando vigenciaHasta (RF-M16-003). Cerrar la vigencia NO es dar de baja: el convenio queda ACTIVO y consultable, y lo unico que cambia es que deja de aplicarse despues de esa fecha.

        MOVER LA VIGENCIA PUEDE PRODUCIR 409 convenio-solapado, igual que el alta: estirar el fin de un convenio hasta pisar al siguiente es exactamente lo que RN-M16-002 prohibe.

        Ni el codigo, ni la sede, ni el financiador, ni el plan se pueden cambiar y por eso no estan en el cuerpo: son la identidad del convenio, y lo que ya se liquido bajo el los referencia.

        Los campos que llegan en null NO se tocan. La vigencia se valida como par aunque llegue de a una.

        Un convenio dado de baja no admite ediciones: 409 convenio-inactivo. Uno cuyo financiador o plan estan dados de baja SI se puede editar: dejar de trabajar con una obra social no puede tener como efecto que su convenio quede congelado con un error de tipeo.
