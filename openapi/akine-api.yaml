    get:
      description: |-
        RF-M17-003: devuelve autorizadas, consumidas y restantes.

        cantidadConsumida vale SIEMPRE 0 y por lo tanto saldo vale siempre lo autorizado. No es un bug: RN-M17-001 separa autorizado de consumido, y quien mueve la resta es la sesion clinica en una integracion posterior. Los tres numeros viajan igual para que el contrato no cambie ese dia.

        habilita es el veredicto completo —activa, APROBADA, vigente y con saldo— y consultarlo NO consume nada.
