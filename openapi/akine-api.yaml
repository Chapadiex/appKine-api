openapi: 3.1.0
info:
  contact:
    name: AKINE
    url: https://github.com/Chapadiex/appKine-api
  description: |-
    Contrato REST canonico de AKINE: SaaS multi-tenant para centros de kinesiologia, fisioterapia, rehabilitacion y actividades de salud.

    Este artefacto es propiedad del repositorio backend. El frontend genera su cliente TypeScript desde una version fijada de este contrato y no define DTO manuales.
  title: AKINE API
  version: 0.6.0
servers:
- description: Servidor que sirve este contrato
  url: /
tags:
- description: "Plan contratado, estado de la suscripcion e historico"
  name: Suscripciones
- description: Restablecimiento de contrasena por enlace de un solo uso
  name: Recuperacion
- description: Alta self-service y habilitacion de la cuenta
  name: Registro y activacion
- description: "Login, renovacion, seleccion de contexto y cierre de sesion"
  name: Sesion
- description: Contextos de trabajo habilitados para la cuenta autenticada
  name: Mi cuenta
- description: "Alta, edicion y baja de las sedes de una organizacion"
  name: Consultorios
- description: "Administracion de la plataforma: acceso de soporte y roles globales"
  name: Plataforma
- description: "Contrato tecnico: salud y versionado"
  name: Platform
- description: Consulta del registro de hechos de la organizacion
  name: Auditoria
- description: Alta y administracion de tenants y sus sedes
  name: Organizaciones
- description: "Bloqueo, desbloqueo y baja logica de cuentas de la propia organizacion"
  name: Administracion de cuentas
- description: "Catalogo comercial: que incluye cada plan"
  name: Planes
- description: "Vinculos de las cuentas con la organizacion, sus roles y sus permisos"
  name: Colaboradores
paths:
  /api/v1/accounts/{accountId}/block:
    post:
      description: |-
        Suspende el acceso y revoca todas las sesiones vivas de la cuenta en la misma transaccion. Es reversible con /unblock.

        El access token ya emitido sigue siendo valido hasta diez minutos: la revocacion es real sobre el refresh, no sobre el access en vuelo (ADR-0017). No es un bug.

        La persona bloqueada NO se entera por la aplicacion: su login sigue respondiendo el mismo 401 que una contrasena incorrecta (ADR-0018). Se entera por el canal administrativo.

        El motivo es obligatorio y queda en la auditoria. Bloquear una cuenta ya bloqueada responde 409, no un 200 silencioso: dos administradores operando a la vez tienen que enterarse de que el otro llego primero.
      operationId: blockAccount
      parameters:
      - description: Identificador de la cuenta
        example: 42
        in: path
        name: accountId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStateChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Cuenta bloqueada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o el actor no administra su organizacion"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no existe o no tiene membership en la organizacion
            del actor. Los dos casos responden igual
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no admite bloquearse desde su estado actual
      summary: Bloquear una cuenta
      tags:
      - Administracion de cuentas
  /api/v1/accounts/{accountId}/deactivate:
    post:
      description: |-
        Estado TERMINAL: desde la aplicacion no hay vuelta. Revoca todas las sesiones vivas en la misma transaccion.

        Es baja LOGICA: la fila no se borra. Los turnos, sesiones y movimientos que referencian a esta cuenta tienen que seguir siendo legibles (RN-M02-004, regla maestra 10). Lo que queda es active = 0 con deleted_at.

        Como es irreversible, el motivo es lo unico que va a quedar para explicarla: escribirlo con precision no es formalidad.
      operationId: deactivateAccount
      parameters:
      - description: Identificador de la cuenta
        example: 42
        in: path
        name: accountId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStateChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Cuenta desactivada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o el actor no administra su organizacion"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no existe o no es de la organizacion del actor
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta ya estaba desactivada
      summary: Baja logica de la cuenta
      tags:
      - Administracion de cuentas
  /api/v1/accounts/{accountId}/unblock:
    post:
      description: |-
        Vuelve la cuenta a ACTIVA. No revoca nada: llego aca sin sesiones vivas, porque el bloqueo ya las corto. La persona tiene que volver a loguearse.

        El motivo se exige igual, aunque la maquina de estados no lo pida para este destino: devolverle el acceso a alguien es tan auditable como quitarselo, y "por que lo desbloquearon" aparece en las mismas revisiones que la otra pregunta.
      operationId: unblockAccount
      parameters:
      - description: Identificador de la cuenta
        example: 42
        in: path
        name: accountId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStateChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Cuenta desbloqueada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o el actor no administra su organizacion"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no existe o no es de la organizacion del actor
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no estaba bloqueada
      summary: Devolver el acceso a una cuenta bloqueada
      tags:
      - Administracion de cuentas
  /api/v1/auth/activate:
    post:
      description: |-
        Consume el token del correo, deja la cuenta ACTIVA e invalida los demas enlaces de activacion que hubiera vivos. Si se pidio el reenvio tres veces, el que se use mata a los otros dos: un enlace no usado sigue siendo una llave.

        La contrasena solo hace falta si la cuenta todavia no tiene credencial —invitacion, 01.03—. En el alta self-service ya la tiene y enviarla NO la cambia: cambiarla por este camino seria una toma de cuenta que esquiva el reset, que si revoca todas las sesiones.

        Token inexistente, ya usado, invalidado por uno mas nuevo, vencido o del tipo equivocado responden los cinco el mismo 400 invalid-token. Decir "expirado" le confirmaria a quien prueba valores que acerto uno real.

        Activar NO abre sesion: despues de esto el frontend manda al login.
      operationId: activateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccountRequest"
        required: true
      responses:
        "204":
          description: Cuenta activada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Token invalido, usado o vencido; o contrasena que no cumple\
            \ la politica cuando la cuenta no tenia credencial"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta no admite activarse desde su estado actual
      summary: Confirmar el enlace y habilitar la cuenta
      tags:
      - Registro y activacion
  /api/v1/auth/activation/resend:
    post:
      description: |-
        Emite un enlace nuevo e invalida los anteriores. Es el camino para "el correo no me llego" o "el enlace vencio".

        RESPUESTA UNIFORME (ADR-0018): 202 con el mismo cuerpo en los cuatro casos —cuenta pendiente, cuenta ya activa, cuenta bloqueada o desactivada, y email sin cuenta—. Solo el primero emite algo. La diferencia no se publica ni por el estado, ni por el cuerpo, ni por un header.

        Emitir invalida los enlaces anteriores: pedir el reenvio tres veces deja UNA llave viva, no tres.
      operationId: resendActivation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendActivationRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
          description: Solicitud aceptada. Mismo cuerpo exista o no la cuenta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el email
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Reenviar el enlace de activacion
      tags:
      - Registro y activacion
  /api/v1/auth/context:
    post:
      description: |-
        Emite un access token acotado a una Organizacion y un Consultorio. Es el paso que convierte un token pre_context en uno operativo (DP-02).

        NO renueva el refresh ni entrega una cookie nueva: la sesion es la misma, lo que cambia es el alcance del access. Lo que si hace es dejar el contexto recordado en la familia viva, para que la proxima renovacion vuelva sobre el mismo lugar en vez de devolver a la pantalla de seleccion cada diez minutos.

        Sirve tambien para CAMBIAR de contexto sin volver a loguearse, y cada cambio queda auditado.

        Un par no accesible —consultorio inexistente, de otra organizacion, membership vencida o suscripcion cancelada— responde 404, nunca 403: un 403 confirmaria que ese consultorio existe y bastaria recorrer ids para mapear los centros de la competencia.
      operationId: selectContext
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectContextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: Access token acotado al contexto elegido
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Identificadores ausentes o no positivos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El contexto no existe o no esta disponible para esta cuenta
      summary: Elegir el contexto de trabajo y renovar el access token
      tags:
      - Sesion
  /api/v1/auth/login:
    post:
      description: |-
        Verifica las credenciales y emite el par de tokens de una sesion nueva.

        El access token sale en el cuerpo y dura diez minutos. El refresh token NO sale en el cuerpo: viaja en la cookie akine_rt, que es httpOnly, Secure, SameSite=Strict y esta acotada a Path=/api/v1/auth. El cliente no puede leerla ni necesita hacerlo; para renovar solo llama a POST /auth/refresh con credentials incluidas.

        El token sale con alcance pre_context: autentica la identidad y no habilita ninguna operacion de negocio. El paso siguiente es GET /api/v1/me/contexts y despues POST /api/v1/auth/context.

        RECHAZO UNIFORME (ADR-0018): email inexistente, contrasena incorrecta y contrasena correcta sobre una cuenta bloqueada, desactivada o pendiente de activacion devuelven las tres el MISMO 401 con el MISMO cuerpo, y con un tiempo de respuesta equivalente. No hay forma de distinguir los tres casos desde el cliente, y es deliberado: la diferencia convertiria este endpoint en un verificador de direcciones y de credenciales filtradas de otros sitios. Quien tenga la cuenta bloqueada se entera por el canal administrativo.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: Sesion abierta. El refresh viaja en la cabecera Set-Cookie
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el email o la contrasena
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Credenciales invalidas. Mismo cuerpo para las tres causas
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Autenticar y abrir una sesion
      tags:
      - Sesion
  /api/v1/auth/logout:
    post:
      description: |-
        Revoca la familia de refresh a la que pertenece la cookie presentada y borra la cookie del navegador.

        SIEMPRE responde 204, incluso sin cookie o con una que no corresponde a ninguna sesion. Es idempotente por construccion y no es una comodidad: un logout que fallara ante un token desconocido seria un oraculo de tokens validos, y ademas dejaria al frontend sin poder limpiar su estado justo cuando la cookie ya no sirve.

        Cierra SOLO esta sesion. Los otros dispositivos siguen abiertos; para echarlos a todos esta DELETE /api/v1/auth/sessions.
      operationId: logout
      responses:
        "204":
          description: "Sesion cerrada, o no habia ninguna. Siempre este codigo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El Origin del request no es uno de los permitidos: se rechaza\
            \ como CSRF"
      summary: Cerrar la sesion en curso
      tags:
      - Sesion
  /api/v1/auth/password-reset:
    post:
      description: |-
        Emite un token de un solo uso, valido treinta minutos, y encola el correo con el enlace. Emitir uno nuevo invalida los anteriores: pedirlo tres veces deja UN enlace vivo, no tres.

        RESPUESTA UNIFORME (ADR-0018): 202 con el mismo cuerpo y el mismo tiempo de respuesta exista o no la cuenta, y este o no habilitada. Solo el caso "existe y puede autenticarse" emite algo.

        Consecuencia incomoda y deliberada: quien tenga la cuenta bloqueada va a recibir este 202, no va a recibir ningun correo, y no hay forma de que la aplicacion se lo diga. Se entera por el canal administrativo. Si se "arreglara" respondiendo distinto, el endpoint pasaria a confirmar que direcciones tienen cuenta.

        El enlace apunta a una pantalla del frontend que lee el token de la query y lo reenvia por POST a /auth/password-reset/confirm.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
          description: Solicitud aceptada. Mismo cuerpo exista o no la cuenta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el email
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Pedir un enlace para restablecer la contrasena
      tags:
      - Recuperacion
  /api/v1/auth/password-reset/confirm:
    post:
      description: |-
        Consume el token, fija la contrasena nueva y REVOCA TODAS las sesiones vivas de la cuenta en la misma transaccion. La respuesta borra ademas la cookie de refresh de este navegador, que quedo apuntando a una familia revocada.

        Confirmar NO abre sesion: despues de esto el frontend manda al login. Es deliberado —la persona acaba de demostrar que controla el correo, no que recuerda la contrasena que acaba de elegir— y hace que el flujo termine siempre en el mismo lugar.

        Token inexistente, usado, invalidado, vencido o de una cuenta que se bloqueo entre el pedido y la confirmacion: los cinco casos responden el mismo 400 invalid-token.
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
        required: true
      responses:
        "204":
          description: Contrasena actualizada y sesiones revocadas
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Token invalido, usado o vencido; o contrasena que no cumple\
            \ la politica"
      summary: Fijar la contrasena nueva con el token del correo
      tags:
      - Recuperacion
  /api/v1/auth/refresh:
    post:
      description: |-
        Canjea el refresh de la cookie akine_rt por un par nuevo. No lleva cuerpo: la credencial es la cookie, y ponerla ademas en el body la expondria al JavaScript de la pagina.

        ROTACION ESTRICTA: cada canje invalida el refresh presentado y entrega uno nuevo en la misma familia, heredando el vencimiento ABSOLUTO de la sesion. Renovar no extiende la sesion: a las doce horas del login cae aunque se haya refrescado sin parar.

        DETECCION DE REUSO: presentar un refresh ya canjeado revoca la familia completa —victima y atacante quedan afuera— y responde 401. Ese 401 es IDENTICO al de un token inexistente o vencido: el cliente no puede distinguir "te detectamos" de "no servia", y es a proposito.

        Si el contexto que la sesion recordaba dejo de ser accesible —membership revocada, suscripcion cancelada— el par nuevo sale degradado a pre_context en vez de fallar: la persona sigue autenticada y el frontend la manda a elegir contexto otra vez.

        El frontend debe serializar las renovaciones concurrentes con una cola single-flight: dos pestanas refrescando a la vez producen un reuso legitimo y se quedan las dos afuera.
      operationId: refreshSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: "Sesion renovada, con un refresh nuevo en Set-Cookie"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Refresh ausente, invalido, vencido, revocado o reusado. Los\
            \ cinco casos responden igual y la respuesta borra la cookie"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El Origin del request no es uno de los permitidos por configuracion:\
            \ se rechaza como CSRF"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: Renovar la sesion presentando la cookie de refresh
      tags:
      - Sesion
  /api/v1/auth/register:
    post:
      description: |-
        Crea en una sola transaccion la cuenta del fundador, la organizacion, su primer consultorio, la suscripcion y la membership de administrador, y encola el correo con el enlace de activacion.

        RESPUESTA UNIFORME (ADR-0018): 202 Accepted con el mismo cuerpo tanto si el email estaba libre como si ya tenia cuenta. En el segundo caso no se crea ni se modifica nada y se encola un correo de "ya tenes cuenta". No hay 409 email-already-registered y no va a haberlo: seria el oraculo de existencia que el 401 uniforme del login existe para cerrar.

        La cuenta nace PENDIENTE_ACTIVACION. Hasta confirmar el enlace, el login responde 401 igual que con una contrasena incorrecta.

        El header Idempotency-Key es obligatorio. Reintentar el alta con la misma clave devuelve el mismo desenlace sin crear una segunda cuenta ni mandar un segundo correo; el cliente debe generarlo una vez al abrir el formulario y reusarlo en cada reintento.

        Los rechazos posibles no dicen nada sobre el email: 400 por contrasena que no cumple la politica o por campos ausentes, 404 por un planCode que no existe o ya no se contrata, y 409 por un organizationSlug ya tomado. Los tres se evaluan ANTES de mirar si el email tiene cuenta, justamente para que la respuesta sea la misma en los dos casos: validarlos despues convertiria el endpoint en un verificador de direcciones de correo.
      operationId: registerAccount
      parameters:
      - description: "Identificador unico del intento, generado por el cliente. Reintentar\
          \ la misma alta debe reusar el mismo valor."
        example: 0f9d5f6e-1c2b-4a3d-9e8f-7a6b5c4d3e2f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
          description: Solicitud aceptada. Mismo cuerpo exista o no la cuenta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, contrasena que no cumple la politica, o\
            \ falta el header Idempotency-Key"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El planCode pedido no existe o ya no se contrata. Misma respuesta
            exista o no la cuenta
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El organizationSlug pedido ya lo usa otro tenant. Misma respuesta
            exista o no la cuenta
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos desde esta IP
      summary: "Alta self-service de cuenta, organizacion y primer consultorio"
      tags:
      - Registro y activacion
  /api/v1/auth/sessions:
    delete:
      description: |-
        Revoca todos los refresh vivos de la cuenta autenticada, en todos sus dispositivos, y borra la cookie de este navegador.

        Es la accion de "cerrar sesion en todos lados" que corresponde despues de perder un telefono o de sospechar un acceso ajeno. Opera SOLO sobre la propia cuenta: el identificador sale del principal y no hay parametro que lo cambie.

        Los access token ya emitidos siguen siendo criptograficamente validos hasta diez minutos (ADR-0017): la revocacion es real sobre el refresh, no sobre el access en vuelo.
      operationId: closeAllSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosedSessionsResponse"
          description: Sesiones revocadas. Cero es un resultado valido
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
      summary: Cerrar todas las sesiones de la propia cuenta
      tags:
      - Sesion
  /api/v1/me/contexts:
    get:
      description: |-
        Devuelve los pares Organizacion + Consultorio en los que la cuenta tiene una membership vigente y cuya organizacion admite operar. Es lo que alimenta la pantalla de seleccion de contexto.

        Cada elemento trae los nombres junto a los ids porque este listado es exactamente lo que el usuario ve para elegir: resolverlos con llamadas adicionales exigiria pedir datos de organizaciones antes de tener contexto en ninguna.

        No requiere contexto de tenant: es el endpoint con el que se averigua que contextos hay. Devuelve una lista vacia —no un error— cuando la cuenta todavia no tiene ninguno; el frontend distingue 'no elegiste' de 'no tenes donde'.

        Este endpoint no cambia el contexto activo. Seleccionarlo renueva el token, y eso lo publica el modulo de identidad en 01.02 como POST /api/v1/auth/context.
      operationId: listMyContexts
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizedContextResponse"
          description: Contextos habilitados. Lista vacia si la cuenta no tiene ninguno
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada. Nunca 401: un 401 haria que el\
            \ cliente descarte el token y entre en un bucle de login"
      summary: Contextos de trabajo habilitados
      tags:
      - Mi cuenta
  /api/v1/me/permissions:
    get:
      description: |-
        Devuelve los codigos del catalogo que la cuenta tiene vigentes en la organizacion y la sede de su contexto activo, ya resueltos: rol base, permisos adicionales vigentes y acceso de soporte, todo aplanado en un array. El cliente no compone nada.

        Se resuelve CONTRA LA BASE en cada llamada, no contra lo que porta el token. Un permiso revocado hace un minuto ya no aparece aca, aunque el access token siga siendo valido: leer del token daria una respuesta correcta al momento del login y falsa despues.

        Es insumo de UX, no un mecanismo de seguridad. Cada pantalla que el frontend oculte con esto esta igualmente protegida en el backend; si esta lista mintiera, lo unico que pasaria es que se veria un boton que despues responde 403.

        Exige contexto de trabajo. Sin el la respuesta es 403 missing-tenant-context, NUNCA 401: el interceptor del frontend borra el token ante cualquier 401 y arranca un bucle de login.
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectivePermissionsResponse"
          description: Permisos efectivos. Array vacio si la cuenta no tiene ninguno
            en este contexto
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o no hay contexto de trabajo seleccionado\
            \ (missing-tenant-context). Nunca 401"
      summary: Permisos efectivos en el contexto activo
      tags:
      - Mi cuenta
  /api/v1/memberships:
    post:
      description: |-
        Requiere colaborador:manage sobre el alcance pedido. La organizacion sale del contexto de trabajo activo y NO se manda en el cuerpo.

        No crea cuentas y no manda correos: vincula a alguien que ya se registro. Es una desviacion declarada de RF-M05-001/002 —el flujo de invitacion con aceptacion queda para una etapa posterior—, no el flujo definitivo.

        Si el email no tiene cuenta la respuesta es 404. Esa respuesta distingue emails registrados de los que no, asi que la ruta tiene rate limit propio —10 por minuto y por IP— y CADA intento fallido queda auditado en el tenant como MEMBERSHIP_ALTA_RECHAZADA, con el actor y la direccion. Un barrido de la base no pasa desapercibido.

        El motivo es obligatorio: es lo que responde, seis meses despues, por que esa persona tiene acceso a los datos del centro.
      operationId: createDirectMembership
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMembershipResponse"
          description: Vinculo creado. Location apunta al recurso en el modulo de
            organizacion
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el email, el rol o el motivo, o el rol no es un valor\
            \ legal"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo activo\
            \ (missing-tenant-context), o falta colaborador:manage sobre el alcance\
            \ pedido. Nunca 401"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ninguna cuenta tiene ese email, o la sede pedida no es de\
            \ la organizacion del contexto. Los dos casos responden igual"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Esa cuenta ya tiene un vinculo con ese alcance, vigente o\
            \ historico"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Se alcanzo el limite de intentos de la ruta. Retry-After dice
            en cuantos segundos reintentar
      summary: Vincular una cuenta existente con la organizacion
      tags:
      - Colaboradores
  /api/v1/organizations:
    post:
      description: |-
        Crea la organizacion, su primer consultorio y su suscripcion en una sola transaccion. Reservado a la administracion de plataforma.

        El primer consultorio se crea SIEMPRE, incluso por este camino: el contexto de trabajo es Organizacion + Consultorio, asi que un tenant sin ninguna sede no ofreceria ningun contexto seleccionable y quien entrara despues no tendria donde trabajar.

        Este NO es el camino del alta self-service. Esa crea ademas la cuenta y la membership del fundador en la misma transaccion, y la resuelve el modulo de identidad en 01.02.

        El header Idempotency-Key es obligatorio: identifica el intento, de modo que un reintento por timeout de red quede correlacionado en el log y en la auditoria en vez de parecer un alta distinta. En 01.01 el alta duplicada la cierra la unicidad del slug con 409 conflict, no un replay con 200: este camino administrativo no registra idempotencia porque no tiene propietario que registrar, y el registro de onboarding exige uno.
      operationId: createOrganization
      parameters:
      - description: "Identificador unico del intento, generado por el cliente. Reintentar\
          \ la misma alta debe reusar el mismo valor."
        example: 0f9d5f6e-1c2b-4a3d-9e8f-7a6b5c4d3e2f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: Organizacion creada. La cabecera Location apunta al recurso
            nuevo
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, o falta el header Idempotency-Key"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La operacion esta reservada a la administracion de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El plan indicado no existe o ya no es contratable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El slug ya pertenece a otra organizacion, o la clave de idempotencia\
            \ se reuso con otro contenido"
      summary: Alta administrativa de una organizacion
      tags:
      - Organizaciones
  /api/v1/organizations/{orgId}:
    get:
      description: "Devuelve el tenant con su estado operativo efectivo y la version\
        \ que hay que reenviar para editarlo. Requiere ser miembro vigente de esa\
        \ organizacion y que sea la del contexto activo. Una organizacion inexistente,\
        \ dada de baja o de otro tenant se responden las tres igual con 404: distinguirlas\
        \ permitiria enumerar los clientes del SaaS probando ids."
      operationId: getOrganization
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: Organizacion encontrada
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, esta dada de baja, o pertenece a otro tenant. Los\
            \ tres casos se responden igual"
      summary: Datos de una organizacion
      tags:
      - Organizaciones
    patch:
      description: |-
        Actualiza nombre y zona horaria. Requiere administrar esa organizacion.

        El slug no se puede cambiar: se usa en URLs y en soporte, y renombrarlo rompe enlaces. Cambiar de identificador es crear otro tenant, no editar este.

        La version enviada se compara antes de mutar. Si quedo vieja porque alguien mas edito mientras tanto, la respuesta es 409 conflict y hay que releer y reintentar: es preferible a pisar en silencio el cambio de otro.

        Los campos omitidos o vacios se dejan como estan; no los borra.
      operationId: updateOrganization
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: "Organizacion actualizada, con la version nueva"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, o falta la version"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El actor esta en el tenant correcto pero no lo administra
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, esta dada de baja, o pertenece a otro tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La version enviada quedo vieja: releer y reintentar"
      summary: Editar los datos mutables de la organizacion
      tags:
      - Organizaciones
  /api/v1/organizations/{orgId}/audit-events:
    get:
      description: |-
        Requiere auditoria:read. Hay que elegir EXACTAMENTE UNO de los tres filtros; combinarlos o no mandar ninguno responde 400.

        1. entityType + entityId: historial de una entidad (RF-M24-002).
        2. actorAccountId: actividad de una persona dentro del tenant (RF-M24-003).
        3. from + to: ventana temporal (RF-M24-004). El rango no puede exceder los 90 dias, y to tiene que ser posterior a from.

        size se recorta a 100 por request: un cliente que pide diez mil filas esta mal configurado, no atacando, y devolverle cien le sirve mas que un error.

        Quien tiene el permiso con alcance de sede ve solo su sede. Ese recorte lo decide el evaluador de permisos, no un parametro.
      operationId: listAuditEvents
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Tipo de entidad. Va junto con entityId
        example: MEMBERSHIP
        in: query
        name: entityType
        required: false
        schema:
          type: string
      - description: Identificador de la entidad. Va junto con entityType
        example: 42
        in: query
        name: entityId
        required: false
        schema:
          type: integer
          format: int64
      - description: Cuenta cuya actividad se consulta
        example: 18
        in: query
        name: actorAccountId
        required: false
        schema:
          type: integer
          format: int64
      - description: Inicio de la ventana. Va junto con to
        example: 2026-08-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: Fin de la ventana. Va junto con from. Como maximo 90 dias despues
          de from
        example: 2026-08-23T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Elementos por pagina. Se recorta a 100
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPageResponse"
          description: Pagina de hechos que cumplen el filtro
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No se eligio exactamente un filtro, el rango esta invertido,\
            \ o excede los 90 dias"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto de trabajo activo, o sin auditoria:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La organizacion no existe o no es la del contexto del actor
      summary: Hechos registrados en la auditoria de la organizacion
      tags:
      - Auditoria
  /api/v1/organizations/{orgId}/consultorios:
    get:
      description: "Listado paginado de las sedes del tenant. Requiere ser miembro\
        \ vigente de esa organizacion, y NO consultorio:manage: es la lectura que\
        \ necesita el selector de contexto de trabajo, asi que restringirla dejaria\
        \ a un profesional sin poder elegir sede. El parametro estado es opcional\
        \ y su valor por defecto, ACTIVO, conserva el comportamiento historico del\
        \ endpoint: un cliente que no lo manda ve exactamente lo mismo que antes.\
        \ El tamano de pagina se acota a 100: pedir mas devuelve ese maximo, no un\
        \ error."
      operationId: listOrganizationConsultorios
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Que sedes devolver. ACTIVO son las vigentes, INACTIVO las dadas\
          \ de baja, TODOS ambas. Una sede dada de baja conserva su historia y sigue\
          \ siendo consultable, pero hay que pedirla explicitamente para que no aparezca\
          \ por descuido en el selector de contexto."
        example: ACTIVO
        in: query
        name: estado
        required: false
        schema:
          type: string
          default: ACTIVO
          enum:
          - ACTIVO
          - INACTIVO
          - TODOS
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Elementos por pagina, acotado a 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioPageResponse"
          description: Pagina de sedes. Contenido vacio si la pagina quedo fuera de
            rango
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El valor de estado no pertenece al catalogo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No hay sesion autenticada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No existe, esta dada de baja, o pertenece a otro tenant"
      summary: Sedes de la organizacion
      tags:
      - Organizaciones
    post:
      description: |-
        Crea una sede nueva en la organizacion. La PRIMERA sede no se crea por aca: la crea el alta de la organizacion en la misma transaccion, porque el contexto de trabajo es Organizacion + Consultorio y un tenant sin sede no ofreceria ningun contexto seleccionable.

        Exige consultorio:manage con alcance ORGANIZACION. Un CONSULTORIO_ADMIN no puede crear sedes, y no hace falta ninguna regla especial para impedirlo: un alta no tiene sede objetivo —todavia no existe— asi que la interseccion con un alcance de una sola sede es vacia.

        Pasa por el limite MAX_CONSULTORIOS del plan contratado. El header Idempotency-Key es obligatorio: reintentar con la misma clave y el mismo cuerpo devuelve la misma sede en vez de crear una segunda, que es lo que cubre el reintento despues de un timeout de red.

        El primer box y el horario general de la sede NO se crean aca. Box es del modulo de espacios (AKINE-02.02) y el horario general depende de la disponibilidad profesional, que llega despues.
      operationId: createConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Identificador unico del intento, generado por el cliente. Reintentar\
          \ la misma alta debe reusar el mismo valor."
        example: 0f9d5f6e-1c2b-4a3d-9e8f-7a6b5c4d3e2f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultorioRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: "Sede creada, o la misma sede si es un reintento con la misma\
            \ clave de idempotencia. La cabecera Location apunta al recurso"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Campos invalidos, zona horaria que no es un identificador\
            \ IANA, o falta el header Idempotency-Key"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage con alcance organizacion, o no hay\
            \ contexto de trabajo seleccionado"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Nombre repetido entre las sedes vigentes (consultorio-name-taken),\
            \ limite del plan alcanzado (plan-limit-exceeded), suscripcion suspendida\
            \ (subscription-suspended), o clave de idempotencia reusada con otro contenido\
            \ (idempotency-key-conflict)"
      summary: Alta de una sede adicional
      tags:
      - Consultorios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}:
    get:
      description: |-
        Devuelve la sede con su configuracion y la version que hay que reenviar para editarla.

        Devuelve tambien las sedes INACTIVAS, con 200 y no con 404: RF-M03-004 exige que los historicos previos permanezcan disponibles. Lo que una sede inactiva rechaza son las operaciones nuevas, y eso se responde con 409.

        Exige consultorio:manage sobre ESA sede, asi que un CONSULTORIO_ADMIN puede leer la suya y no las demas. Una sede de otro tenant responde 404, igual que una inexistente.
      operationId: getConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: "La sede, activa o dada de baja"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No existe o pertenece a otro tenant
      summary: Datos de una sede
      tags:
      - Consultorios
    patch:
      description: |-
        Cambia nombre, zona horaria, intervalo de agenda y datos institucionales (RF-M03-003). Los campos omitidos no se tocan; para borrar un dato institucional se manda cadena vacia.

        version es obligatoria y se compara antes de mutar: si quedo vieja, la respuesta es 409 concurrent-modification y el cliente recarga. Sin eso, dos ediciones simultaneas se pisan y el segundo en guardar borra el cambio del primero sin que nadie se entere.

        Una sede INACTIVA no se puede editar: 409 consultorio-inactive.

        Cambiar la zona horaria NO reinterpreta el pasado. Los instantes ya registrados son UTC y no se mueven; cambia como se proyectan de aca en adelante, y la pantalla tiene que decirlo con esas palabras.
      operationId: updateConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsultorioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: Sede actualizada
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Campos invalidos o zona horaria que no es un identificador
            IANA
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage sobre esa sede, o no hay contexto"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No existe o pertenece a otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sede dada de baja (consultorio-inactive), nombre repetido\
            \ (consultorio-name-taken) o version desactualizada (concurrent-modification)"
      summary: Edicion de una sede
      tags:
      - Consultorios
  /api/v1/organizations/{orgId}/consultorios/{consultorioId}/deactivate:
    post:
      description: |-
        Da de baja la sede con motivo obligatorio (RF-M03-004). NO borra nada: la sede queda INACTIVA, sigue siendo legible por id y conserva intacta toda su historia. No hay reactivacion: ningun RF de M03 la pide.

        Dos rechazos que hay que mostrar con su mensaje real y no con un generico:

        - last-consultorio-required: es la ultima sede activa del tenant. Sin ninguna sede activa nadie podria canjear contexto y la organizacion quedaria operativamente muerta, recuperable solo con intervencion manual. Es una restriccion agregada al comportamiento del requerimiento, decidida explicitamente.
        - consultorio-has-active-references: reservado. Hoy no lo emite nadie; lo emitira el modulo de agenda cuando existan turnos futuros sobre la sede.

        Exige consultorio:manage con alcance ORGANIZACION, o sea que hoy solo un ORG_ADMIN puede dar de baja una sede. Es mas estricto que la lectura literal de la matriz de permisos, por el mismo criterio que impide que alguien se quite a si mismo su ultimo rol administrativo: nadie destruye el alcance desde el que opera. Queda como enmienda pendiente de confirmacion.
      operationId: deactivateConsultorio
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador de la sede
        example: 1
        in: path
        name: consultorioId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateConsultorioRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultorioResponse"
          description: Sede dada de baja
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo de la baja
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta consultorio:manage con alcance organizacion, o no hay\
            \ contexto de trabajo seleccionado"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No existe o pertenece a otro tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Es la ultima sede activa (last-consultorio-required), ya estaba\
            \ dada de baja (consultorio-already-inactive), o tiene referencias vigentes\
            \ (consultorio-has-active-references)"
      summary: Baja logica de una sede
      tags:
      - Consultorios
  /api/v1/organizations/{orgId}/memberships:
    get:
      description: |-
        Requiere colaborador:read. Devuelve TAMBIEN los vinculos suspendidos y revocados: quien administra tiene que poder ver quien estuvo, quien lo desvinculo y por que. Para eso existe la baja logica. El cliente distingue por el campo estado, no por ausencia.

        size se acota a 100 por request. Pedir 500 devuelve 100, no un error.
      operationId: listMemberships
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Elementos por pagina. Se acota a 100
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPageResponse"
          description: Pagina de colaboradores
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, no hay contexto de trabajo activo,\
            \ o falta colaborador:read. Nunca 401"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La organizacion no existe o no es la del contexto del actor
      summary: Colaboradores de la organizacion
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}:
    get:
      description: "Requiere colaborador:read. El vinculo se busca por (id, organizacion)\
        \ y nunca por id pelado: uno de otro tenant responde 404 igual que uno inexistente."
      operationId: getMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: El vinculo pedido
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Un colaborador de la organizacion
      tags:
      - Colaboradores
    patch:
      description: |-
        Requiere colaborador:manage y motivo obligatorio. Los dos cambios se auditan por separado: mover a alguien de sede y cambiar lo que puede hacer son dos decisiones distintas.

        changeScope existe porque null es un valor legitimo de consultorioId (significa alcance de toda la organizacion): sin la bandera, 'no tocar la sede' y 'ampliarla a la organizacion' serian el mismo request.

        Solo opera sobre vinculos ACTIVA. Sobre uno suspendido o revocado responde 409 membership-not-active, no 404: el administrador ve esa fila en su propio listado y decirle 'no existe' no le explicaria nada.

        Bajar de rol al ultimo administrador se rechaza con 409 igual que revocarlo: el tenant quedaria sin nadie que pueda repararlo.
      operationId: changeMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMembershipRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo actualizado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo, o el rol no existe en el catalogo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, sin colaborador:manage, o\
            \ el vinculo es el del fundador y el actor no es el fundador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo o la sede destino no existen, o son de otra organizacion"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo no esta ACTIVA (membership-not-active), dejaria\
            \ al tenant sin administradores (last-admin-required), el actor se quitaria\
            \ su ultimo rol administrativo (self-revoke-not-allowed), o otro usuario\
            \ modifico la fila (concurrent-modification)"
      summary: Cambiar el rol y/o el alcance de un colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/grants:
    get:
      description: |-
        Requiere colaborador:read. Devuelve solo los vigentes: los dados de baja quedan en la fila para la auditoria, no para esta pantalla.

        Es lo que alimenta la lista desde la que se revoca un permiso adicional. Sin este endpoint el cliente no tendria de donde sacar los codigos a dar de baja.
      operationId: listMembershipGrants
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipGrantResponse"
          description: Permisos adicionales vigentes. Lista vacia si no tiene ninguno
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:read"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Permisos adicionales vigentes de un colaborador
      tags:
      - Colaboradores
    post:
      description: |-
        Requiere colaborador:manage y motivo obligatorio. El catalogo de codigos otorgables es cerrado: un permiso que existe pero no es otorgable en esta fase se rechaza con 400, no se escribe.

        Otorgar dos veces el mismo permiso responde 409 grant-already-active, y esa decision la toma la clave unica de la base y no un chequeo previo: dos administradores otorgando a la vez leerian los dos que no existe.
      operationId: assignMembershipGrant
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignGrantRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipGrantResponse"
          description: Permiso adicional otorgado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo, o el codigo no existe o no es otorgable"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Ese permiso adicional ya esta vigente sobre el vinculo, o\
            \ el vinculo no esta ACTIVA"
      summary: Otorgar un permiso adicional a un colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/grants/{permissionCode}:
    delete:
      description: |-
        Requiere colaborador:manage. Baja LOGICA: la fila queda con su autor y su motivo.

        Es idempotente hacia el mismo resultado: si el permiso ya no esta vigente responde 204 igual. Un 409 obligaria al cliente a distinguir dos situaciones que para el usuario son la misma: no lo tenia, y se lo acaban de quitar.

        El motivo va como parametro y no en el cuerpo porque un DELETE con cuerpo no esta garantizado de punta a punta por proxies y clientes HTTP.
      operationId: revokeMembershipGrant
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      - description: Codigo del permiso a dar de baja
        example: auditoria:read-clinica
        in: path
        name: permissionCode
        required: true
        schema:
          type: string
      - description: Motivo declarado de la baja. Queda en la auditoria
        in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "204":
          description: "Permiso adicional dado de baja, o ya no estaba vigente"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El codigo de permiso no existe en el catalogo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
      summary: Dar de baja un permiso adicional
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/reactivate:
    post:
      description: "Requiere colaborador:manage. Solo aplica sobre vinculos SUSPENDIDA:\
        \ uno revocado es terminal y responde 409. Devolverle el acceso a alguien\
        \ es tan auditable como quitarselo, asi que el motivo se exige igual."
      operationId: reactivateMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo reactivado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, o sin colaborador:manage"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no estaba SUSPENDIDA
      summary: Devolver a ACTIVA un vinculo suspendido
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/revoke:
    post:
      description: |-
        Requiere colaborador:manage y motivo obligatorio. Estado TERMINAL y sin borrado (RN-M05-003): la fila queda con quien revoco y por que, porque los historicos que la referencian tienen que seguir siendo legibles.

        Es la operacion con los tres invariantes a la vez: ultimo administrador, self-revoke y proteccion del fundador. Los dos primeros responden 409; el tercero 403, porque es una restriccion sobre QUIEN puede hacerlo y no sobre el estado en que quedaria el tenant.

        No es un DELETE porque no borra nada, y exige cuerpo porque el motivo es obligatorio.
      operationId: revokeMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo revocado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, sin colaborador:manage, o\
            \ es el vinculo del fundador y el actor no es el fundador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo ya estaba revocado, dejaria al tenant sin administradores,\
            \ o el actor se quitaria su ultimo rol administrativo"
      summary: Revocar el vinculo de un colaborador
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/memberships/{membershipId}/suspend:
    post:
      description: "Requiere colaborador:manage y motivo obligatorio. Suspender saca\
        \ a la persona igual que revocar mientras dura, asi que pasa por los mismos\
        \ invariantes: no puede dejar al tenant sin administradores ni ser el ultimo\
        \ rol administrativo del propio actor. Tratarlo como mas suave seria dejar\
        \ la misma puerta abierta con otro nombre."
      operationId: suspendMembership
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: Identificador del vinculo
        example: 42
        in: path
        name: membershipId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Vinculo suspendido
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, sin contexto activo, sin colaborador:manage, o\
            \ es el vinculo del fundador"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El vinculo no existe o es de otra organizacion
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El vinculo no esta ACTIVA, o la suspension dejaria al tenant\
            \ sin administradores"
      summary: Suspender temporalmente un vinculo
      tags:
      - Colaboradores
  /api/v1/organizations/{orgId}/subscription:
    get:
      description: |-
        Devuelve el plan contratado, el estado de la suscripcion, el consumo actual de cada limite y los estados a los que se puede transicionar desde el actual.

        Los allowedTargets existen para que el frontend no replique la maquina de estados: pinta las acciones que el backend dice que existen. Una copia de las reglas en el cliente obligaria a desplegar los dos lados a la vez para no ofrecer botones que fallan.

        Requiere administrar esa organizacion. Una organizacion inexistente o de otro tenant se responden igual con 404.
      operationId: getSubscription
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
          description: Suscripcion vigente con su consumo de limites
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El actor esta en el tenant correcto pero no lo administra
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
      summary: Suscripcion vigente del tenant
      tags:
      - Suscripciones
  /api/v1/organizations/{orgId}/subscription/plan-changes:
    post:
      description: |-
        Contrata otro plan y lo registra en el historico. Reservado a la administracion de plataforma.

        Un downgrade se acepta aunque el uso actual ya supere los limites del plan nuevo, y no toca un solo dato: no borra, no desactiva y no marca nada como invalido. Lo que existe sigue operativo y consultable. Lo unico que cambia es el futuro: la proxima alta que exceda el limite nuevo se rechaza. Los limites ya excedidos vuelven en warnings para que el cliente pueda ordenarse antes de chocarse, no como un rechazo.

        Reintentar un cambio ya aplicado responde applied=false y no genera una segunda fila de historico ni un segundo evento: un reintento no puede producir un segundo efecto.

        Requiere la suscripcion ACTIVA (409 subscription-suspended si no lo esta) y la version vigente (409 conflict si quedo vieja).
      operationId: changeSubscriptionPlan
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeResponse"
          description: "Plan cambiado, o ya vigente (applied=false). warnings trae\
            \ los limites que el uso actual ya excede: son avisos, no rechazos"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el codigo de plan o la version esperada
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La operacion esta reservada a la administracion de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no es accesible, o el plan no es contratable"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: subscription-suspended si la suscripcion no esta ACTIVA; conflict
            si la version enviada quedo vieja
      summary: Cambiar el plan contratado
      tags:
      - Suscripciones
  /api/v1/organizations/{orgId}/subscription/transitions:
    get:
      description: "Listado paginado de los cambios de estado y de plan, del hecho\
        \ mas reciente al mas viejo. Es append-only: responde 'que le paso a este\
        \ centro y cuando' meses despues, y por eso ninguna fila se edita ni se borra.\
        \ La primera fila de toda suscripcion tiene fromStatus ausente y significa\
        \ el alta. Requiere administrar esa organizacion. El tamano de pagina se acota\
        \ a 100: pedir mas devuelve ese maximo, no un error."
      operationId: listSubscriptionTransitions
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Numero de pagina, base cero"
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Elementos por pagina, acotado a 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionTransitionPageResponse"
          description: "Pagina del historico, del hecho mas reciente al mas viejo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El actor esta en el tenant correcto pero no lo administra
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
      summary: Historico de la suscripcion
      tags:
      - Suscripciones
    post:
      description: |-
        Registra el cambio de estado y lo agrega al historico. Reservado a la administracion de plataforma: suspender o cancelar un centro es una decision comercial, no una operacion que el propio centro se autoaplique.

        Se valida todo antes de escribir nada. Una transicion rechazada no deja la suscripcion movida, ni una fila de historico, ni un evento de auditoria que sugiera que algo paso.

        Enviar expectedStatus hace que la operacion se rechace con 409 si el estado real ya no es el que el actor creia, en vez de aplicarse sobre una premisa falsa. El motivo es obligatorio al suspender y al cancelar; omitirlo ahi es 400.

        Un salto que la maquina de estados no admite —incluido repetir el estado actual— es 409 invalid-subscription-transition.
      operationId: createSubscriptionTransition
      parameters:
      - description: Identificador de la organizacion
        example: 1
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionTransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
          description: Transicion aplicada y registrada en el historico
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el estado destino, o falta el motivo donde es obligatorio"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La operacion esta reservada a la administracion de plataforma
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La organizacion no existe, esta dada de baja, o es de otro\
            \ tenant"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: invalid-subscription-transition si la maquina de estados no
            admite el salto; conflict si expectedStatus no coincide con el real
      summary: Aplicar una transicion de estado a la suscripcion
      tags:
      - Suscripciones
  /api/v1/plans:
    get:
      description: "Devuelve los planes vigentes con sus limites cuantitativos y las\
        \ funcionalidades que habilitan. Es la fuente de la pantalla de contratacion\
        \ y de upgrade: el frontend no mantiene su propia copia del catalogo, porque\
        \ una copia desactualizada ofreceria planes que el backend ya no acepta. Los\
        \ planes se referencian siempre por su codigo, nunca por id."
      operationId: listPlans
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanResponse"
          description: Catalogo vigente. Lista vacia si no hay planes contratables
      summary: Catalogo de planes contratables
      tags:
      - Planes
  /api/v1/platform/organizations/{orgId}/support-access:
    get:
      description: |-
        Reservado a la administracion de plataforma. Devuelve los accesos vigentes; los cerrados quedan en la fila para la auditoria.

        La misma informacion le llega al tenant por SU propia auditoria, que es donde tiene sentido para el: un cliente tiene derecho a ver quien entro a sus datos y por que, sin pedirselo a nadie.
      operationId: listSupportAccess
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportAccessResponse"
          description: Accesos de soporte vigentes. Lista vacia si no hay ninguno
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o la cuenta no administra la plataforma.\
            \ Nunca 401 desde un endpoint de negocio"
      summary: Accesos de soporte vigentes sobre una organizacion
      tags:
      - Plataforma
    post:
      description: |-
        Reservado a la administracion de plataforma. Motivo obligatorio: sin motivo no hay soporte, hay acceso a datos de salud ajenos.

        La duracion se pide en minutos y no puede exceder los 240 (cuatro horas), que es tambien el default. El tope no es un valor sugerido: dejar que quien pide el acceso elija su propia duracion convertiria 'acotado en tiempo' en 'acotado si el que entra quiere'.

        El otorgamiento queda en la auditoria DEL TENANT, no solo en la de plataforma. Cada operacion que despues se ampare en este acceso se audita por separado como SUPPORT_ACCESS_USED.
      operationId: grantSupportAccess
      parameters:
      - description: Identificador de la organizacion
        example: 7
        in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantSupportAccessRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessResponse"
          description: Acceso de soporte concedido
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Falta el motivo, o la duracion es invalida o excede el maximo"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La organizacion no existe o esta dada de baja
      summary: Conceder acceso de soporte sobre una organizacion
      tags:
      - Plataforma
  /api/v1/platform/roles:
    get:
      description: |-
        Reservado a la administracion de plataforma. Devuelve los vigentes; los revocados quedan en la fila para la auditoria, no en este listado.

        No hay paginado: la cantidad de administradores de plataforma se cuenta con los dedos de una mano, y si algun dia no fuera asi, eso seria el problema.
      operationId: listPlatformRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformRoleResponse"
          description: Roles de plataforma vigentes
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No hay sesion autenticada, o la cuenta no administra la plataforma.\
            \ Nunca 401"
      summary: Roles de plataforma vigentes
      tags:
      - Plataforma
    post:
      description: |-
        Reservado a la administracion de plataforma. Motivo obligatorio: es el permiso mas alto del sistema.

        La existencia de la cuenta NO se verifica: cuenta es propiedad del modulo de identidad y este modulo no puede consultarla. Un accountId inexistente falla contra la clave foranea y se responde como una solicitud invalida.

        Otorgarlo dos veces responde 409: dos administradores operando a la vez tienen que enterarse de que el otro llego primero.
      operationId: grantPlatformRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPlatformRoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformRoleResponse"
          description: Rol de plataforma otorgado
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el motivo o la cuenta destino
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Esa cuenta ya tiene el rol de plataforma vigente
      summary: Otorgar el rol de plataforma a una cuenta
      tags:
      - Plataforma
  /api/v1/platform/roles/{platformRoleId}:
    delete:
      description: |-
        Reservado a la administracion de plataforma. Baja LOGICA: la fila queda con su autor y su motivo.

        No impide quedarse sin ningun administrador de plataforma, y es deliberado: un invariante aca impediria revocar de urgencia una cuenta comprometida, que es el caso en el que revocar mas importa. El rescate es el seed de migracion.

        El motivo va como parametro y no en el cuerpo porque un DELETE con cuerpo no esta garantizado de punta a punta por proxies y clientes HTTP.
      operationId: revokePlatformRole
      parameters:
      - description: Identificador del otorgamiento
        example: 2
        in: path
        name: platformRoleId
        required: true
        schema:
          type: integer
          format: int64
      - description: Motivo declarado de la revocacion. Queda en la auditoria
        in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Rol de plataforma revocado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El rol no existe o ya estaba revocado
      summary: Revocar un rol de plataforma
      tags:
      - Plataforma
  /api/v1/platform/support-access/{supportAccessId}:
    delete:
      description: |-
        Reservado a la administracion de plataforma. No borra: cierra. Que alguien haya entrado a un tenant y por que tiene que seguir siendo legible despues.

        Un acceso inexistente o ya cerrado responde 404: para quien pregunta, los dos casos son el mismo.
      operationId: revokeSupportAccess
      parameters:
      - description: Identificador del acceso de soporte
        example: 5
        in: path
        name: supportAccessId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Acceso de soporte cerrado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Sin sesion, o la cuenta no administra la plataforma"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El acceso no existe o ya estaba cerrado
      summary: Cerrar un acceso de soporte antes de su vencimiento
      tags:
      - Plataforma
  /api/v1/version:
    get:
      description: Devuelve la identidad tecnica del backend en ejecucion y la version
        SemVer del contrato OpenAPI que publica. El frontend la usa para verificar
        que el cliente generado corresponde a la version desplegada.
      operationId: version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
          description: OK
      summary: Version del backend y del contrato
      tags:
      - Platform
components:
  schemas:
    AcceptedResponse:
      type: object
      description: "Acuse uniforme: no revela si la cuenta existe"
      properties:
        message:
          type: string
          description: Mensaje uniforme para mostrarle a la persona
          example: "Si el email corresponde a una cuenta, vas a recibir un correo\
            \ con las instrucciones."
    AccessTokenResponse:
      type: object
      description: "Access token de vida corta, para el header Authorization: Bearer"
      properties:
        accessToken:
          type: string
          description: "JWT compacto. Se guarda EN MEMORIA, nunca en localStorage"
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI0MiJ9.firma
        consultorioId:
          type: integer
          format: int64
          description: "Consultorio del contexto, null si el alcance es pre_context"
          example: 1
        expiresIn:
          type: integer
          format: int64
          description: Segundos de vida restantes. El cliente programa el refresh
            con este valor y no leyendo el token
          example: 600
        organizationId:
          type: integer
          format: int64
          description: "Organizacion del contexto, null si el alcance es pre_context"
          example: 1
        roleCode:
          type: string
          description: "Rol de la membership al momento de emitir. Sirve para dibujar\
            \ el menu; NO autoriza nada: el backend revalida en cada request"
          example: ORG_ADMIN
        scope:
          type: string
          description: "Alcance del token: pre_context (recien autenticado, sin contexto\
            \ elegido) o context (acotado a organizacion y consultorio)"
          enum:
          - pre_context
          - context
          example: pre_context
        tokenType:
          type: string
          description: Esquema de autorizacion
          example: Bearer
    AccountResponse:
      type: object
      description: Cuenta despues de la transicion administrativa
      properties:
        blockedAt:
          type: string
          format: date-time
          description: "Momento del bloqueo, null si no esta bloqueada"
          example: 2026-08-23T14:05:00Z
        email:
          type: string
          description: Direccion de correo tal como se registro
          example: ana.perez@ejemplo.test
        firstName:
          type: string
          description: Nombre de la persona
          example: Ana
        id:
          type: integer
          format: int64
          description: Identificador de la cuenta
          example: 42
        lastName:
          type: string
          description: Apellido de la persona
          example: Perez
        status:
          type: string
          description: Estado de la cuenta despues de la transicion
          enum:
          - PENDIENTE_ACTIVACION
          - ACTIVA
          - BLOQUEADA
          - DESACTIVADA
          example: BLOQUEADA
        updatedAt:
          type: string
          format: date-time
          description: Ultima modificacion de la cuenta
          example: 2026-08-23T14:05:00Z
    AccountStateChangeRequest:
      type: object
      description: Motivo auditable de la transicion de estado de la cuenta
      properties:
        reason:
          type: string
          description: Por que se ejecuta la transicion. Queda en la auditoria
          example: Baja del profesional por fin de contrato
          maxLength: 500
          minLength: 0
      required:
      - reason
    ActivateAccountRequest:
      type: object
      description: "Token del enlace de activacion, con la contrasena si hace falta\
        \ fijarla"
      properties:
        password:
          type: string
          description: Contrasena a fijar. Obligatoria solo si la cuenta todavia no
            tiene credencial (invitacion); se ignora si ya la tiene
          example: una-contrasena-larga-y-unica
          maxLength: 256
          minLength: 0
        token:
          type: string
          description: Valor del enlace recibido por correo
          example: 9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a
          maxLength: 256
          minLength: 0
      required:
      - token
    AssignGrantRequest:
      type: object
      description: Permiso adicional a otorgar sobre un vinculo
      properties:
        permissionCode:
          type: string
          description: "Codigo del permiso, del catalogo de la matriz"
          example: auditoria:read-clinica
          maxLength: 60
          minLength: 0
        reason:
          type: string
          description: Motivo declarado del otorgamiento. Queda en la auditoria
          example: Revision de historia clinica por reclamo del financiador
          maxLength: 500
          minLength: 0
        validUntil:
          type: string
          format: date-time
          description: "Vencimiento del permiso adicional. Sin el, rige hasta que\
            \ se de de baja"
          example: 2026-12-31T23:59:59Z
      required:
      - permissionCode
      - reason
    AuditEventPageResponse:
      type: object
      description: "Pagina del registro de auditoria, del hecho mas reciente al mas\
        \ viejo"
      properties:
        content:
          type: array
          description: Hechos de esta pagina
          items:
            $ref: "#/components/schemas/AuditEventResponse"
        page:
          type: integer
          format: int32
          description: "Numero de pagina devuelta, base cero"
          example: 0
        size:
          type: integer
          format: int32
          description: Cantidad de elementos por pagina. Nunca mayor a 100
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Cantidad total de hechos que cumplen el filtro
          example: 412
        totalPages:
          type: integer
          format: int32
          description: Cantidad total de paginas disponibles
          example: 21
    AuditEventResponse:
      type: object
      description: Hecho registrado en la auditoria de la organizacion
      properties:
        actorAccountId:
          type: integer
          format: int64
          description: Cuenta que ejecuto la operacion
          example: 18
        consultorioId:
          type: integer
          format: int64
          description: "Sede sobre la que ocurrio, si aplica"
          example: 3
        correlationId:
          type: string
          description: Identificador que agrupa los hechos de un mismo request
          example: 9f3c1d2a-4b5e-4a6f-8c7d-0e1f2a3b4c5d
        details:
          type: object
          additionalProperties:
            type: string
          description: "Datos adicionales del hecho, siempre como texto plano"
        entityId:
          type: integer
          format: int64
          description: Identificador de la entidad afectada
          example: 42
        entityType:
          type: string
          description: Tipo de entidad afectada
          example: MEMBERSHIP
        eventType:
          type: string
          description: Tipo de hecho
          example: MEMBERSHIP_ROLE_CHANGED
        id:
          type: integer
          format: int64
          description: Identificador del hecho
          example: 1024
        newState:
          type: string
          description: "Estado nuevo, si el hecho fue una transicion"
          example: CONSULTORIO_ADMIN
        occurredAt:
          type: string
          format: date-time
          description: Momento en que ocurrio
        organizationId:
          type: integer
          format: int64
          description: "Organizacion sobre la que ocurrio, o null si es de plataforma"
          example: 7
        previousState:
          type: string
          description: "Estado anterior, si el hecho fue una transicion"
          example: PROFESIONAL
        reason:
          type: string
          description: Motivo declarado por quien ejecuto la operacion
    AuthorizedContextResponse:
      type: object
      description: Contexto de trabajo habilitado para la cuenta autenticada
      properties:
        consultorioId:
          type: integer
          format: int64
          description: Identificador del consultorio
          example: 1
        consultorioName:
          type: string
          description: Nombre del consultorio
          example: Sede Central
        organizationId:
          type: integer
          format: int64
          description: Identificador de la organizacion
          example: 1
        organizationName:
          type: string
          description: Nombre de la organizacion
          example: Centro Kinesico Belgrano
    ChangeMembershipRequest:
      type: object
      description: Cambio de rol y/o de alcance de un vinculo
      properties:
        changeScope:
          type: boolean
          default: false
          description: "Indica que consultorioId debe aplicarse. En false la sede\
            \ no se toca, sea cual sea el valor de consultorioId"
          example: false
        consultorioId:
          type: integer
          format: int64
          description: "Sede destino cuando changeScope es true. null significa alcance\
            \ de toda la organizacion, no 'sin cambio'"
          example: 3
        reason:
          type: string
          description: Motivo declarado del cambio. Queda en la auditoria
          example: Promocion a responsable de la sede Centro
          maxLength: 500
          minLength: 0
        roleCode:
          type: string
          description: "Rol destino, o null para no tocarlo. PLATFORM_ADMIN no es\
            \ un rol de vinculo y se rechaza con 400"
          enum:
          - ORG_ADMIN
          - CONSULTORIO_ADMIN
          - PROFESIONAL
          - ADMINISTRATIVO
          example: CONSULTORIO_ADMIN
      required:
      - reason
    ClosedSessionsResponse:
      type: object
      description: Resultado del cierre masivo de sesiones de la propia cuenta
      properties:
        closedSessions:
          type: integer
          format: int32
          description: Sesiones vivas que se revocaron
          example: 3
    ConsultorioPageResponse:
      type: object
      description: "Pagina de sedes de la organizacion, segun el filtro de estado\
        \ pedido"
      properties:
        content:
          type: array
          description: Sedes de esta pagina
          items:
            $ref: "#/components/schemas/ConsultorioResponse"
        page:
          type: integer
          format: int32
          description: "Numero de pagina devuelta, base cero"
          example: 0
        size:
          type: integer
          format: int32
          description: Cantidad de elementos por pagina
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Cantidad total de sedes que cumplen el filtro
          example: 3
        totalPages:
          type: integer
          format: int32
          description: Cantidad total de paginas disponibles
          example: 1
    ConsultorioResponse:
      type: object
      description: Sede (consultorio) de la organizacion
      properties:
        active:
          type: boolean
          description: false cuando la sede fue dada de baja logica
          example: true
        addressLine:
          type: string
          description: "Direccion, si se cargo"
          example: "Av. Colon 1234, Cordoba"
        contactEmail:
          type: string
          description: "Email de contacto, si se cargo"
          example: sede@ejemplo.test
        deactivationReason:
          type: string
          description: Motivo declarado de la baja. null si la sede esta activa
          example: Cierre de la sucursal
        deletedAt:
          type: string
          format: date-time
          description: Instante UTC de la baja logica. null si la sede esta activa
        estado:
          type: string
          description: "Estado derivado de la sede: ACTIVO o INACTIVO"
          example: ACTIVO
        id:
          type: integer
          format: int64
          description: Identificador del consultorio
          example: 1
        legalName:
          type: string
          description: "Razon social, si se cargo"
          example: Centro Kinesico SRL
        name:
          type: string
          description: Nombre de la sede. Unico entre las sedes vigentes del tenant
          example: Sede Central
        organizationId:
          type: integer
          format: int64
          description: Organizacion a la que pertenece
          example: 1
        phone:
          type: string
          description: "Telefono de contacto, si se cargo"
          example: +54 351 555-0000
        slotMinutes:
          type: integer
          format: int32
          description: "Intervalo por defecto de la agenda, en minutos"
          example: 30
        taxId:
          type: string
          description: "Identificacion fiscal, si se cargo"
          example: 30-12345678-9
        timezone:
          type: string
          description: "Zona horaria IANA efectiva de la sede. Es la que rige el dia\
            \ operativo y la agenda, no la de la organizacion"
          example: America/Argentina/Cordoba
        version:
          type: integer
          format: int64
          description: "Version para el control de concurrencia optimista. Hay que\
            \ reenviarla al editar: sin ella dos ediciones simultaneas se pisan"
          example: 0
    CreateConsultorioRequest:
      type: object
      description: Datos para dar de alta una sede adicional
      properties:
        addressLine:
          type: string
          description: Direccion
          maxLength: 240
          minLength: 0
        contactEmail:
          type: string
          format: email
          description: Email de contacto
          maxLength: 160
          minLength: 0
        legalName:
          type: string
          description: Razon social
          maxLength: 200
          minLength: 0
        name:
          type: string
          description: "Nombre de la sede. Unico entre las sedes VIGENTES del tenant:\
            \ el nombre de una sede dada de baja se puede reusar"
          example: Sede Norte
          maxLength: 160
          minLength: 0
        phone:
          type: string
          description: Telefono de contacto
          maxLength: 40
          minLength: 0
        slotMinutes:
          type: integer
          format: int32
          description: "Intervalo por defecto de la agenda, en minutos. Si se omite,\
            \ 30"
          example: 30
          maximum: 480
          minimum: 5
        taxId:
          type: string
