          minLength: 0
        nombre:
          type: string
          description: "Razon social o nombre visible. Unico entre los vigentes de\
            \ la organizacion. SI se puede cambiar: renombrar es esto"
          example: OSDE Binario
          maxLength: 160
          minLength: 0
        observaciones:
          type: string
          description: Notas administrativas. NUNCA contenido clinico ni datos de
            pacientes
          maxLength: 500
          minLength: 0
        telefonoContacto:
          type: string
          description: Telefono administrativo del financiador
          maxLength: 40
          minLength: 0
        tipo:
          type: string
          description: "Que clase de financiador es. CLASIFICA y no habilita: ninguna\
            \ regla del sistema ramifica por este valor. PARTICULAR no esta en la\
            \ lista a proposito, es una modalidad y no un financiador (RN-M15-004)"
          enum:
          - OBRA_SOCIAL
          - PREPAGA
          - ART
          - MUTUAL
          - ORGANISMO_PUBLICO
          - OTRO
          example: PREPAGA
      required:
      - codigo
      - nombre
      - tipo
    CreateInvitacionRequest:
