        limits:
          type: array
          description: Limites cuantitativos que impone el plan
          items:
            $ref: "#/components/schemas/PlanLimitResponse"
        name:
          type: string
          description: Nombre comercial del plan
          example: Basico
    PlatformRoleResponse:
