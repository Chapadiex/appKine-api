  /api/v1/personas/{personaId}/coberturas:
    get:
      description: |-
        Devuelve TODAS las coberturas del paciente, mas nuevas primero, incluidas las dadas de baja y las de vigencia vencida. Es deliberado: RN-M08-003 y la regla maestra 10 exigen que se pueda explicar con que cobertura se atendio al paciente el mes pasado.

        estado filtra el CICLO DE VIDA y por defecto trae todas. NO filtra por vigencia: una cobertura ACTIVA con la vigencia cerrada es el caso normal de un paciente que cambio de obra social, y se devuelve con vigente = false.

        fecha es el dia contra el que se calculan vigente y credencialVencida. Si se omite, hoy.

        El texto del financiador y del plan es la COPIA congelada al firmar, no una lectura del catalogo de hoy.
      operationId: listCoberturasDePaciente
