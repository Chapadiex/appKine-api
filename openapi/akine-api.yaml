    DiaDeAgenda:
      type: object
      description: "Un dia resuelto: o tiene slots, o tiene motivo"
      properties:
        fecha:
          type: string
          format: date
          description: Fecha local de la sede
          example: 2026-09-15
        motivoSinSlots:
          type: string
          description: "Por que el dia no tiene ningun slot. Ausente si el dia SI\
            \ tiene slots. Nunca falta cuando la lista esta vacia: un dia en blanco\
            \ sin explicacion es indistinguible de un error del sistema."
          enum:
          - FERIADO
          - CIERRE
          - VINCULO
          - SIN_HORARIO
          - OFERTA_NO_VIGENTE
          - SIN_PROFESIONAL
          - SIN_ESPACIO
          - FRANJA_MAS_CORTA_QUE_LA_OFERTA
          - COMPLETO
          example: FERIADO
        slots:
          type: array
          description: "Slots del dia, ordenados por instante de inicio"
          items:
            $ref: "#/components/schemas/SlotDisponible"
    DiaEfectivoResponse:
      type: object
      description: "Un dia de la ventana, con sus franjas y con la razon si quedo\
        \ vacio"
      properties:
        esFeriado:
          type: boolean
          description: "Si la fecha es feriado del pais de la sede. Es el HECHO del\
            \ calendario, no la decision de la sede: vale true aunque el centro atienda\
            \ ese dia"
          example: false
        fecha:
          type: string
          format: date
          description: Fecha local del dia
          example: 2026-09-07
        feriadoNombre:
          type: string
          description: "Nombre del feriado, o null si no lo hay. Sin el, la pantalla\
            \ dice \"cerrado\" y no puede decir por que"
          example: Dia de la Independencia
        franjas:
          type: array
          description: "Franjas de atencion del dia, ya en instantes UTC. Vacia si\
            \ el dia no tiene atencion"
          items:
            $ref: "#/components/schemas/FranjaResueltaResponse"
        razonVacio:
          type:
          - string
          - "null"
          description: |-
            Por que el dia no tiene ni una franja. CUATRO estados, y confundir dos de ellos manda al administrador a buscar algo que no existe:

            FERIADO — es feriado del pais y la sede cierra los feriados.

            CIERRE — una excepcion de tipo CIERRE tapo el dia entero. reglaVacio trae su id para linkearla.

            VINCULO — el vinculo del profesional NO estaba vigente ese dia: todavia no se habia incorporado, o ya se habia desvinculado. NO es lo mismo que "no atiende ese dia", y mostrarle el mismo cartel a los dos hace que un admin busque un cierre que no existe.

            null — cuarto estado, y no un descuido: o el dia TIENE franjas, o quedo vacio porque NINGUNA regla lo abrio. Eso no es una regla que lo afecte, es la ausencia de reglas, y se distingue mirando franjas.

            NO se declara como enum en el contrato aunque la lista sea cerrada: un campo nullable con enum se publica en OpenAPI 3.1 como un tipo que ADMITE el nulo junto a un enum que NO lo contiene, y un cliente generado con validacion estricta rechazaria nuestra propia respuesta la primera vez que un dia llegue sin razon. La enumeracion vive en esta prosa a proposito.
          example: CIERRE
        reglaVacio:
          type: integer
          format: int64
          description: "Id de la fila que vacio el dia, para que la pantalla pueda\
            \ linkearla. null cuando la regla no tiene id que ofrecer: un feriado\
            \ se resuelve por fecha, no por id de excepcion"
          example: 7
    DisponibilidadEfectivaResponse:
      type: object
      description: "Disponibilidad efectiva de un profesional en una sede, dia por\
