  /api/v1/personas/{personaId}/autorizaciones/{autorizacionId}/estado:
    post:
      description: |-
        RF-M17-001. Exige paciente:manage sobre la sede del contexto.

        RECIBE UNA ACCION, NO UN ESTADO DESTINO. Con un estado destino, pedir APROBADA sobre una autorizacion RECHAZADA seria una peticion valida que el servidor tiene que rechazar por semantica, y el cliente podria construir cualquier transicion imaginable. Con una accion, la unica forma de llegar a APROBADA es APROBAR, y el conjunto de transiciones posibles queda del lado del backend.

        Transiciones: PENDIENTE y OBSERVADA admiten las tres acciones. APROBADA y RECHAZADA son TERMINALES y responden 409 autorizacion-transicion-no-permitida. Corregir una decision tomada es dar de baja la autorizacion y cargar otra: si una aprobada pudiera volver a PENDIENTE, el saldo que ya se conto para atender a alguien desapareceria retroactivamente.

        APROBACION CONCURRENTE: es el mismo mecanismo. El segundo en llegar encuentra la autorizacion ya resuelta y recibe 409, no un 200 que aprueba dos veces.

        AUTORIZACION PARCIAL: al APROBAR, cantidadAutorizada y las vigencias pisan a las declaradas al cargar. El financiador puede otorgar seis sesiones donde se pidieron veinte, o una ventana mas corta: lo que vale es lo que concedio.

        motivo es OBLIGATORIO al OBSERVAR y al RECHAZAR. Sin el, el mostrador no sabe que corregir.
      operationId: resolverAutorizacion
