          example: 20
        modalidad:
          type: string
          description: Modalidad pactada
          example: POR_PRESTACION
        moneda:
          type: string
          description: ISO 4217
          example: ARS
        motivo:
          type: string
          description: Por que no hay arancel. Null cuando resuelto = true. SIN_CONVENIO_VIGENTE
            significa que la prestacion no tiene cobertura pactada y se cobra como
            particular; SIN_ARANCEL_VIGENTE significa que el convenio existe pero
            esa practica no esta tarifada para esa fecha
