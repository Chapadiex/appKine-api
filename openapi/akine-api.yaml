          example: ana.perez@ejemplo.test
        accountId:
          type: integer
          format: int64
          description: Cuenta vinculada
          example: 18
        accountName:
          type: string
          description: Nombre completo de la cuenta vinculada. null si la cuenta no
            se pudo resolver
          example: Ana Perez
        active:
          type: boolean
          description: "Baja logica: false cuando el vinculo ya no cuenta"
          example: true
        consultorioId:
          type: integer
          format: int64
          description: "Sede a la que esta acotado, o null si alcanza toda la organizacion"
          example: 3
        estado:
          type: string
          description: Estado del vinculo
          enum:
          - ACTIVA
          - SUSPENDIDA
          - REVOCADA
          example: ACTIVA
        founder:
          type: boolean
