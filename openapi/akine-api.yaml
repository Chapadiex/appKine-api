    Agenda:
      type: object
      description: "Turnos disponibles de una oferta en una ventana de fechas. Los\
        \ slots se calculan al leer y no se persisten: un slot devuelto no es una\
        \ reserva ni la garantiza."
      properties:
        consultorioId:
          type: integer
          format: int64
          description: Sede de la oferta
          example: 7
        dias:
          type: array
          description: "Una entrada por cada fecha de la ventana, en orden ascendente"
