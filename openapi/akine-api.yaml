          example: Box 1
          maxLength: 160
          minLength: 0
        notes:
          type: string
          description: Observacion operativa libre. Nunca contenido clinico
          maxLength: 280
          minLength: 0
        tipo:
          type: string
          description: "Clasificacion fisica del recurso. Si se omite, BOX. NO habilita\
            \ servicios ni define roles: eso lo resuelve la habilitacion por Oferta\
