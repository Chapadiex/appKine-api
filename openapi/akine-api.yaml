          enum:
          - BOX
          - GIMNASIO
          - GABINETE
          - SALA_GRUPAL
          - PILETA
          - OTRO
          example: BOX
        validFrom:
          type: string
          format: date-time
          description: "Instante UTC desde el que el espacio esta en servicio. Si\
            \ se omite, el momento del alta. Es la ventana OPERATIVA, distinta de\
            \ la baja logica"
          example: 2026-09-01T00:00:00Z
        validUntil:
          type: string
          format: date-time
          description: "Instante UTC hasta el que esta en servicio, EXCLUSIVO. Omitirlo\
            \ significa sin fin previsto, que es lo normal"
          example: 2027-01-01T00:00:00Z
      required:
      - name
    CreateExcepcionRequest:
      type: object
      description: Datos para dar de alta un cierre o una apertura puntual
      properties:
        fechaDesde:
          type: string
          format: date
          description: Primer dia cubierto por la excepcion
          example: 2026-09-07
        fechaHasta:
          type: string
          format: date
          description: "Primer dia YA NO cubierto, EXCLUSIVO. Un cierre de un solo\
            \ dia se carga como [D, D+1)"
          example: 2026-09-08
        feriadoId:
          type: integer
          format: int64
          description: "Feriado que motivo la excepcion, para trazar el origen cuando\
            \ la carga nace del calendario nacional"
          example: 5
        horaDesde:
          type: string
          description: Hora local de inicio. OMITIRLA junto con horaHasta significa
            DIA COMPLETO. Vienen las dos o ninguna
          example: 14:00
        horaHasta:
          type: string
          description: "Hora local de fin, EXCLUSIVA. 24:00 para llegar a la medianoche.\
            \ Viene junto con horaDesde o no viene ninguna"
          example: 18:00
        membershipId:
          type: integer
          format: int64
          description: "Vinculo del profesional al que se le carga la excepcion. OMITIRLO\
            \ significa SEDE ENTERA —afecta a TODOS los profesionales—, no un dato\
            \ faltante"
          example: 1
        motivo:
          type: string
          description: "Motivo, de lista cerrada, para que un reporte pueda agrupar\
