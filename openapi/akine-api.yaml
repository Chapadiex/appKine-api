          example: 3
          minimum: 0
      required:
      - version
    GuardarEvaluacion:
      type: object
      description: "Evaluacion base de la atencion. Todos los campos clinicos son\
        \ opcionales: una sesion de seguimiento carga dolor y evolucion y nada mas."
      properties:
        dolorEva:
          type: integer
          format: int32
          description: "Escala visual analogica, 0 a 10"
          example: 6
          maximum: 10
          minimum: 0
        dolorLateralidad:
          type: string
          description: "De que lado. `NO_APLICA` no es lo mismo que dejarlo vacio:\
            \ una zona central no tiene lado, y decirlo distingue \"no corresponde\"\
            \ de \"no lo cargue\". **Exige zona**: \"derecha\" de que."
          enum:
          - IZQUIERDA
          - DERECHA
          - BILATERAL
          - NO_APLICA
          example: NO_APLICA
        dolorZona:
          type: string
          description: Zona corporal referida
          example: Lumbar
          maxLength: 120
          minLength: 0
        evolucion:
          type: string
          description: "Como viene respecto de la sesion anterior. `SIN_REFERENCIA`\
            \ es el de la primera sesion: decir \"igual\" cuando no hay contra que\
            \ comparar seria inventar un dato clinico."
          enum:
          - MEJOR
          - IGUAL
          - PEOR
          - SIN_REFERENCIA
          example: MEJOR
        limitacionFuncional:
          type: string
          description: Que no puede hacer el paciente hoy
          example: No puede atarse los cordones
          maxLength: 500
          minLength: 0
        modo:
          type: string
          description: "Como se carga. **No condiciona que campos hacen falta**: es\
            \ una decision de la pantalla sobre cuanto mostrar. Si condicionara campos,\
            \ un profesional que empieza en rapida y necesita anotar una cosa mas\
            \ tendria que cambiar de modo en medio de una atencion."
          enum:
          - RAPIDA
          - COMPLETA
          example: RAPIDA
        motivoClinico:
          type: string
          description: "Lo que trae al paciente, en palabras del profesional. **No\
            \ es un diagnostico**: el diagnostico es un acto medico que este sistema\
            \ no registra."
          example: "Dolor lumbar al agacharse, desde hace dos semanas"
          maxLength: 500
          minLength: 0
        objetivoSesion:
          type: string
          description: "Que se busca en ESTA sesion. Distinto del objetivo del Plan\
            \ de Tratamiento (M11), que es del tratamiento completo."
          example: Reducir dolor en flexion
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          description: Version que el cliente leyo. Un 409 `concurrent-modification`
            significa que alguien guardo antes y hay que recargar.
          example: 3
          minimum: 0
      required:
      - version
