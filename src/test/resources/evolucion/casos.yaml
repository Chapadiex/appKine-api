    objetivo: Aumentar la tolerancia al esfuerzo y disminuir la disnea
    objetivosPlan: Entrenamiento aeróbico, ejercicios respiratorios y técnicas de conservación de la energía
    plan: {estado: ACTIVO, frecuencia: 2, duracion: 8}
    sesiones:
