    sesiones:
      evolucion: [IGUAL, IGUAL, IGUAL, IGUAL]
      tolerancia: [BUENA, BUENA, BUENA, BUENA]
      medicion: {nombre: Velocidad de marcha en 10 metros, unidad: m/s, valores: [0.8, 0.8, 0.82, 0.8]}
      tratamientos: [Entrenamiento de la marcha, Ejercicios de equilibrio]
    textos:
      - {respuesta: Sin cambios, limitacion: Pasos cortos al girar, nota: Se mantiene}
      - {respuesta: Sin cambios, limitacion: Igual, nota: Se mantiene}
      - {respuesta: Estable, limitacion: Refiere un tropiezo en la casa, nota: Se repite el circuito}
    hallazgos:
      - {codigo: MEDICION_SIN_CAMBIO, severidad: INFO, sesiones: [2, 3, 4], valores: {medicion: Velocidad de marcha en 10 metros, unidad: m/s, desde: "0.8", hasta: "0.8", sesiones: "3"}}
    esperado: {resultado: SUGERENCIAS}

  - id: M06
    grupo: CON_MATERIAL
    diagnostico: Fractura de cadera izquierda operada con artroplastia
