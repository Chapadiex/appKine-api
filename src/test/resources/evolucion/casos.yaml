      tolerancia: [REGULAR, MALA, MALA, MALA]
      tratamientos: [Entrenamiento aeróbico en cinta, Ejercicios respiratorios]
    textos:
      - {respuesta: Disnea intensa al terminar, limitacion: Tiene que parar cada 5 minutos, nota: Se baja la velocidad}
      - {respuesta: No completa la sesión, limitacion: Igual, nota: Se agregan pausas}
      - {respuesta: Termina agotado y con disnea, limitacion: Le cuesta vestirse solo, nota: Continúa}
    hallazgos:
      - {codigo: MALA_TOLERANCIA, severidad: ATENCION, sesiones: [2, 3, 4], valores: {valor: MALA, seguidas: "3"}}
    esperado: {resultado: SUGERENCIAS}

  - id: M05
    grupo: CON_MATERIAL
    diagnostico: Enfermedad de Parkinson, estadio 2 de Hoehn y Yahr
    objetivo: Mantener la velocidad de marcha y prevenir caídas
