    textos:
      - {respuesta: Bien, limitacion: Usa andador, nota: Se progresa}
      - {respuesta: Más lenta, limitacion: Usa andador, nota: Se mantiene}
      - {respuesta: Refiere miedo a caerse, limitacion: No quiere caminar sin andador, nota: Se trabaja confianza}
    hallazgos:
