DOLOR_SIN_MEJORA=dolor persistente sin respuesta al tratamiento, progresión y dosificación del ejercicio terapéutico
DOLOR_EN_AUMENTO=aumento del dolor durante el tratamiento, ajuste de la carga y reevaluación del cuadro
EVOLUCION_DESFAVORABLE=evolución desfavorable durante la rehabilitación, reevaluación y cambio de estrategia terapéutica
MALA_TOLERANCIA=mala tolerancia a las sesiones de tratamiento, dosificación y adaptación de la carga
MEDICION_SIN_CAMBIO=medición funcional sin cambio con el tratamiento, estancamiento y progresión del programa
MEDICION_EMPEORA=empeoramiento de una medición funcional durante el tratamiento, reevaluación y ajuste del programa
BAJA_ADHERENCIA=baja adherencia al tratamiento, ausencias a las sesiones y estrategias para mejorar la asistencia
FRECUENCIA_BAJO_PLAN=frecuencia de sesiones menor a la planificada, dosis del tratamiento y continuidad de la rehabilitación
PLAN_EXCEDIDO_EN_TIEMPO=duración del tratamiento mayor a la planificada, reevaluación de objetivos y criterios de alta
