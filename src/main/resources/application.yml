# Configuracion base de akine-api.
#
# REGLA: este archivo NO contiene secretos. Todo valor sensible se inyecta por variable de
# entorno con la sintaxis ${VAR}. Un secreto commiteado es un incidente, no un descuido.
#
# Los perfiles concretos viven en application-<perfil>.yml. El perfil local se activa con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring:
  application:
    name: akine-api

  # NO hay `profiles.default`. Lo habia —`default: local`— y contradecia su propio comentario:
  # arrancar sin SPRING_PROFILES_ACTIVE equivalia a arrancar en desarrollo, o sea que un
  # despliegue al que se le olvidara la variable de entorno heredaba la configuracion comoda
  # (incluido el secreto de firma publico de application-local.yml). El perfil de desarrollo se
  # pide explicitamente:
  #   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

  datasource:
    url: ${AKINE_DB_URL}
    username: ${AKINE_DB_USER}
    password: ${AKINE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Flyway es la unica autoridad sobre el esquema. Hibernate no crea ni altera tablas:
    # si falta una tabla, falta una migracion.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Fechas persistidas como instantes UTC (AGENT.md seccion 5).
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      # Adjuntos administrativos (M25, AKINE-03.02).
      #
      # ESTOS TOPES SON DEL CONTENEDOR Y TIENEN QUE QUEDAR POR ENCIMA del tope de la aplicacion
      # (akine.person.adjuntos.max-bytes, 10 MB por defecto). Si el mas chico fuera el de aca, el
      # rechazo llegaria como MaxUploadSizeExceededException —un error de plataforma— y el
      # operador recibiria un 500 generico en vez del 400 archivo-no-aceptado que le explica que
      # su archivo pesa demasiado. El margen tambien cubre el overhead del propio multipart:
      # cabeceras de parte y los campos de categoria y titulo.
      max-file-size: 15MB
      max-request-size: 16MB

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        # Fechas como ISO-8601, nunca como epoch. Un timestamp numerico pierde la zona y
        # obliga a cada consumidor a reinterpretarlo.
        #
        # OJO: en Jackson 3 (el que trae Boot 4) esta feature dejo de vivir en
        # SerializationFeature y paso a DateTimeFeature. La clave vieja
        # spring.jackson.serialization.write-dates-as-timestamps ya no bindea y rompe el
        # arranque del contexto.
        write-dates-as-timestamps: false

server:
  port: ${AKINE_PORT:8080}
  error:
    # Nunca exponer stack traces al cliente. El detalle va al log.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Solo lo necesario. Ampliar endpoint por endpoint, con justificacion.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

akine:
  application:
    version: ${AKINE_APP_VERSION:0.0.1-SNAPSHOT}
  # Version SemVer del contrato OpenAPI publicado. Debe coincidir con la propiedad
  # akine.contract.version del pom.xml.
  contract:
    version: 0.60.0
  security:
    cors:
      # Nunca comodin: allowCredentials(true) lo prohibe y el frontend necesita credentials
      # para el refresh token en cookie httpOnly (F1).
      allowed-origins: ${AKINE_CORS_ORIGINS:http://localhost:4200}
    jwt:
      # Secreto de firma del access token. SIN DEFAULT (ADR-0017): sin este valor la
      # aplicacion NO ARRANCA. Minimo 32 bytes, por variable de entorno, jamas versionado.
      # El valor de desarrollo —publico— vive solo en application-local.yml, asi que solo
      # existe con un perfil de desarrollo activo.
      secret: ${AKINE_JWT_SECRET:}
      # Vigencia del access token. Es tambien la ventana durante la cual una cuenta recien
      # bloqueada conserva acceso (ADR-0017 D-3): subirlo la agranda, bajarlo multiplica
      # los refresh.
      access-ttl: 10m
    rate-limit:
      # Limite de intentos sobre login, refresh, pedido de reset y reenvio de activacion.
      # La clave es ruta + IP y NUNCA el email: un limite por cuenta seria un oraculo de
      # existencia y tiraria abajo la uniformidad de ADR-0018.
      #
      # OJO: el contador vive en la memoria del proceso. Con mas de una instancia el limite
      # se multiplica por la cantidad de instancias.
      enabled: ${AKINE_RATE_LIMIT_ENABLED:true}
      window: 1m
      max-attempts: 30
      # El alta self-service tiene su propio cupo, mucho mas chico. No es el mismo problema
      # que el login: cada request con un email libre crea cuenta + organizacion +
      # consultorio + suscripcion + membership, y cada request con un email ya registrado
      # le encola un correo al buzon de la victima. Ademas es el endpoint que ADR-0018 llama
      # "el mas facil de automatizar de todos" y en el que apoya su 202 uniforme.
      # Registrarse es un acto unico: cinco intentos por minuto le sobran a una persona.
      register-max-attempts: 5
      # Alta directa de colaboradores (POST /api/v1/memberships). Tercer cupo, entre los otros
      # dos. Ese endpoint responde 404 cuando el email no tiene cuenta, o sea que distingue
      # direcciones registradas de las que no: un ORG_ADMIN comprometido podria enumerar la base
      # del SaaS entero. Este limite es UNA de las dos mitigaciones obligatorias que hacen
      # aceptable ese 404; la otra es auditar cada intento fallido en el tenant
      # (MEMBERSHIP_ALTA_RECHAZADA). Retirar cualquiera de las dos obliga a rediscutir el codigo.
      # No son 30 porque no hay reintento honesto que proteger —no se tipea ninguna contrasena—,
      # y no son 5 porque incorporar un equipo entero de una sentada es un uso legitimo.
      membership-max-attempts: 10

  notification:
    email:
      # log | smtp. El default 'log' registra el mensaje y NO envia nada: sirve para
      # desarrollo y NO se acepta fuera de los perfiles de desarrollo, donde la aplicacion
      # no arranca en ese modo (NotificationConfig). Un despliegue en modo log responde 202
      # a cada activacion y a cada recuperacion y tira el correo sin dejar rastro, que es la
      # forma mas silenciosa de romper ADR-0018.
      mode: ${AKINE_EMAIL_MODE:log}
      # Remitente. El valor de abajo es el de desarrollo, esta versionado y su dominio no es
      # enrutable: fuera de un perfil de desarrollo hay que definir AKINE_MAIL_FROM.
      from: ${AKINE_MAIL_FROM:no-reply@akine.local}
      base-url: ${AKINE_PUBLIC_BASE_URL:http://localhost:4200}
      smtp:
        # SIN DEFAULT, misma regla que el secreto de firma del JWT (ADR-0017): en modo smtp,
        # sin este valor la aplicacion NO ARRANCA. Un default comodo aca seria un despliegue
        # apuntando a un servidor que no es el suyo, descartando cada correo en silencio.
        host: ${AKINE_MAIL_HOST:}
        port: ${AKINE_MAIL_PORT:587}
        username: ${AKINE_MAIL_USER:}
        # Jamas versionada.
        password: ${AKINE_MAIL_PASSWORD:}
        # starttls | ssl | ninguna. 'ninguna' manda la contrasena del relay en claro y solo
        # se acepta en perfiles de desarrollo.
        transport-security: ${AKINE_MAIL_TRANSPORT_SECURITY:starttls}
        # Tope para conectar, leer y escribir. Sin esto JavaMail espera para siempre y un
        # relay que no contesta deja colgado al worker con el lote entero en PROCESANDO.
        timeout: 10s

  bootstrap:
    # DP-14 (AKINE-A-4). Casilla a la que se re-apunta la cuenta de plataforma sembrada por V15
    # al arrancar, si no hay ningun administrador de plataforma con credencial. Se le encola un
    # enlace de activacion y la persona fija su contrasena ahi. Vacia = no hace nada. No es un
    # secreto, pero tampoco se versiona: es la casilla de quien opera cada despliegue.
    admin-email: ${AKINE_BOOTSTRAP_ADMIN_EMAIL:}

  identity:
    session:
      # Vigencia ABSOLUTA de la sesion de refresh desde el login (ADR-0017). La rotacion NO
      # la extiende: una sesion robada no se vuelve eterna por usarla.
      refresh-ttl: 12h

  clinical:
    adjuntos:
      # Raiz del almacenamiento de BINARIOS CLINICOS (M09/M25, AKINE-04.02).
      #
      # ES OTRA RAIZ, Y ESA ES LA DECISION. Los adjuntos administrativos viven bajo
      # akine.person.adjuntos.base-dir y estos no comparten su directorio: separar los binarios
      # clinicos en el sistema de archivos habilita otro volumen, otro cifrado en reposo, otra
      # politica de backup y otra de retencion, sin tocar una linea de codigo. Es un control
      # real y no una consecuencia. Son directorios HERMANOS y no uno dentro del otro a
      # proposito: un subdirectorio se lleva puesta la separacion en cuanto alguien monta un
      # volumen sobre el padre.
      base-dir: ${AKINE_CLINICAL_ADJUNTOS_DIR:./var/adjuntos-clinicos}
      # Tope de un archivo clinico. TIENE que quedar por debajo de
      # spring.servlet.multipart.max-file-size (15MB, mas arriba): si el tope del contenedor
      # fuera el mas chico, el rechazo llegaria como error de plataforma y el profesional
      # recibiria un 500 generico en vez del 400 que explica que su archivo pesa demasiado.
      # Subir de aca exige subir primero el del contenedor, que afecta tambien a M07/M25.
      max-bytes: ${AKINE_CLINICAL_ADJUNTOS_MAX_BYTES:10485760}

logging:
  level:
    root: INFO
    com.akine: INFO
