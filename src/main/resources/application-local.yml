# Perfil local de desarrollo.
#
# Los valores de abajo son los del compose.yaml de este repo: una base LOCAL, efimera y
# poblada exclusivamente con datos sinteticos. No son secretos y no existen fuera de tu
# maquina.
#
# Si cambias el compose.yaml, cambia esto tambien.

spring:
  datasource:
    url: ${AKINE_DB_URL:jdbc:mysql://localhost:3306/akine_local?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${AKINE_DB_USER:akine}
    password: ${AKINE_DB_PASSWORD:akine}

  jpa:
    properties:
      hibernate:
        format_sql: true

akine:
  security:
    jwt:
      # Secreto de firma de DESARROLLO. Es publico —esta versionado— y por eso vive ACA y no
      # en application.yml: solo existe si este perfil esta activo. Fuera de un perfil de
      # desarrollo, presentarlo impide el arranque (JwtEmitter), igual que no presentar
      # ninguno. Para trabajar contra datos que importen, exportar AKINE_JWT_SECRET.
      secret: ${AKINE_JWT_SECRET:akine-desarrollo-secreto-de-firma-no-usar-en-produccion}

  notification:
    email:
      # En local se envia DE VERDAD, contra el Mailpit del compose.yaml. La bandeja se mira en
      # http://localhost:8025 y nada sale de esta maquina.
      #
      # Por que smtp y no log: el modo log deja el circuito a medias —el correo se registra y
      # se descarta— y con el no se puede verificar lo unico que importa del canal, que es que
      # el mensaje llegue con su enlace. Para volver al modo log sin tocar este archivo:
      #   AKINE_EMAIL_MODE=log ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
      mode: ${AKINE_EMAIL_MODE:smtp}
      smtp:
        host: ${AKINE_MAIL_HOST:localhost}
        port: ${AKINE_MAIL_PORT:1025}
        # Mailpit local: sin usuario, sin contrasena y sin TLS. No hay ningun secreto que
        # versionar. 'ninguna' SOLO se acepta en perfiles de desarrollo; fuera de ellos
        # NotificationConfig no arranca con este valor.
        transport-security: ${AKINE_MAIL_TRANSPORT_SECURITY:ninguna}

logging:
  level:
    com.akine: DEBUG
    org.flywaydb: INFO
  structured:
    format:
      # En local el log sale en TEXTO, legible a ojo, con [app,traceId,spanId,requestId] en
      # cada linea. Para ver el JSON que sale en los demas perfiles:
      #   AKINE_LOG_FORMAT=logstash ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
      console: ${AKINE_LOG_FORMAT:}

management:
  endpoint:
    health:
      # Solo en local: ver el detalle del health ayuda a diagnosticar la conexion a la DB.
      show-details: always
